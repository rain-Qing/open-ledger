<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>家庭账本</title>
<!-- 主屏幕相关：iOS 只有带这些声明，从桌面图标打开才是全屏 App 形态
     （没有 Safari 地址栏和工具栏，可视区多出约 100px） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="账本">
<!-- 图标：iOS 既不吃 data: URI 的图标，也不吃 SVG 版 favicon。之前 PNG 排在
     data: SVG 后面，桌面书签就退化成黑底「家」字默认图。必须 PNG 在前、真实 URL。 -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  /* ===== 设计令牌（契约见 docs/设计规范.md §2.2 紧凑刻度）=====
     页面里不写字号、圆角、字重、间距的字面量，一律取这里的变量。
     要加新尺寸，先改这张表再改代码；顺序不能反。 */

  /* ---- 颜色 ---- */
  --bg:#faf9f7; --card:#fff; --ink:#1b1b1d; --muted:#6d6d73; --faint:#9a9aa1;
  --line:#e8e6e2; --accent:#2f6f5e; --accent-soft:#e8f1ee;
  --expense:#1b1b1d; --income:#2f6f5e; --refund:#b45309; --danger:#b3261e;
  /* 明细行的方向底色：支出保持白卡，只有收入/退款上色。
     彩色的都是「需要抬头看一眼」的，成堆的支出保持安静 */
  --income-soft:#f3f8f5; --refund-soft:#fdf7ef; --rail:#d9d6cf;
  --fill:#f4f2ef; --fill-2:#f0eeea;

  /* ---- 字号：8 级 ---- */
  --fs-micro:11px;   /* 角标、单位、极小注解 */
  --fs-aux:12px;     /* 日期、备注、说明文字 */
  --fs-sm:13px;      /* 次级正文 */
  --fs-body:14px;    /* 正文、分类名 */
  --fs-em:16px;      /* 按钮、输入框 */
  --fs-title:20px;   /* 页面标题、区块标题 */
  --fs-num:28px;     /* 统计数字 */
  --fs-hero:34px;    /* 主金额（记一笔的输入、余额） */

  /* ---- 圆角：5 级 ---- */
  --r-xs:6px;        /* 徽标、角标 */
  --r-sm:10px;       /* 输入框、小按钮 */
  --r-md:12px;       /* 卡片 */
  --r-lg:18px;       /* 弹层、大卡片 */
  --r-pill:999px;    /* 胶囊 */

  /* ---- 字重：3 级（不要再用 650 / 700 / 800）---- */
  --fw:400; --fw-mid:500; --fw-bold:600;

  /* ---- 间距：10 级，基数 2 ---- */
  --sp-1:2px; --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:10px;
  --sp-6:12px; --sp-7:14px; --sp-8:16px; --sp-9:24px; --sp-10:40px;

  /* ---- 动效 ---- */
  --ease:cubic-bezier(.25,.1,.25,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --d1:120ms; --d2:200ms; --d3:320ms;

  --ptr-h:56px;      /* 下拉刷新指示器高度，负偏移也从它算 */

  --radius:var(--r-md);
  --nav-h:62px; /* 底栏高度，由 JS 实测后覆写，body 下边距 / toast 位置都引用它 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* overflow-x:clip 是「弹层被切」的兜底：页面只要有一处横向溢出，iOS/WebView 会把
   布局视口一起撑宽，而所有 position:fixed 的层（弹层、底栏）都按视口宽度渲染，于是
   右侧被切掉——2026-10-29 的「所有二级窗口显示不全」就是这么来的（源头是汇总行）。
   用 clip 而不是 hidden：hidden 会造出滚动容器（还会让 sticky 头失效），clip 只是裁掉，
   不产生可滚动区域，也就不会撑宽视口。 */
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
/* 注意：body 不能写死 height:100%。否则内容超出时是「溢出 body 盒子」，
   padding-bottom 就落不到内容末尾，最后一屏正好被固定底栏盖住。 */
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--sp-7));
  overflow-x:clip;  /* 兜底：任何一处超宽都不该让整页可横向拖动 / 触发 iOS 缩放 */
}
button,input,select,textarea{font:inherit;color:inherit}
/* iOS Safari 的输入框字号小于 16px 时，一聚焦就把整页放大，而且按站点记住缩放级别
   ——「点开就大了一点、要双指缩小」正是这个（body 是 15px，font:inherit 会把输入框
   也带到 15px）。输入控件一律 16px 起；#amount 的 44px 是 id 选择器，不受影响。 */
input,select,textarea{font-size:var(--fs-em)}
button{cursor:pointer}
/* hidden 属性必须能压住 .row / .chips 这类带 display 的类，否则「隐藏」不生效
   （元素自带的 display:flex 会盖掉浏览器给 [hidden] 的 display:none） */
[hidden]{display:none!important}

/* ---------- 登录 ---------- */
#login{max-width:360px;margin:0 auto;padding:18vh var(--sp-9) var(--sp-9)}
#login h1{font-size:var(--fs-title);margin:0 0 var(--sp-2);letter-spacing:.5px}
#login p.sub{color:var(--muted);font-size:var(--fs-sm);margin:0 0 var(--sp-9)}
.field{margin-bottom:var(--sp-6)}
.field label{display:block;font-size:var(--fs-aux);color:var(--muted);margin-bottom:var(--sp-3)}
.field input,.field select,.field textarea{
  width:100%;padding:var(--sp-6) var(--sp-7);border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
/* 只读字段：冲抵记录的「方向 / 分类」是继承原单的，服务端保存时会强制覆盖。
   这里不给下拉——否则「选了、保存了、还是原样」，用户只会以为自己手滑。
   长得像只读输入框，一眼能看出「这不是我能填的」。 */
.field .ro{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);
  padding:var(--sp-6) var(--sp-7);border:1px solid var(--line);border-radius:var(--r-md);
  background:#f7f6f3;color:var(--ink);
}
.field .ro .ro-tag{
  flex:none;font-size:var(--fs-aux);color:var(--muted);background:#efeee9;
  border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-4);white-space:nowrap;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-3);
  padding:var(--sp-6) var(--sp-8);border:none;border-radius:var(--r-md);background:var(--accent);color:#fff;
  font-weight:var(--fw-bold);width:100%;transition:opacity .15s;
}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.small{width:auto;padding:var(--sp-4) var(--sp-7);font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
/* 提示文字里的行内小按钮（如差补「改回自动」），长得像链接、不占一行 */
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}

/* ---------- 记账提交：在途遮罩 + 结果抽屉 ---------- */
/* 为什么不再是页顶那张卡：卡片插在文档流最前面，而「记这笔」在页面最末尾——
   提交时视口停在底部，卡片渲染在视口之外，等于没提示。
   提示只要待在文档流里，它的可见性就取决于提交那一刻手指停在哪；改用模态，与滚动位置无关。 */

/* 在途遮罩：350ms 才浮出。本地请求 300~800ms 就回来，立即浮出只会闪一下、更让人不安。
   2.5s 文案升级，6s 放出「先看看明细」——拖到 6 秒基本只剩「连上了但不回数据」这一种情况。 */
.blocker{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(27,27,29,.42);align-items:center;justify-content:center;flex-direction:column;gap:var(--sp-7);
}
.blocker.on{display:flex}
.bl-card{
  display:flex;align-items:center;gap:var(--sp-5);background:var(--card);
  border-radius:var(--r-md);padding:var(--sp-7) var(--sp-8);font-size:var(--fs-body);color:var(--ink);
  box-shadow:0 6px 24px rgba(0,0,0,.14);
}
.spin{
  width:16px;height:16px;flex:none;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.bl-cancel{
  background:none;border:1px solid rgba(255,255,255,.6);color:#fff;
  border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-7);font-size:var(--fs-sm);
}

/* 结果抽屉：抄既有 .sheet 的形态（fixed + 底部滑入 + 安全区），
   和编辑弹层同一套语言，用户不用学第二遍 */
.rsp-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;display:none}
.rsp-mask.on{display:block}
.rsp{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:var(--r-lg) 18px 0 0;padding:var(--sp-8) var(--sp-8) calc(var(--sp-8) + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform var(--d3) var(--ease-out);
  max-width:720px;margin:0 auto;
}
.rsp.on{transform:translateY(0)}
.rsp-hd{display:flex;align-items:center;gap:var(--sp-4)}
.rsp-ic{
  width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-aux);font-weight:var(--fw-bold);line-height:1;
}
.rsp-title{font-size:var(--fs-em);font-weight:var(--fw-bold);color:var(--accent);letter-spacing:.3px;min-width:0}
.rsp-x{
  margin-left:auto;background:none;border:0;padding:0 var(--sp-2);line-height:1;
  font-size:var(--fs-title);color:var(--faint);flex:none;
}
.rsp-amt{
  font-size:var(--fs-num);font-weight:var(--fw-bold);letter-spacing:-.8px;margin:var(--sp-4) 0 var(--sp-1);
  font-variant-numeric:tabular-nums;
}
.rsp-meta{font-size:var(--fs-sm);color:var(--muted);line-height:1.6}
.rsp-note{font-size:var(--fs-sm);color:var(--ink);margin-top:var(--sp-2);word-break:break-word}
.rsp-tags{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4)}
.rsp-tag{
  font-size:var(--fs-aux);color:var(--accent);background:var(--accent-soft);
  border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-4);
}
/* 「记错了」是文字链不是按钮：撤销频率低，占主按钮位会干扰「确认」这个主要目的。
   拇指区留给高频的「记完了」，想连续记的人伸手 30px 就是「再记一笔」。 */
.rsp-act{display:flex;align-items:center;gap:var(--sp-4);margin-top:var(--sp-8);justify-content:flex-end}
.rsp-act button{white-space:nowrap}
.rsp-undo{
  margin-right:auto;background:none;border:0;padding:var(--sp-2) 0;font-size:var(--fs-sm);
  color:var(--danger);text-decoration:underline;
}
.rsp-undo:disabled{opacity:.5}
.rsp-more{
  background:transparent;border:1px solid var(--accent);color:var(--accent);
  border-radius:var(--r-sm);padding:var(--sp-5) var(--sp-7);font-size:var(--fs-body);
}
.rsp-ok{
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:var(--r-sm);padding:var(--sp-5) var(--sp-8);font-size:var(--fs-body);font-weight:var(--fw-bold);
}

/* ---------- 分类管理（管理员）----------
   一屏只看一棵树：方向胶囊 + 紧凑列表，点开哪行才展开子类和颜色。
   以前每个大类永远处于编辑态（名字输入框 + 10 个色块常驻），16 个大类铺两千多像素。 */
.cat-tabs{display:flex;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.cat-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.cat-item + .cat-item{border-top:1px solid var(--line)}
/* 占位块插在两项之间时，下面那项的顶边线还得在（原规则只管「项 + 项」） */
.cat-list > .cat-ph + .cat-item{border-top:1px solid var(--line)}
.cat-item.open{background:#fbfaf8}
.cat-hd{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-6) var(--sp-6);cursor:pointer;min-height:46px;
  -webkit-touch-callout:none;user-select:none}
.cat-hd:active{background:#f4f2ef}
/* 长按拖拽：拖动中的那一项脱离文档流跟着手指走，虚线块标出会落在哪。
   pointer-events:none 是必须的——否则 elementFromPoint 只会命中它自己，找不到下面的兄弟项 */
.cat-item.dragging{position:fixed;z-index:60;margin:0;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--card);box-shadow:0 12px 28px rgba(0,0,0,.18);pointer-events:none}
.cat-ph{border:1px dashed var(--accent);border-radius:var(--r-md);background:rgba(47,111,94,.05);
  pointer-events:none}
.cat-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cat-hd .nm{font-size:var(--fs-body);font-weight:var(--fw-bold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-hd .meta{font-size:var(--fs-aux);color:var(--faint);white-space:nowrap}
.cat-hd .arw{width:6px;height:6px;flex:none;margin-left:var(--sp-1);
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);transition:transform .15s}
.cat-item.open .arw{transform:rotate(-135deg)}
.cat-detail{padding:0 var(--sp-6) var(--sp-6)}
.cat-detail .f-label{font-size:var(--fs-aux);color:var(--muted);margin:var(--sp-6) 0 var(--sp-3)}
.cat-detail .f-label span{color:var(--faint);font-weight:var(--fw)}
.cat-detail input#cat-pname{
  width:100%;padding:var(--sp-4) var(--sp-5);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--ink);outline:none;
}
.cat-detail input#cat-pname:focus{border-color:var(--accent)}
.cat-err{font-size:var(--fs-aux);color:var(--danger);margin-top:var(--sp-2)}
.cat-swatches{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.cat-sw{width:22px;height:22px;border-radius:var(--r-xs);border:1px solid var(--line);padding:0}
.cat-subs{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.cat-sub{font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-5);border:1px solid var(--line);
  background:var(--card);border-radius:var(--r-sm);color:var(--ink);
  -webkit-touch-callout:none;user-select:none}
.cat-sub:active{background:#f4f2ef}
/* 子类拖动：同样是固定跟随 + 虚线占位（胶囊形状） */
.cat-sub.dragging{position:fixed;z-index:60;margin:0;background:var(--card);pointer-events:none;
  box-shadow:0 10px 22px rgba(0,0,0,.18);border-color:var(--accent)}
.cat-ph-sub{border:1px dashed var(--accent);border-radius:var(--r-sm);background:rgba(47,111,94,.06);
  pointer-events:none}
.cat-sub.edit{display:inline-flex;align-items:center;gap:var(--sp-1);padding:0 var(--sp-2) 0 var(--sp-4);
  border-color:var(--accent);background:var(--accent-soft)}
.cat-sub.edit input{width:62px;border:none;background:transparent;outline:none;
  font-size:var(--fs-sm);color:var(--ink);padding:var(--sp-2) 0}
.cat-sub.edit .x{color:var(--danger);font-size:var(--fs-em);line-height:1;padding:0 var(--sp-1);font-weight:var(--fw)}
.cat-sub-new{width:78px;font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-4);border:1px dashed var(--line);
  border-radius:var(--r-sm);background:transparent;color:var(--muted);outline:none}
.cat-sub-new:focus{border-color:var(--accent);border-style:solid}
.cat-addp{width:100%;margin-top:var(--sp-4);padding:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);
  background:transparent;border:1px dashed var(--line);border-radius:var(--r-sm);outline:none}
.cat-addp:focus{border-color:var(--accent);border-style:solid}
.cat-delp{width:100%;margin-top:var(--sp-7);padding:var(--sp-4);font-size:var(--fs-sm);border-radius:var(--r-sm);
  color:var(--danger);background:transparent;border:1px solid var(--line)}
.cat-delp.armed{background:#fbeceb;border-color:#f2d3d0;font-weight:var(--fw-bold)}
/* 未保存浮条：贴在底栏上方，改了才出现 */
.cat-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h,54px) + 8px);z-index:25;
  display:none;padding:0 var(--sp-8);max-width:720px;margin:0 auto}
.cat-bar.on{display:block}
.cat-bar-in{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.cat-bar-in .n{font-size:var(--fs-sm);color:var(--muted);flex:1}
.cat-spacer{height:52px}

/* ---------- 布局 ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(250,249,247,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.hd{max-width:720px;margin:0 auto;padding:var(--sp-7) var(--sp-8);display:flex;align-items:center;gap:var(--sp-5)}
.hd h2{font-size:var(--fs-em);margin:0;font-weight:var(--fw-bold);letter-spacing:.3px}
.hd .who{margin-left:auto;font-size:var(--fs-aux);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-out{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-5);font-size:var(--fs-aux);font-weight:var(--fw-bold);
}
.hd-out:active{background:#f4f2ef}
main{max-width:720px;margin:0 auto;padding:var(--sp-8)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:720px;margin:0 auto;display:flex}
.nav-in button{
  flex:1;background:none;border:none;padding:var(--sp-4) 0 var(--sp-5);color:var(--faint);
  font-size:var(--fs-micro);display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);
}
.nav-in button.on{color:var(--accent)}
.nav-in svg{width:21px;height:21px;stroke-width:1.7}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp-8);margin-bottom:var(--sp-6)}
.card h3{margin:0 0 var(--sp-6);font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--muted);letter-spacing:.4px}
.row{display:flex;align-items:center;gap:var(--sp-5)}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 记一笔 ---------- */
.seg{display:flex;gap:var(--sp-3);background:#f1efec;padding:var(--sp-2);border-radius:var(--r-md);margin-bottom:var(--sp-8)}
.seg button{flex:1;border:none;background:transparent;padding:var(--sp-4) 0;border-radius:var(--r-sm);font-size:var(--fs-body);color:var(--muted);font-weight:var(--fw-bold)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.amount-wrap{text-align:center;padding:var(--sp-4) 0 var(--sp-8)}
.amount-wrap .cur{font-size:var(--fs-title);color:var(--faint);vertical-align:6px}
#amount{
  border:none;background:transparent;text-align:center;width:100%;
  font-size:var(--fs-hero);font-weight:var(--fw-bold);letter-spacing:-1px;outline:none;
  padding:0;font-variant-numeric:tabular-nums;
}
#amount::placeholder{color:#d8d6d2}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-4)}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);
  padding:var(--sp-3) var(--sp-6);font-size:var(--fs-sm);color:var(--muted);
}
.chip.on{background:var(--accent-soft);border-color:#bfd8cf;color:var(--accent);font-weight:var(--fw-bold)}
/* 标记胶囊的第二态「排除」：红底 + ✕，跟「没选中」的白底必须一眼分得开，
   否则用户以为筛选没生效（2026-10-29 反选） */
.chip.ex{background:#fbeceb;border-color:#f2d3d0;color:var(--danger);font-weight:var(--fw-bold)}
#f-marks .chip.ex::before{content:"✕ "}
.chip.sub{font-size:var(--fs-sm);padding:var(--sp-3) var(--sp-5)}
/* 带固定底色的胶囊：--c 主色 / --bg 浅底 / --ink 文字色，由 JS 按账号或分类注入 */
.chip.pchip,.chip.cchip{background:var(--bg);border-color:transparent;color:var(--ink)}
.chip.pchip.on,.chip.cchip.on{
  background:var(--bg);border-color:var(--c);color:var(--ink);font-weight:var(--fw-bold);
  box-shadow:inset 0 0 0 1px var(--c);
}
.chip.sub.on{background:var(--bg);border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}
.toggles{display:flex;gap:var(--sp-4);flex-wrap:wrap}
/* 编辑弹层有 4 个开关，一行放不下，排成整齐的两列 */
.toggles.grid4{display:grid;grid-template-columns:1fr 1fr}
.tg{
  flex:1;min-width:96px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);
  padding:var(--sp-5) var(--sp-4);text-align:left;display:flex;align-items:center;gap:var(--sp-4);justify-content:center;
}
.tg .dot{width:17px;height:17px;border-radius:50%;border:1.5px solid #cbc9c4;flex:none}
.tg.on{border-color:#bfd8cf;background:var(--accent-soft)}
.tg.on .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.tg span{font-size:var(--fs-sm)}
/* 有报销到账记录时「已报销」锁死：状态由那条记录决定，不能在这里翻 */
.tg[disabled]{opacity:.5}
.tg[disabled] .dot{border-style:dashed}
/* 报销状态被锁时的说明块：先讲为什么，再让人看到两个灰掉的开关。
   放在开关下面时它像脚注，用户根本不会往下看——挪到上面并加了底色 */
.lock-note{
  margin:var(--sp-7) 0 var(--sp-3);padding:var(--sp-5) var(--sp-6);border-radius:var(--r-md);
  background:#fdf7ec;border:1px solid #f0e2c8;color:#8a6320;
  font-size:var(--fs-sm);line-height:1.65;
}
.lock-note b{display:block;margin-bottom:var(--sp-1);font-size:var(--fs-sm);color:#6f4f16}

/* AI */
.ai-box{display:flex;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.ai-box input{flex:1;min-width:0;padding:var(--sp-5) var(--sp-6);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);outline:none}
.ai-box button{white-space:nowrap;padding:0 var(--sp-8);border:none;border-radius:var(--r-md);background:#1b1b1d;color:#fff;font-size:var(--fs-sm);font-weight:var(--fw-bold)}
.ai-box button:disabled{opacity:.5}
/* 拍图按钮刻意做成浅色描边，跟主按钮拉开层次：主操作还是「说一句」 */
.ai-box .ai-pic{flex:none;width:42px;padding:0;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--muted)}
.ai-box .ai-pic svg{width:19px;height:19px;stroke-width:1.6}
.ai-shot{position:relative;margin:-var(--sp-2) 0 var(--sp-6)}
.ai-shot img{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:var(--r-md);border:1px solid var(--line)}
.ai-shot i{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:var(--fs-sm);line-height:26px;text-align:center}
/* 识图后把「模型读到了什么」摊给用户看，金额读错一眼就能发现 */
.ai-hint{margin:-var(--sp-1) 0 var(--sp-6);padding:var(--sp-4) var(--sp-5);border-radius:var(--r-sm);background:var(--accent-soft);
  color:#2f6f5e;font-size:var(--fs-sm);line-height:1.5}
.log-row{display:flex;gap:var(--sp-4);align-items:baseline;padding:var(--sp-4) 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.log-row:last-child{border-bottom:none}
.log-tag{flex:none;font-size:var(--fs-micro);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-xs);background:var(--accent-soft);color:var(--accent)}
.log-tag.bad{background:#fbeceb;color:var(--danger)}
.log-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-meta{flex:none;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- 明细 ---------- */
.day{margin-bottom:var(--sp-8)}
.day-hd{display:flex;justify-content:space-between;font-size:var(--fs-aux);color:var(--muted);padding:0 var(--sp-2) var(--sp-3)}
/* 明细行：方向落在整张卡上——支出白卡、收入淡绿、退款淡橙。
   一家人一天吃住行十几笔支出，给每张卡都涂色只会发灰；让收入和退款变成「例外」，
   扫一眼就能看出钱进来还是出去。左边缘统一 4px 竖条，保证三种行左边界对齐。
   颜色不是唯一线索：金额前的 − + ↩ 仍然保留，色弱也读得出方向。 */
.tx{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rail);
  border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-5);
}
.tx.dir-income{background:var(--income-soft);border-color:#dbeae4;border-left-color:var(--income)}
.tx.dir-refund{background:var(--refund-soft);border-color:#f1e2cd;border-left-color:var(--refund)}
.tx:active{background:#fdfcfa}
.tx.dir-income:active{background:#e9f3ef}
.tx.dir-refund:active{background:#fbf0e2}
.tx .body{flex:1;min-width:0;min-height:38px;display:flex;flex-direction:column;justify-content:center}
/* 标题是「一级 / 二级」的路径：只让二级加粗，一级退成浅灰小字——
   整屏的重心就落在「午餐/买菜/早餐」这几个具体词上，不再一坨加黑 */
.tx .t1{font-size:var(--fs-body);display:flex;align-items:baseline;gap:var(--sp-2);min-width:0;overflow:hidden}
.tx .t1 i{font-style:normal;font-size:var(--fs-aux);color:var(--faint);white-space:nowrap;flex:none}
.tx .t1 b{font-weight:var(--fw-bold);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 第二行只放备注，标记徽标排在它前面；两样都没有时整行不输出 */
.tx .t2{font-size:var(--fs-aux);color:var(--muted);margin-top:var(--sp-1);display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.tx .t2 .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2 .date{flex:none;color:var(--faint)}
.tx .amt-col{flex:none;text-align:right}
.tx .amt{font-size:var(--fs-em);font-weight:var(--fw-bold);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 原额：只在有冲抵时出现，退成小字放在净额下面——主数字说「这笔花了多少」，
   小字说「账单上原本是多少」，两个数都在，才不会看错也不会对不上账 */
.tx .amt-sub{font-size:var(--fs-micro);color:var(--faint);margin-top:var(--sp-1);white-space:nowrap;font-variant-numeric:tabular-nums}
.tx .own{font-size:var(--fs-micro);color:var(--faint);margin-top:var(--sp-1);white-space:nowrap}
/* 徽标一律白底 + 描边：淡绿/淡橙的卡片上不会和底色调混，白卡上也不抢标题 */
.badge{font-size:var(--fs-micro);padding:0 var(--sp-2);border-radius:var(--r-xs);background:#fff;border:1px solid var(--line);
  color:var(--muted);line-height:16px;white-space:nowrap;flex:none}
.badge.shared{color:var(--accent);border-color:#cfe3dc}
.badge.pending{color:#b45309;border-color:#f0d9b8}
.badge.reimb{color:#2f6f5e;border-color:#cfe3dc}
.badge.voucher{color:#6d629a;border-color:#dcd8ee}
.badge.travel{color:#39688c;border-color:#cfdde9}
.badge.refunded{color:#5a6473;border-color:#dde2e8}
.tx .quick{
  flex:none;border:1px solid #f0d9b8;background:#fff8ee;color:#b45309;
  border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-aux);font-weight:var(--fw-bold);
}
.tx .quick:active{background:#fdf1e3}
.tx .quick.muted{border-color:var(--line);background:var(--card);color:var(--muted)}
/* 彩色卡上奶白按钮会糊，统一拔成白底 */
.tx.dir-income .quick,.tx.dir-refund .quick{background:#fff}
/* 冲抵候选：一行一笔，左边日期+分类+备注，右边剩余金额与匹配标签 */
.chip.tgt{
  display:flex;align-items:center;gap:var(--sp-5);width:100%;text-align:left;
  margin-bottom:var(--sp-3);padding:var(--sp-4) var(--sp-6);
}
.chip.tgt .tgt-main{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip.tgt .tgt-main b{font-weight:var(--fw-bold);margin-right:var(--sp-2)}
.chip.tgt .tgt-side{
  flex:none;display:flex;align-items:center;gap:var(--sp-3);justify-content:flex-end;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
/* 金额永远贴右边对齐，左边的标签宽窄不一也不会让数字跳动 */
.chip.tgt .tgt-amt{font-weight:var(--fw-bold)}
.chip.tgt .tgt-tag{
  font-style:normal;font-size:var(--fs-micro);font-weight:var(--fw-bold);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-xs);
  background:var(--bg);color:var(--muted);border:1px solid var(--line);
}
.chip.tgt .tgt-tag.same{background:var(--accent-soft);color:var(--accent);border-color:#bfd8cf}
.chip.tgt .tgt-tag.kw{background:#e9f1f8;color:#39688c;border-color:#cfe0ee}
.chip.tgt .tgt-tag.bad{background:#fbeceb;color:#b3261e;border-color:#f2d3d0}
.chip.tgt.on{font-weight:var(--fw-bold)}
.tgt-more{
  margin-top:var(--sp-5);background:none;border:none;padding:var(--sp-2) 0;cursor:pointer;
  color:var(--muted);font-size:var(--fs-sm);text-decoration:underline;text-underline-offset:3px;
}
.tgt-search{margin-top:var(--sp-4)}
/* 退款/处理弹层里的原单信息块 */
.refund-src{background:#f7f6f3;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-7)}
.refund-src .rs-t{font-size:var(--fs-body);font-weight:var(--fw-bold)}
.refund-src .rs-s{font-size:var(--fs-aux);color:var(--muted);margin-top:var(--sp-1)}
.refund-line{display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-sm);padding:var(--sp-3) 0;border-bottom:1px dashed var(--line)}
.refund-line .mono{margin-left:auto}
.refund-line:last-child{border-bottom:none}
/* 借款台账：明细页顶部的提醒条，不进统计 */
.loan-bar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);width:100%;
  background:#fff8ee;border:1px solid #f0d9b8;color:#8a5a1f;border-radius:var(--r-md);
  padding:var(--sp-4) var(--sp-6);margin-bottom:var(--sp-5);text-align:left;
}
.loan-bar.empty{background:var(--card);border-color:var(--line);color:var(--muted);font-weight:var(--fw)}
.loan-bar .lb-left{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0;flex:1}
.loan-bar .lb-title{font-size:var(--fs-body);font-weight:var(--fw-bold)}
.loan-bar.empty .lb-title{font-weight:var(--fw-mid)}
.loan-bar .lb-sub{font-size:var(--fs-aux);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loan-bar .lb-right{flex:none;font-size:var(--fs-aux);opacity:.75;font-weight:var(--fw-mid);white-space:nowrap}
.loan-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-6) var(--sp-6);margin-bottom:var(--sp-6)}
.loan-row{display:flex;align-items:flex-start;gap:var(--sp-5);padding:var(--sp-4) 0;border-bottom:1px dashed var(--line);font-size:var(--fs-sm)}
.loan-row:last-child{border-bottom:none}
.loan-row .l-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.loan-row .l-t,.loan-row .l-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loan-row .l-s{font-size:var(--fs-aux);color:var(--muted)}
.loan-row .l-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-2)}
.loan-row .l-amt{font-variant-numeric:tabular-nums;font-weight:var(--fw-bold)}
.loan-row.settled{opacity:.55}
.loan-act{background:none;border:none;color:var(--accent);font-size:var(--fs-aux);padding:0;font-weight:var(--fw-bold)}

/* ---------- 统计 ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-6) var(--sp-7)}
.kpi .k{font-size:var(--fs-aux);color:var(--muted);margin-bottom:var(--sp-2)}
.kpi .v{font-size:var(--fs-title);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
.bar-line{margin-bottom:var(--sp-5)}
.bar-line .top{display:flex;justify-content:space-between;font-size:var(--fs-sm);margin-bottom:var(--sp-2)}
.bar-line .track{height:7px;background:#f0eeea;border-radius:var(--r-xs);overflow:hidden}
.bar-line .fill{height:100%;background:var(--accent);border-radius:var(--r-xs)}

/* 本月收支卡 */
.bal-wrap{display:flex;align-items:baseline;gap:var(--sp-4);margin-bottom:var(--sp-7)}
.bal-label{font-size:var(--fs-aux);color:var(--muted)}
.bal{font-size:var(--fs-num);font-weight:var(--fw-bold);letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.1}
.bal .cur{font-size:var(--fs-title);font-weight:var(--fw-bold);margin-right:var(--sp-1)}
.bal.pos{color:var(--accent)}
.bal.neg{color:var(--danger)}
.io-bar{display:flex;height:10px;border-radius:var(--r-xs);overflow:hidden;background:#f0eeea;margin-bottom:var(--sp-5)}
.io-seg.in{background:var(--accent)}
.io-seg.out{background:#c07a3a}
.io-legend{display:flex;flex-wrap:wrap;gap:var(--sp-6);font-size:var(--fs-aux);color:var(--muted)}
.io-legend span{display:inline-flex;align-items:center;gap:var(--sp-2)}
.io-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.io-dot.in{background:var(--accent)}
.io-dot.out{background:#c07a3a}
.io-dot.rfd{background:var(--refund)}

/* 饼图 + 图例 */
.pie-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-7)}
.pie-fig{flex:none;width:168px;height:168px;margin:0 auto}
.pie-fig svg{display:block;width:100%;height:100%}
.pie-legend{flex:1 1 170px;min-width:150px}
.pl-row{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-sm);padding:var(--sp-2) 0}
.pl-dot{width:9px;height:9px;border-radius:var(--r-xs);flex:none}
.pl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-val{color:var(--muted);font-size:var(--fs-aux)}
.pl-pct{width:34px;text-align:right;color:var(--faint);font-size:var(--fs-aux)}

/* 统计卡片里能点进明细的行：整行都是按钮，右侧数字后面跟一个 › 当提示 */
.stat-link{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);width:100%;
  background:none;border:none;padding:var(--sp-2) 0;margin:0;text-align:left;
}
.stat-link:active{opacity:.55}
.stat-link .amt{
  display:inline-flex;align-items:center;gap:var(--sp-3);flex:none;
  font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat-link .go{font-style:normal;font-weight:var(--fw);font-size:var(--fs-em);line-height:1;color:var(--faint)}

.empty{text-align:center;color:var(--faint);font-size:var(--fs-sm);padding:var(--sp-10) 0}
.month-pick{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.month-pick input{flex:1;min-width:0;padding:var(--sp-4) var(--sp-6);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
/* 月份框吃掉剩余宽度，筛选/排序两枚按钮不收缩、不换行（窄屏 320px 也不挤） */
.month-pick .btn{flex:none;white-space:nowrap;padding-left:var(--sp-5);padding-right:var(--sp-5)}
/* 「全部月份」替代空月份框：占住月份框的位置，文字左对齐才像输入框 */
.month-pick .month-all{flex:1;min-width:0;justify-content:flex-start;font-weight:var(--fw-mid);color:var(--muted)}
/* 自定义跨年区间的文字会很长（2025-12-01 ~ 2026-11-03），
   超宽就省略，别把「筛选 / 排序 / 导出」挤出去；完整的在 title 和条件行里
   ✕ 单独一个 span，省略到它头上就点不掉了 */
.month-pick .month-all .rc-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-pick .month-all .rc-x{flex:none;margin-left:var(--sp-2)}
/* 汇总行：「共 N 笔」+ 一串合计，整体 flex-wrap。
   合计不能整段 nowrap——数字一长（月支出五位数 + 退款 + 报销 + 净额）一行能到 500px，
   比手机视口还宽，会把布局视口顶宽、连带所有 fixed 弹层被切（2026-10-29 线上事故）。
   现在每一段自己不断行，段与段之间随意换行。 */
.sum-line{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-6);font-size:var(--fs-aux);color:var(--muted);padding:0 var(--sp-2) var(--sp-5);font-variant-numeric:tabular-nums}
.sum-line span,.sum-line i{white-space:nowrap}
.sum-line i{font-style:normal}
/* 净流出是这个页面的主数字：有冲抵时它排第一并加粗，原额支出退成后面的注脚 */
.sum-line i.net{color:var(--ink);font-weight:var(--fw-bold)}
/* 搜索/筛选生效时的那行「条件：…」，容许换行 */
.cond-line{font-size:var(--fs-aux);color:var(--muted);padding:0 var(--sp-2) var(--sp-5);margin-top:-var(--sp-2);line-height:1.5;word-break:break-word}
/* 关键词命中 */
mark{background:#fdefc3;color:inherit;border-radius:var(--r-xs);padding:0 var(--sp-1)}
/* 筛选面板 */
.f-group{margin-bottom:var(--sp-7)}
.f-label{font-size:var(--fs-aux);color:var(--muted);margin-bottom:var(--sp-3)}
.f-group input{
  width:100%;padding:var(--sp-5) var(--sp-6);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);outline:none;
}
.f-group input:focus{border-color:var(--accent)}
.hint{font-size:var(--fs-aux);color:var(--muted);line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);
  background:rgba(27,27,29,.92);color:#fff;padding:var(--sp-4) var(--sp-8);border-radius:var(--r-sm);font-size:var(--fs-sm);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:86vw;text-align:center;
}
.toast.on{opacity:1}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;display:none}
.sheet-mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:var(--r-lg) 18px 0 0;padding:var(--sp-8) var(--sp-8) calc(var(--sp-8) + env(safe-area-inset-bottom));
  max-height:86vh;overflow:auto;transform:translateY(102%);transition:transform var(--d3) var(--ease-out);
  max-width:720px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 var(--sp-7);font-size:var(--fs-em)}
/* 二级弹层（冲抵分配）：盖在一级编辑弹层之上，遮罩加深一档，层级关系一眼可辨 */
.sheet2-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none}
.sheet2-mask.on{display:block}
.sheet2{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:var(--r-lg) 18px 0 0;padding:var(--sp-8) var(--sp-8) calc(var(--sp-8) + env(safe-area-inset-bottom));
  max-height:86vh;overflow:auto;transform:translateY(102%);transition:transform var(--d3) var(--ease-out);
  max-width:720px;margin:0 auto;
}
.sheet2.on{transform:translateY(0)}
.sheet2 h3{margin:0 0 var(--sp-7);font-size:var(--fs-em)}
/* 分配行：左边是原单信息，右边是本次分多少 */
.alloc{border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-5)}
.alloc .a-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-4)}
.alloc .a-cat{font-size:var(--fs-body);font-weight:var(--fw-bold)}
.alloc .a-note{font-size:var(--fs-aux);color:var(--muted);margin-top:var(--sp-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc .a-in{display:flex;align-items:center;gap:var(--sp-4);margin-top:var(--sp-4)}
/* min-width:0 必须有：input 的默认尺寸会撑开 flex 容器，整行跟着溢出屏幕 */
.alloc .a-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-4) var(--sp-5);font-size:var(--fs-em);background:var(--bg);color:var(--ink)}
.alloc .a-top span{min-width:0}
.alloc .a-top .hint{flex:none;white-space:nowrap}
.alloc .a-del{border:0;background:none;color:var(--danger);font-size:var(--fs-sm);padding:var(--sp-4) var(--sp-2);cursor:pointer;flex:none}
.alloc-sum{display:flex;gap:var(--sp-7);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-6)}
.alloc-sum b{color:var(--ink);font-weight:var(--fw-bold)}
.alloc-sum .over{color:var(--danger);font-weight:var(--fw-bold)}
@media(min-width:760px){
  main{padding:var(--sp-9) var(--sp-8)}
}
/* ==========================================================================
   动效层（覆盖式追加，不改原有结构）
   时长与曲线一律取 :root 里的 --d1/--d2/--d3/--ease，不再写 .15s/.22s。
   ========================================================================== */

/* 自己接管下拉手势，别让浏览器再叠一层原生下拉刷新 / 橡皮筋 */
html,body{overscroll-behavior-y:contain}

/* 控件过渡统一。原来散落在各处的 .15s 硬编码由此覆盖 */
button,a,input,select,textarea{
  transition:background-color var(--d2) var(--ease),border-color var(--d2) var(--ease),
    color var(--d2) var(--ease),transform var(--d1) var(--ease),opacity var(--d2) var(--ease);
}
button:active{transform:scale(.97)}
button:disabled:active{transform:none}

/* tab 切换：内容整体上浮入场。
   只有切换时才挂 .enter（见下拉刷新脚本里的 MutationObserver），
   保存后重渲染不会闪。 */
#view.enter > *{animation:enter var(--d3) var(--ease-out) both}
#view.enter > *:nth-child(2){animation-delay:36ms}
#view.enter > *:nth-child(3){animation-delay:72ms}
#view.enter > *:nth-child(n+4){animation-delay:104ms}
@keyframes enter{from{opacity:0;transform:translateY(var(--sp-3))}to{opacity:1;transform:none}}

/* 明细行：同一天里连续几条，不做逐条 stagger（长列表会拖），
   统一 120ms 淡入，比整块闪现更容易看出「刷新出了新内容」 */
.tx{animation:tx-in var(--d2) var(--ease-out) both}
@keyframes tx-in{from{opacity:0}to{opacity:1}}

/* 底部弹层曲线换掉原来的 ease */
.sheet,.sheet-mask{transition-duration:var(--d3);transition-timing-function:var(--ease-out)}

/* ---- 下拉刷新指示器 ---- */
#ptr{
  position:fixed;top:0;left:0;right:0;height:var(--ptr-h);margin-top:calc(-1 * var(--ptr-h));z-index:45;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:var(--sp-4);pointer-events:none;opacity:0;
  color:var(--muted);font-size:var(--fs-aux);line-height:1;
}
#ptr .ptr-i{
  width:20px;height:20px;margin-bottom:var(--sp-3);
  border:2px solid var(--line);border-top-color:var(--accent);border-radius:var(--radius);
}
#ptr.armed .ptr-i{border-top-color:var(--accent);border-right-color:var(--accent)}
#ptr.busy .ptr-i{animation:spin .7s linear infinite}

/* 减弱动态效果：位移与淡入全关，只留颜色过渡 */
@media(prefers-reduced-motion:reduce){
  #view.enter > *,.tx{animation:none}
  button:active{transform:none}
  .sheet,.sheet-mask{transition-duration:.01ms}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" hidden>
  <h1>家庭账本</h1>
  <p class="sub">家庭 / 小团队，一本账</p>
  <div class="field"><label>用户名</label><input id="lu" autocomplete="username" autocapitalize="none"></div>
  <div class="field"><label>密码</label><input id="lp" type="password" autocomplete="current-password"></div>
  <button class="btn" id="lbtn">登录</button>
</div>

<!-- 主界面 -->
<div id="app" hidden>
  <header><div class="hd">
    <h2 id="page-title">记一笔</h2>
    <span class="who" id="whoami"></span>
    <button class="hd-out" id="logout-top">退出</button>
  </div></header>
  <main id="view"></main>
  <nav><div class="nav-in" id="nav"></div></nav>
</div>

<div class="toast" id="toast"></div>
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="sheet2-mask" id="mask2"></div>
<div class="sheet2" id="sheet2"></div>

<div class="blocker" id="blocker">
  <div class="bl-card"><span class="spin"></span><span id="bl-text">正在记…</span></div>
  <button class="bl-cancel" id="bl-cancel" hidden>先看看明细</button>
</div>
<div class="rsp-mask" id="rsp-mask"></div>
<div class="rsp" id="rsp"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
/* 本地时区的当前月份。不要用 toISOString()——那是 UTC，UTC+8 每月 1 号 0~8 点会算成上个月 */
function nowMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
const state = {
  me: null, meta: null, tab: "add", month: nowMonth(),
  form: { direction: "expense", cat_parent: "", category: "", shared: false, reimb_pending: false, pending_use: false, reimbursed: false, travel: false, owner_id: null },
  /* scope 决定时间范围怎么取（时间维度只能有一个来源，否则和顶部月份框打架）：
     month = 跟顶部月份框走；range = 用 start/end；all = 不限时间 */
  filter: { direction: "", mark: "", owner: "", cat_parent: "", q: "", min: "", max: "",
            scope: "month", start: "", end: "" },
  sort: "date_desc",  // 明细排序：与 filter 正交，两者同时生效（键名对应后端 TX_ORDERS）
  target: null,   // 退款要冲抵哪一笔支出：id / "none"（用户明确选的不冲抵）/ null（未定）
  offsetKind: "refund",  // 走「退款/报销」方向时：refund 退货退款 / reimb 报销到账
  /* 报销是「一次到账摊多笔」，所以是数组不是单值。退款仍用上面的 target（一单一单退） */
  reimbSel: [],
  subsidyText: "",   // 到账金额里有多少是差补（记收入，不冲抵）
  subsidyCat: "",    // 差补的子类，默认取「补贴」树第一项
  /* 差补默认自动算（到账 − 已选支出合计）并回填。用户只要自己改过这一栏就置 true，
     之后不再被自动值覆盖——出差几天是他知道、系统不知道的事 */
  subsidyManual: false,
  targetSig: "",  // 金额/归属/备注的指纹，变了就重新自动匹配
  pinned: null,   // 从「搜更早的账单」里选中的候选（不在 30 天候选里）
  editing: null,
  /* 冲抵分配（二级弹层）：一条到账摊在多笔支出上，先在本数组里改，点保存才整体提交。
     整份替换而不是逐条调接口——一次请求内金额守恒成立，不会出现中间态 */
  alloc: [], allocTotal: 0, allocOffset: null,
  /* AI 区：图存 data URL、文字和「识别到」的提示都放 state，
     因为点分类/标记会整页重渲染，不存 state 就会把用户刚拍的小票弄丢 */
  aiText: "", aiImage: "", aiHint: "",
  /* 幂等键：标识「这一次提交」，不是这笔账的内容。落账成功后换新的，
     所以两笔金额分类都一样的真实消费各有各的键，照记两条；
     而双击 / 断网重发 / 结果未知时再点一次复用的是同一个键，服务端只落一条。 */
  formToken: newToken(),
  saving: false,      // 请求在途：挡住同一笔的第二个 POST
  lastSaved: null,    // 刚落账那一笔，供「已记上」回执卡展示（可撤销）
};

/* 随机串：https 下 crypto.randomUUID 都有；老 WebView 兜底用时间戳 + 随机数 */
function newToken() {
  try {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10)
    + Math.random().toString(36).slice(2, 6);
}
/* 账号固定配色：天蓝 = 成员 A、粉 = 成员 B……
   取色按 user.id 排序，与「谁排在最前」无关，否则换个登录人颜色就跟着变了 */
const OWNER_PALETTE = [
  { c: "#3aa0d8", bg: "#e6f4fc", ink: "#1b6c93" },   // 天蓝
  { c: "#e888a8", bg: "#fdeef3", ink: "#a33f62" },   // 粉
  { c: "#8a7fb5", bg: "#f0eef8", ink: "#6d629a" },   // 紫
  { c: "#7fa86b", bg: "#eff5ea", ink: "#5a7a49" },   // 橄榄绿
];
const OWNER_FALLBACK = { c: "#8e8e95", bg: "#f0f0f2", ink: "#77777e" };
function ownerColor(id) {
  const us = ((state.meta && state.meta.users) || []).slice().sort((a, b) => a.id - b.id);
  const i = us.findIndex(u => u.id === id);
  return i < 0 ? OWNER_FALLBACK : OWNER_PALETTE[i % OWNER_PALETTE.length];
}

/* 分类固定配色：大类名 → 色位号。写死类名而不是「按树里第几个」——
   这样增删大类、调整顺序都不会让其它大类的颜色跟着变。 */
const CAT_PALETTE = [
  { c: "#2f6f5e", bg: "#e8f1ee", ink: "#2f6f5e" },   // 0 绿
  { c: "#c07a3a", bg: "#fbf0e6", ink: "#9e6129" },   // 1 橙棕（暖）
  { c: "#4a7fa8", bg: "#e9f1f8", ink: "#39688c" },   // 2 钢蓝
  { c: "#b3261e", bg: "#fbeceb", ink: "#97201a" },   // 3 红
  { c: "#8a7fb5", bg: "#f0eef8", ink: "#6d629a" },   // 4 紫
  { c: "#c9a227", bg: "#faf4e0", ink: "#8a6c11" },   // 5 金
  { c: "#5b8f7f", bg: "#eaf3f0", ink: "#45756a" },   // 6 青绿
  { c: "#a86f6f", bg: "#f8ecec", ink: "#8a5757" },   // 7 玫瑰灰
  { c: "#6d8f5f", bg: "#eff4ea", ink: "#547344" },   // 8 草绿
  { c: "#8e8e95", bg: "#f0f0f2", ink: "#77777e" },   // 9 灰
];
/* 分类配色：服务端配置下发每个一级分类的色位号（state.meta.cat_colors[dir][parent]），
   没配置色位的按树序兜底——增删大类、改名都不会让别的类变色（改名全链条 UPDATE，
   统计自动跟随同一个配置）。 */
function catColor(parent, direction) {
  const dir = direction || "expense";
  const slotCfg = state.meta && state.meta.cat_colors && state.meta.cat_colors[dir];
  const slot = slotCfg ? slotCfg[parent] : null;
  if (slot != null) return CAT_PALETTE[slot % CAT_PALETTE.length];
  // 没配色的按树序兜底
  const tree = (state.meta && state.meta.categories && state.meta.categories[dir]) || {};
  const i = Object.keys(tree).indexOf(parent);
  return CAT_PALETTE[(i < 0 ? 0 : i) % CAT_PALETTE.length];
}
/* 不确定大类属于哪个方向时（筛选面板、混合列表），按各方向顺序找第一个命中的 */
function catColorAny(parent) {
  const cats = (state.meta && state.meta.categories) || {};
  for (const dir of Object.keys(cats)) if (parent in cats[dir]) return catColor(parent, dir);
  return CAT_PALETTE[0];
}
const chipVars = col => `--c:${col.c};--bg:${col.bg};--ink:${col.ink}`;

/* 「归属」候选：只给真人账号，管理员是后台账号不参与记账；
   当前登录的人永远排最前（默认选中的人也在这条链路上） */
const ownerList = () => {
  const us = (state.meta && state.meta.users && state.meta.users.length)
    ? state.meta.users.slice() : [state.me];
  const meId = state.me && state.me.id;
  return us.sort((a, b) => {
    if (a.id === meId) return -1;
    if (b.id === meId) return 1;
    return a.id - b.id;
  });
};

const money = c => "¥" + (c / 100).toFixed(2);

/* ---------------- 金额输入：唯一口径 ----------------
   以前各处直接 parseFloat(value)，于是「12abc」被静默记成 12 元、「1e3」记成 1000 元、
   「12.345」记成 12.35 —— 全是用户没打算输入的数，而且看不出错在哪。
   现在输入时就清洗，提交前按同一套规则再解析一次，绝不「猜」一个数字出来。 */
const AMOUNT_MAX_CENTS = 100_000_000;   // 与后端 _create_tx 的上限一致：单笔 100 万元

/* 只留数字和一个小数点，最多两位小数；全角数字、中文句号先归一化
   （iOS 中文键盘很容易打出「１２．５」这种） */
function cleanAmount(text) {
  let v = String(text == null ? "" : text)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".")
    .replace(/[^\d.]/g, "");
  const dot = v.indexOf(".");
  if (dot >= 0) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, "");
  const [int, dec] = v.split(".");
  let out = int.slice(0, 7);               // 整数 7 位封顶，再多也超不过上限
  if (dec !== undefined) out += "." + dec.slice(0, 2);
  if (out.startsWith(".")) out = "0" + out;
  return out;
}

/* 解析成「分」；不合法一律 null，由调用方给提示（猜错就是记错账） */
function parseAmount(text) {
  const v = cleanAmount(text);
  if (!/^\d+(\.\d{1,2})?$/.test(v)) return null;
  const cents = Math.round(parseFloat(v) * 100);
  return cents > 0 && cents <= AMOUNT_MAX_CENTS ? cents : null;
}

/* 绑到金额输入框：边输边清洗，光标按「清洗后前面还剩几个字」还原，
   删中间字符时不会跳到末尾。必须在设置 oninput 之前调用，清洗才会先跑。 */
function bindAmountInput(el) {
  if (!el) return;
  el.addEventListener("input", () => {
    const raw = el.value, clean = cleanAmount(raw);
    if (clean === raw) return;
    const pos = el.selectionStart == null ? raw.length : el.selectionStart;
    const kept = cleanAmount(raw.slice(0, pos)).length;
    el.value = clean;
    try { el.setSelectionRange(kept, kept); } catch (e) { /* 老浏览器没有就算了 */ }
  });
}

/* 备注是用户自由输入，插进 innerHTML 前必须转义 */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
/* 日期工具：筛选的快捷区间都从这里算。减月份时先落到 1 号再减，
   否则 5-31 减 3 个月会溢出成 3-2，区间起点飘到下一个月 */
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-`
  + `${String(d.getDate()).padStart(2, "0")}`;
const today = () => isoDate(new Date());
function daysAgo(n) {
  const d = new Date(); d.setDate(d.getDate() - n); return isoDate(d);
}
function monthsAgo(n) {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - n); return isoDate(d);
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200);
}
/* 写操作的在途锁。双击一次就发两条请求，是这个页面最容易犯的错：
   记退款的两条各自「不超过剩余可退」都能过，于是一笔钱退成两笔。
   saveTx 有自己完整的三层防重（saving + client_token），这里只补其余的按钮。 */
async function withBusy(btn, fn) {
  if (!btn || btn._busy) return;
  btn._busy = true;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "保存中…";
  try { return await fn(); }
  finally { btn._busy = false; btn.disabled = false; btn.textContent = label; }
}

/* 连上了却不回数据，是最难查的一类故障：await 永不落定，调用方的 finally 不执行，
   界面上就是「按钮一直是保存中」，之后每次点击都被防重锁静默吞掉。
   15 秒到了主动断开，统一走「结果未知」分支——和断网一个话术，不谎报失败。 */
const apiTimeout = () => (window.__API_TIMEOUT__ || 15000);

async function api(path, opts = {}) {
  let res;
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), apiTimeout()) : 0;
  try {
    res = await fetch("/api" + path, {
      credentials: "same-origin",
      headers: opts.body ? { "Content-Type": "application/json" } : {},
      ...opts,
      signal: ctrl ? ctrl.signal : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (err) {
    // 没拿到响应 ≠ 没执行。写操作这时候「结果未知」，服务端可能已经落库了，
    // 打上 network 标记让调用方用「可能已成功」的话术，别一句「失败」骗人重录。
    const e = new Error("网络中断，请稍后重试");
    e.network = true;
    if (err && err.name === "AbortError") e.timeout = true;   // 只给排查用，界面话术不区分
    throw e;
  } finally {
    // 必须在读 body 之前清掉：fetch 已经返回，这时候再 abort 会把读 body 也一起掐断
    if (timer) clearTimeout(timer);
  }
  let data = {};
  try { data = await res.json(); }
  catch (err) {
    // 状态码 200 但 body 断了（切网、后台被回收）同样是「结果未知」
    if (res.ok) { const e = new Error("网络中断，请稍后重试"); e.network = true; throw e; }
  }
  if (!res.ok) {
    // 只抛一句中文文案，调用方就没法分支了：分类保存靠 code 区分
    // 「有历史不能删」（拦下）和「会改写历史」（可以确认后继续），
    // 靠匹配中文提示迟早被一句文案改动打死。明细（如 preview 计划）一并带出。
    const e = new Error(data.error || "请求失败");
    e.status = res.status;
    if (data.code) e.code = data.code;
    if (data.preview) e.preview = data.preview;
    throw e;
  }
  return data;
}

/* ---------------- 登录 ---------------- */
async function boot() {
  try {
    const r = await api("/me");
    if (r.user) return enter(r.user);
  } catch (e) {}
  showLogin();
}
function showLogin() {
  $("#login").hidden = false; $("#app").hidden = true;
  $("#lbtn").onclick = doLogin;
  $("#lp").onkeydown = e => { if (e.key === "Enter") doLogin(); };
  $("#lu").focus();
}
async function doLogin() {
  const username = $("#lu").value.trim(), password = $("#lp").value;
  if (!username || !password) return toast("请填写用户名和密码");
  $("#lbtn").disabled = true;
  try {
    await api("/login", { method: "POST", body: { username, password } });
    const r = await api("/me");
    enter(r.user);
  } catch (e) { toast(e.message); }
  finally { $("#lbtn").disabled = false; }
}
async function enter(user) {
  state.me = user;
  state.meta = await api("/meta");
  if (!state.form.owner_id || !ownerList().some(u => u.id === state.form.owner_id)) {
    state.form.owner_id = user.id;
  }
  $("#login").hidden = true; $("#app").hidden = false;
  $("#whoami").textContent = user.display_name;
  $("#logout-top").onclick = doLogout;
  renderNav(); render();
}
async function doLogout() {
  if (!confirm("确定退出登录？")) return;
  try { await api("/logout", { method: "POST", body: {} }); } catch (e) {}
  state.me = null; state.meta = null;
  state.form = { direction: "expense", cat_parent: "", category: "", shared: false,
                 reimb_pending: false, pending_use: false, reimbursed: false, owner_id: null };
  state.filter = { direction: "", mark: "", exclude: "", owner: "", cat_parent: "", q: "", min: "", max: "" };
  state.target = null;
  state.amountText = ""; state.noteText = ""; state.dateText = "";
  $("#app").hidden = true;
  showLogin();
  toast("已退出登录");
}

/* ---------------- 导航 ---------------- */
const TABS = [
  { id: "add", name: "记一笔", icon: '<path d="M12 5v14M5 12h14"/>' },
  { id: "list", name: "明细", icon: '<path d="M4 6h16M4 12h16M4 18h10"/>' },
  { id: "stats", name: "统计", icon: '<path d="M5 20V10M12 20V4M19 20v-7"/>' },
  { id: "me", name: "设置", icon: '<circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/>' },
];
function renderNav() {
  $("#nav").innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="${state.tab === t.id ? "on" : ""}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
      ${t.name}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => {
    // 分类改动只在内存草稿里，切走就没了——问一句再走，别让人白改
    if (state.tab === "me" && b.dataset.tab !== "me") {
      const n = catDiffCount();
      if (n && !confirm(`分类里有 ${n} 处改动还没保存，离开就会丢弃。确定离开？`)) return;
      catEdit = null; catBase = null;
    }
    state.tab = b.dataset.tab; $("#page-title").textContent = TABS.find(t => t.id === state.tab).name;
    // 抽屉只在「刚记完」那一刻有意义，切走再回来还弹着「已记上」会让人以为刚又记了一笔
    if (state.tab !== "add") { state.lastSaved = null; closeReceipt(); }
    renderNav(); render(); window.scrollTo(0, 0);
  });
  syncNavHeight();
}
/* 底栏真实高度写进 --nav-h，body 的下边距跟着走，任何字号/屏宽都不会再压住内容 */
function syncNavHeight() {
  const el = $("#nav");
  if (el && el.offsetHeight) document.documentElement.style.setProperty("--nav-h", el.offsetHeight + "px");
}
addEventListener("resize", syncNavHeight);
function render() {
  $("#page-title").textContent = TABS.find(t => t.id === state.tab).name;
  if (state.tab === "add") return renderAdd();
  if (state.tab === "list") return renderList();
  if (state.tab === "stats") return renderStats();
  if (state.tab === "me") return renderMe();
}

/* ---------------- 记一笔 ---------------- */
function catTree() { return state.meta.categories[state.form.direction] || {}; }
/* 这里**不**给金额框 focus。手机上聚焦就等于弹键盘：
   进入记一笔会一进来就弹、点分类 / 标记 / 归属（都是整页重渲染）会再弹一次，
   而键盘正好盖住二级分类，用户得反复手动收起。想让键盘出来，只有用户自己点金额框。
   （2026-10-27 之前这里是无条件 amt.focus()，别再加回去，包括保存成功之后。） */
function renderAdd() {
  const f = state.form, tree = catTree();
  if (!tree[f.cat_parent]) {
    f.cat_parent = Object.keys(tree)[0];
    f.category = tree[f.cat_parent][0];
  }
  const parents = Object.keys(tree);
  const subs = tree[f.cat_parent] || [];
  const users = ownerList();
  const curCol = catColor(f.cat_parent, f.direction);
  const subsidySubs = ((state.meta.categories.income || {})["补贴"]) || [];
  if (!users.some(u => u.id === f.owner_id)) f.owner_id = state.me.id;

  $("#view").innerHTML = `
    <div class="ai-box">
      <input id="ai-input" placeholder="AI：写一句话，或拍张小票" value="${esc(state.aiText)}" ${state.meta.ai_enabled ? "" : "disabled"}>
      <button class="ai-pic" id="ai-pic" title="拍照 / 选图" ${state.meta.ai_enabled ? "" : "disabled"}>

      </button>
      <button id="ai-btn" ${state.meta.ai_enabled ? "" : "disabled"}>识别</button>
    </div>
    <input type="file" id="ai-file" accept="image/*" hidden>
    ${state.aiImage ? `<div class="ai-shot"><img src="${esc(state.aiImage)}" alt="待识别的小票"><i id="ai-clear">×</i></div>` : ""}
    ${state.aiHint ? `<div class="ai-hint">识别到：${esc(state.aiHint)}</div>` : ""}

    <div class="seg">
      ${[["expense", "支出"], ["income", "收入"], ["refund", "退款 / 报销"]].map(([k, n]) =>
        `<button data-dir="${k}" class="${f.direction === k ? "on" : ""}">${n}</button>`).join("")}
    </div>

    ${f.direction === "refund" ? `
    <div class="seg" style="margin-top:8px">
      ${[["refund", "退货退款"], ["reimb", "报销到账"]].map(([k, n]) =>
        `<button data-kind="${k}" class="${(state.offsetKind || "refund") === k ? "on" : ""}">${n}</button>`).join("")}
    </div>` : ""}

    <div class="amount-wrap">
      <span class="cur">¥</span>
      <input id="amount" inputmode="decimal" placeholder="0.00" value="${esc(state.amountText || "")}">
    </div>

    ${f.direction === "refund" && state.offsetKind === "reimb" ? "" : `
    <div class="card">
      <h3>分类 · ${esc(f.cat_parent)}</h3>
      <div class="chips" id="parents">
        ${parents.map(p => `<button class="chip cchip ${p === f.cat_parent ? "on" : ""}" data-p="${esc(p)}" style="${chipVars(catColor(p, f.direction))}">${esc(p)}</button>`).join("")}
      </div>
      <div class="chips" style="margin-top:9px">
        ${subs.map(s => `<button class="chip sub ${s === f.category ? "on" : ""}" data-c="${esc(s)}" style="${chipVars(curCol)}">${esc(s)}</button>`).join("")}
      </div>
    </div>`}

    ${f.direction === "expense" ? `
    <div class="card">
      <h3>标记</h3>
      <div class="toggles">
        <button class="tg ${f.shared ? "on" : ""}" id="tg-shared"><span class="dot"></span><span>共同支出</span></button>
        <button class="tg ${f.reimb_pending ? "on" : ""}" id="tg-pending"><span class="dot"></span><span>待报销</span></button>
        <button class="tg ${f.pending_use ? "on" : ""}" id="tg-voucher"><span class="dot"></span><span>待用券</span></button>
        <button class="tg ${f.travel ? "on" : ""}" id="tg-travel"><span class="dot"></span><span>旅行</span></button>
      </div>
      <div class="hint" style="margin-top:8px">团购/预付的券还没用就选「待用券」，之后在明细里点<span style="white-space:nowrap">「处理」</span>核销或退掉。<br>出门在外的吃住行打开「旅行」，分类照实记，之后在明细里筛「旅行」就能看这趟一共花多少。</div>
    </div>` : ""}

    ${f.direction === "refund" ? `
    <div class="card">
      <h3>${state.offsetKind === "reimb" ? "报销哪几笔支出 · 可多选" : "冲抵哪一笔支出"}</h3>
      <div class="chips" id="targets"><span class="hint">匹配中…</span></div>
      <div class="hint" style="margin-top:8px" id="target-hint"></div>
      ${state.offsetKind === "reimb" ? "" : `
      <button class="tgt-more" id="tgt-more">找不到？搜更早的账单</button>
      <div class="tgt-search" id="tgt-search" hidden>
        <input id="tgt-q" placeholder="关键词或金额，如 手机壳 / 68">
        <div class="chips" id="tgt-results" style="margin-top:9px"></div>
      </div>`}
    </div>` : ""}

    ${f.direction === "refund" && state.offsetKind === "reimb" ? `
    <div class="card">
      <h3>这笔到账里有多少是差补</h3>
      <div class="field"><label>差补</label>
        <input id="subsidy" inputmode="decimal" placeholder="不填就是全额报销，没有差补" value="${esc(state.subsidyText || "")}">
      </div>
      ${subsidySubs.length ? `<div class="chips" id="subsidy-cats" style="margin-top:9px;display:${parseAmount(state.subsidyText) ? "flex" : "none"}">
        ${subsidySubs.map(s => `<button class="chip sub ${(state.subsidyCat || subsidySubs[0]) === s ? "on" : ""}" data-sc="${esc(s)}">${esc(s)}</button>`).join("")}
      </div>` : ""}
      <div class="hint" style="margin-top:8px" id="subsidy-hint"></div>
    </div>` : ""}

    <div class="card">
      <h3>细节</h3>
      <div class="field"><label>日期</label><input type="date" id="tx-date" value="${esc(state.dateText || today())}"></div>
      <div class="field"><label>归属</label>
        <div class="chips" id="owners">
          ${users.map(u => { const col = ownerColor(u.id); return `<button class="chip pchip ${u.id === f.owner_id ? "on" : ""}" data-owner="${esc(u.id)}" style="${chipVars(col)}">${esc(u.id === state.me.id ? "我 · " + u.display_name : u.display_name)}</button>`; }).join("")}

      </div>

    <div style="height:10px"></div>`;

  const amt = $("#amount");
  bindAmountInput(amt);          // 必须排在 oninput 之前：清洗要先于「记状态」跑
  amt.oninput = () => {
    state.amountText = amt.value;
    if (state.form.direction !== "refund") return;
    if (state.offsetKind === "reimb") {
      // 报销候选跟金额无关（只认「待报销」标记），不用重发请求；
      // 但金额一变，默认勾选就该重判断（填够→自动全选，改小→退回不选），
      // 勾选真变了才重画候选，别无谓地重建按钮
      const before = state.reimbSel.join(",");
      autoSelectReimb();
      if (state.reimbSel.join(",") !== before) renderReimbTargets(state.targetItems || []);
      autoFillSubsidy();
      updateSubsidyHint();
      updateTargetHint(state.targetItems || []);
    } else {
      scheduleTargets();
    }
  };
  amt.onkeydown = e => { if (e.key === "Enter") saveTx(); };

  // 差补：金额 + 子类。默认按「到账 − 已选合计」自动回填，填 0 或不填 = 全额报销
  const subIn = $("#subsidy");
  if (subIn) {
    bindAmountInput(subIn);
    subIn.oninput = () => {
      state.subsidyText = subIn.value;
      // 自己改过就退出自动模式；改回去跟自动值一样（或清空）则继续算自动
      state.subsidyManual = parseAmount(subIn.value) !== autoSubsidyCents();
      refreshSubsidyCat();
      updateSubsidyHint();
      updateTargetHint(state.targetItems || []);
    };
    // 「恢复自动」按钮是 hint 里动态生成的，交给容器做事件委托（每次渲染重建容器，不会重复绑）
    const sh = $("#subsidy-hint");
    if (sh) sh.addEventListener("click", e => {
      if (!e.target || e.target.id !== "subsidy-auto") return;
      state.subsidyManual = false;
      autoFillSubsidy();
      updateSubsidyHint();
      updateTargetHint(state.targetItems || []);
    });
    autoFillSubsidy();
    updateSubsidyHint();

  $("#view").querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
    state.subsidyCat = b.dataset.sc; renderAdd();
  });

  $("#view").querySelectorAll("[data-dir]").forEach(b => b.onclick = () => {
    f.direction = b.dataset.dir; f.cat_parent = ""; f.category = "";
    state.target = null; state.pinned = null; state.targetSig = "";
    state.reimbSel = []; state.reimbTouched = false;
    state.subsidyText = ""; state.subsidyCat = ""; state.subsidyManual = false;
    if (f.direction !== "refund") state.offsetKind = "refund";
    renderAdd();
  });
  // 「退款/报销」内部分型：换类型要重新匹配候选（报销只找标了「待报销」的支出）
  $("#view").querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
    state.offsetKind = b.dataset.kind;
    state.target = null; state.pinned = null; state.targetSig = "";
    state.reimbSel = []; state.reimbTouched = false;
    state.subsidyText = ""; state.subsidyCat = ""; state.subsidyManual = false;
    renderAdd();
  });
  $("#view").querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    f.cat_parent = b.dataset.p; f.category = tree[f.cat_parent][0]; renderAdd();
  });
