/* ---------------- 统计 ---------------- */
function pieSVG(rows, total) {
  if (!total) return "";
  const R = 78, C = 84;
  let acc = 0;
  const paths = rows.map(r => {
    const frac = r.value / total;
    const a0 = acc * 2 * Math.PI - Math.PI / 2;
    acc += frac;
    const a1 = acc * 2 * Math.PI - Math.PI / 2;
    if (frac >= 0.9995) return `<circle cx="${C}" cy="${C}" r="${R}" fill="${r.color}"/>`;
    const x0 = (C + R * Math.cos(a0)).toFixed(2), y0 = (C + R * Math.sin(a0)).toFixed(2);
    const x1 = (C + R * Math.cos(a1)).toFixed(2), y1 = (C + R * Math.sin(a1)).toFixed(2);
    return `<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${frac > 0.5 ? 1 : 0},1 ${x1},${y1} Z"
      fill="${r.color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
  }).join("");
  return `<svg viewBox="0 0 168 168" width="168" height="168" role="img">${paths}</svg>`;
}

/* rows: [{label, value, color}] —— 饼图 + 右侧图例（金额与占比） */
function pieBlock(rows, emptyText) {
  const total = rows.reduce((s, r) => s + r.value, 0);
  if (!total) return `<div class="hint">${emptyText || "本月还没有数据"}</div>`;
  return `<div class="pie-wrap">
      <div class="pie-fig">${pieSVG(rows, total)}</div>
      <div class="pie-legend">
        ${rows.map(r => `<div class="pl-row">
          <span class="pl-dot" style="background:${r.color}"></span>
          <span class="pl-name">${r.label}</span>
          <span class="pl-val mono">${money(r.value)}</span>
          <span class="pl-pct">${(r.value / total * 100).toFixed(0)}%</span>
        </div>`).join("")}
      </div>
    </div>`;
}

/* 饼图下面必须能对账：分类合计 − 冲抵后为负的分类 − 无主冲抵 = 支出。
   以前只画饼不写字，遇到无主冲抵（或某类被冲成负数）时，「各项加起来」永远比
   「支出」多，看图的人怎么加都对不上，只会怀疑是不是算错了。 */
function catEquation(s, topN) {
  const catTotal = s.cat_total;
  if (catTotal == null || !catTotal) return "";   // 老后端没这两个字段，不硬编一个可能错的算式
  const neg = s.cat_negative || 0;
  const orphan = (s.refund_orphan || 0) + (s.reimb_orphan || 0);
  const parts = [`分类合计 ${money(catTotal)}`];
  if (neg) parts.push(`− 冲抵后为负 ${money(neg)}`);
  if (orphan) parts.push(`− 无主冲抵 ${money(orphan)}`);
  const tail = (neg || orphan) ? ` = 支出 ${money(s.expense || 0)}` : "";
  return `<div class="hint" style="margin-top:8px">
    ${parts.join(" ")}${tail}${topN ? `（图里只画前 ${topN} 类，合计按全部类目算）` : ""}。
  </div>`;
}

/* ---------------- 统计 → 明细 ---------------- */
/* 统计卡片上的金额都能点：点的是「这些数字由哪几笔组成」，看完能直接接着做抵扣。
   翻译成明细的筛选条件时，跨月累计的指标（待报销 / 待用券）必须把月份放开——

async function loadStats() {
  try {
    const s = await api(`/stats?month=${state.month}`);

    const gross = s.expense_gross == null ? s.expense : s.expense_gross;
    const offset = s.refund_offset || 0;

    const orphanAll = orphan + (s.reimb_orphan || 0);
    const balance = s.income - netExpense;                // 结余：收入 − 净支出
    const ioMax = Math.max(1, s.income + netExpense);      // 收支对比条：两段之和占满整条
    // by_category 只含支出，direction 缺失时按支出处理，避免整块饼图被过滤空
    const allCats = s.by_category.filter(c => (c.direction || "expense") === "expense");
    const cats = allCats.slice(0, 8)
      .map(c => ({ label: c.cat_parent, value: c.total, color: catColorAny(c.cat_parent).c }));
    const owners = s.by_owner.filter(o => o.expense > 0)
      .map(o => ({ label: o.name, value: o.expense, color: ownerColor(o.id).c }));

    $("#stats-body").innerHTML = `
      <div class="card">
        <h3>本月收支 · ${state.month}</h3>
        <div class="bal-wrap">
          <span class="bal-label">结余</span>
          <span class="bal ${balance >= 0 ? "pos" : "neg"}">${balance < 0 ? "−" : ""}<span class="cur">¥</span>${(Math.abs(balance) / 100).toFixed(2)}</span>
        </div>
        <div class="io-bar">
          <div class="io-seg in" style="width:${(s.income / ioMax * 100).toFixed(1)}%"></div>
          <div class="io-seg out" style="width:${(netExpense / ioMax * 100).toFixed(1)}%"></div>
        </div>
        <div class="io-legend">
          <span><i class="io-dot in"></i>收入 ${money(s.income)}</span>
          <span><i class="io-dot out"></i>支出 ${money(netExpense)}</span>
        </div>
        ${(s.refund || s.reimb) ? `<div class="hint" style="margin-top:10px">
          原支出 ${money(gross)}${offset ? `，退款冲抵 −${money(offset)}` : ""}${reimbOff ? `，报销冲抵 −${money(reimbOff)}` : ""}${orphanAll ? `（另有本月无主冲抵 −${money(orphanAll)}）` : ""}，实付 ${money(netExpense)}。
        </div>` : ""}
        <div class="hint" style="margin-top:${(s.refund || s.reimb) ? "6px" : "10px"}">结余 = 收入 − 净支出，只统计所选月份；退款和报销都按原支出所在的月份冲减。</div>
      </div>

      <div class="card">
        <h3>报销</h3>
        <button class="stat-link" data-goto="pending">
          <span class="hint">待报销（跨月累计，还没到账）</span>
          <b class="amt" style="color:#b45309">${money(s.pending)}${s.pending_cnt ? " · " + s.pending_cnt + "笔" : ""}<i class="go">›</i></b>
        </button>
        <button class="stat-link" data-goto="reimb" style="margin-top:5px">
          <span class="hint">本月报销到账（按原支出所在月冲减）</span>
          <b class="amt" style="color:var(--accent)">${money(s.reimb || 0)}<i class="go">›</i></b>
        </button>
      </div>

      <div class="card">
        <h3>待用券</h3>
        <button class="stat-link" data-goto="voucher">
          <span class="hint">买了还没用掉（跨月累计）</span>
          <b class="amt" style="color:#6d629a">${money(s.voucher)}${s.voucher_cnt ? " · " + s.voucher_cnt + "笔" : ""}<i class="go">›</i></b>
        </button>
        <div class="hint" style="margin-top:9px">这部分钱已经花出去了，仍计入支出；用掉或退掉后在明细里点「处理」。</div>
      </div>

      <div class="card">
        <h3>共同支出</h3>
        <button class="stat-link" data-goto="shared">
          <span class="hint">家庭公共开销（已扣退款）</span>
          <b class="amt">${money(s.shared)}<i class="go">›</i></b>
        </button>
      </div>

      <div class="card">
        <h3>归属 · 本月支出</h3>
        ${pieBlock(owners, "本月还没有支出")}
      </div>

      <div class="card">
        <h3>支出分类 · 本月支出</h3>
        ${pieBlock(cats, "本月还没有支出")}
        ${catEquation(s, allCats.length > cats.length ? cats.length : 0)}
      </div>`;

    // 绑定放最后：卡片是刚写进去的，事件只能在这之后挂
    document.querySelectorAll("#stats-body [data-goto]").forEach(b => {
      b.onclick = () => gotoList(b.dataset.goto);
    });
  } catch (e) { $("#stats-body").innerHTML = `<div class="empty">${e.message}</div>`; }
}

/* ---------------- 分类管理（管理员） ----------------
   一屏只看一棵树：方向胶囊 → 紧凑列表 → 点开哪行才就地编辑。
   以前每个大类永远处于编辑态（无边框名字框 + 10 个色块常驻），16 个大类铺两千多像素，
   一屏只看得见两个半。2026-10-29 重做。

   重绘规则很重要：**click 里可以整块重绘，change（失焦/回车）里只能局部打补丁**。
   因为失焦事件先于点击发生，change 里重绘会把用户正要点的那个元素换掉，那一下点击就丢了。 */
const CAT_DIR_LABEL = { expense: "支出", income: "收入", refund: "退款" };
const CAT_DIRS = ["expense", "income", "refund"];

let catEdit = null;       // 编辑草稿（整棵树，保存时整体覆盖）
let catBase = null;       // 打开面板时的原样，用来算「几处未保存」
let catUsage = {};        // {方向: {大类: {total, month}}}，行尾的「本月 N 笔」
let catTab = "expense";   // 当前方向
let catOpen = "";         // 展开的大类（同一时刻只展开一个，屏幕才够用）
let catArm = "";          // 「删除」二次确认中的大类
let catSubEdit = "";      // 正在改名的子类，键是「父|子」
let catNameErr = "";      // 大类改名冲突的就地提示

const cloneTree = o => JSON.parse(JSON.stringify(o));

/* 草稿里这个大类当前的配色：优先用它自己的色位（还没保存也立刻看得到），
   没配就按树序兜底——与 catColor() 同一套规则，保存前后颜色不会跳 */
function catDraftColor(dir, p) {
  const tree = catEdit[dir] || {};
  const node = tree[p] || {};
  const slot = node.color_slot == null ? Object.keys(tree).indexOf(p) : node.color_slot;
  const n = CAT_PALETTE.length;
  return CAT_PALETTE[((slot % n) + n) % n];
}

/* 未保存计数：拿草稿和打开时的快照比。
   改名 = 一个键消失 + 一个键新增，而子类和配色都没动 → 配成 1 处；
   否则「改了三个名字」会显示成 6 处，看着像出 bug 了。 */
function catDiffCount() {
  if (!catEdit || !catBase) return 0;
  let n = 0;
  for (const dir of CAT_DIRS) {
    const a = catBase[dir] || {}, b = catEdit[dir] || {};
    const removed = Object.keys(a).filter(k => !b[k]);
    const added = Object.keys(b).filter(k => !a[k]);
    const paired = new Set();
    for (const r of removed) {
      const hit = added.find(k => !paired.has(k)
        && a[r].subs.join("\u0001") === b[k].subs.join("\u0001")
        && (a[r].color_slot ?? null) === (b[k].color_slot ?? null));
      if (hit) { paired.add(r); paired.add(hit); n += 1; }
    }
    n += removed.filter(k => !paired.has(k)).length + added.filter(k => !paired.has(k)).length;
    for (const k of Object.keys(a)) {
      if (!a[k] || !b[k]) continue;
      if ((a[k].color_slot ?? null) !== (b[k].color_slot ?? null)) n += 1;
      // join 带顺序，所以子类的换序也算「一处改动」——否则拖完顺序点了保存会提示没改动
      if (a[k].subs.join("\u0001") !== b[k].subs.join("\u0001")) n += 1;
    }
    // 大类的纯换序：键集合一样、只有先后变了才算 1 处。
    // 改名已经在上面配过对（键集合不同），所以不会重复计
    const ka = Object.keys(a).sort().join("\u0001"), kb = Object.keys(b).sort().join("\u0001");
    if (ka === kb && Object.keys(a).join("\u0001") !== Object.keys(b).join("\u0001")) n += 1;
  }
  return n;
}

function catEditorHtml(cfg, usage) {
  if (cfg) {
    catEdit = cloneTree(cfg);
    catBase = cloneTree(cfg);
    catTab = CAT_DIRS.find(d => Object.keys(cfg[d] || {}).length) || "expense";
    catOpen = ""; catArm = ""; catSubEdit = ""; catNameErr = "";
  }
  if (usage) catUsage = usage;
  if (!catEdit) return `<div class="hint">配置加载失败，刷新重试</div>`;
  return `
    <div class="cat-tabs">
      ${CAT_DIRS.map(d => `<button class="chip ${catTab === d ? "on" : ""}" data-ctab="${d}">${
        CAT_DIR_LABEL[d]} ${Object.keys(catEdit[d] || {}).length}</button>`).join("")}
    </div>
    <div class="cat-list">${catListHtml()}</div>
    <input class="cat-addp" id="cat-newp" placeholder="+ 新增大类，回车添加" autocomplete="off">
    <div id="cat-foot">${catBarHtml()}</div>`;
}

function catListHtml() {
  const tree = catEdit[catTab] || {};
  const names = Object.keys(tree);
  if (!names.length) return `<div class="hint" style="padding:14px 13px">这个方向还没有大类</div>`;
  return names.map(p => {
    const open = catOpen === p;
    const u = (catUsage[catTab] || {})[p] || {};
    return `<div class="cat-item ${open ? "open" : ""}" data-p="${esc(p)}">
      <div class="cat-hd" data-open="${esc(p)}">
        <span class="cat-dot" style="background:${catDraftColor(catTab, p).c}"></span>
        <span class="nm">${esc(p)}</span>
        <span class="meta">${tree[p].subs.length} 项 · 本月 ${u.month || 0} 笔</span>
        <i class="arw"></i>
      </div>
      ${open ? catDetailHtml(p) : ""}
    </div>`;
  }).join("");
}

function catDetailHtml(p) {
  const node = catEdit[catTab][p];
  const u = (catUsage[catTab] || {})[p] || {};
  const swatches = CAT_PALETTE.map((col, i) => `
    <button class="cat-sw" data-sw="${i}" title="色位 ${i}"
      style="background:${col.bg};border-color:${node.color_slot === i ? col.c : "var(--line)"};
             box-shadow:${node.color_slot === i ? `inset 0 0 0 2px ${col.c}` : "none"}"></button>`).join("");
  const subs = node.subs.map(s => (catSubEdit === p + "\u0001" + s)
    ? `<span class="cat-sub edit"><input id="cat-sub-in" data-subin="${esc(s)}" value="${esc(s)}">
         <b class="x" data-subdel="1">×</b></span>`
    : `<button class="cat-sub" data-subedit="${esc(s)}">${esc(s)}</button>`).join("");
  const armed = catArm === p;
  return `<div class="cat-detail">
    <div class="f-label">名称 <span>改完点别处生效，历史账单一起改</span></div>
    <input id="cat-pname" data-pname="1" value="${esc(p)}" autocomplete="off">
    ${catNameErr ? `<div class="cat-err">${esc(catNameErr)}</div>` : ""}
    <div class="f-label">颜色 <span>同一个色位在饼图、筛选胶囊里通用</span></div>
    <div class="cat-swatches">${swatches}</div>
    <div class="f-label">子类 <span>点一下改名，× 删掉，长按可拖动排序</span></div>
    <div class="cat-subs">
      ${subs}
      <input class="cat-sub-new" id="cat-sub-new" placeholder="+ 子类" autocomplete="off">
    </div>
    <button class="cat-delp ${armed ? "armed" : ""}" data-delp="${esc(p)}">${armed
      ? `再点一次，确认删除「${esc(p)}」`
      : `删除这个大类${u.total ? `（${u.total} 笔账在用）` : ""}`}</button>
    ${armed ? `<div class="hint" style="margin-top:6px">历史账单保持原样，只是新账不能再选它；保存前点「放弃」可以整体撤回。</div>` : ""}
  </div>`;
}

function catBarHtml() {
  const n = catDiffCount();
  return `<div style="height:${n ? 52 : 0}px"></div>
    <div class="cat-bar ${n ? "on" : ""}"><div class="cat-bar-in">
      <span class="n">${n} 处未保存</span>
      <button class="btn ghost small" id="cat-undo">放弃</button>
      <button class="btn small" id="cat-save">保存</button>
    </div></div>`;
}

/* 只重画底部浮条：change 里改了几个字就整块重绘的话，会把用户下一次点击的目标一起换掉 */
function catSyncBar() {
  const foot = $("#cat-foot");
  if (!foot) return;
  foot.innerHTML = catBarHtml();
  const s = $("#cat-save"), u = $("#cat-undo");
  if (s) s.onclick = () => withBusy(s, catSave);
  if (u) u.onclick = catUndo;
}

function catRender(focusSel) {
  const box = $("#cat-editor");
  if (!box) return;
  box.innerHTML = catEditorHtml();
  catBind();
  catSyncBar();
  const f = focusSel && box.querySelector(focusSel);
  if (f) {
    f.focus();
    const n = f.value.length;
    try { f.setSelectionRange(n, n); } catch (e) {}   // 光标留在末尾，连着加时不用重新点
  }
}

/* 改名成功后只打补丁，不整块重绘：这一行的标题、删除按钮、浮条计数三处跟着换 */
function catPatchRow(oldName, newName) {
  const box = $("#cat-editor");
  if (!box) return;
  const hd = box.querySelector(`.cat-hd[data-open="${CSS.escape(oldName)}"]`);
  if (hd) { hd.dataset.open = newName; hd.querySelector(".nm").textContent = newName; }
  const delp = box.querySelector(`.cat-delp[data-delp="${CSS.escape(oldName)}"]`);
  if (delp) delp.dataset.delp = newName;
}

function catShowNameErr(msg) {
  catNameErr = msg;
  const box = $("#cat-editor");
  if (!box) return;
  let el = box.querySelector(".cat-err");
  if (!msg) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.className = "cat-err";
    const inp = box.querySelector("#cat-pname");
    if (inp) inp.after(el);
  }
  el.textContent = msg;
}

function catCommitName(input) {
  const old = catOpen, tree = catEdit[catTab];
  const name = (input.value || "").trim().slice(0, 12);
  if (!name) { input.value = old; return catShowNameErr("名字不能为空"); }
  if (name === old) return catShowNameErr("");
  if (tree[name]) {
    // 以前这里直接 return，输入框里还留着新名字，保存后又变回去——现在明说原因
    input.value = old;
    return catShowNameErr(`已经有「${name}」了，换个名字`);
  }
  const next = {};                    // 只换键，保持原来的顺序
  for (const [k, v] of Object.entries(tree)) next[k === old ? name : k] = v;
  catEdit[catTab] = next;
  catOpen = name;
  catShowNameErr("");
  catPatchRow(old, name);
  catSyncBar();
}

function catCommitSub(input) {
  const parent = catOpen, subs = catEdit[catTab][parent].subs;
  const old = input.dataset.subin;
  const name = (input.value || "").trim().slice(0, 12);
  catSubEdit = "";
  const back = () => {                // 换回普通胶囊，别的节点一个都不动
    const span = input.parentElement;
    if (!span) return;
    const btn = document.createElement("button");
    btn.className = "cat-sub";
    btn.dataset.subedit = old;
    btn.textContent = old;
    span.replaceWith(btn);
  };
  if (!name || name === old) return back();
  if (subs.includes(name)) { back(); return toast("这个子类已经有了"); }
  catEdit[catTab][parent].subs = subs.map(x => (x === old ? name : x));
  input.dataset.subin = name;
  catSubEdit = "";
  const span = input.parentElement;
  if (span) {
    const btn = document.createElement("button");
    btn.className = "cat-sub";
    btn.dataset.subedit = name;
    btn.textContent = name;
    span.replaceWith(btn);
  }
  catSyncBar();
}

/* ---------------- 分类排序：长按拖拽 ----------------
   为什么不用 HTML5 drag & drop：手机上根本不触发；也不用 mousedown/mousemove，
   因为手指按住时页面本来就在滚。这里用 Pointer Events + 320ms 长按判定：
   按下后不动够久才算进入拖动，中途位移超过 8px 就当作滚动，立刻放弃。
   进入拖动后在 document 上挂非 passive 的 touchmove 拦默认行为，页面才不会跟着滚
   （给元素设 touch-action:none 会把这块的普通滚动一起废掉，只能按需拦）。

   落点靠 elementFromPoint 找「手指下面那一项」：拖动中的元素是 position:fixed 且
   pointer-events:none，命中的就是它底下的兄弟项。拿到目标项后按中线决定插前还是插后，
   虚线占位块 ph 标出「松手会落在哪」。松手时**从 DOM 顺序反推数据顺序**，不自己算索引——
   算索引要处理「自己被排除」的偏差，看一眼 DOM 更不容易错。 */
const CAT_LONGPRESS = 320;
const CAT_SLOP = 8;
let catDrag = null;
let catClickBlock = 0;      // 拖完那一下 click 要吞掉，否则松手会顺手展开一行

function catDragTouch(e) {
  if (catDrag && catDrag.active) e.preventDefault();
}

function catDragStart(e) {
  if (catDrag) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest("input,textarea,[data-subdel]")) return;
  const sub = e.target.closest(".cat-sub");
  const item = e.target.closest(".cat-item");
  let d = null;
  if (sub && !sub.classList.contains("edit")) {
    // 子类只在本大类的子类堆里排：跨到大类外面就是改分类，不是排序
    if (!item || !item.classList.contains("open")) return;
    d = { kind: "sub", el: sub, container: sub.closest(".cat-subs"), sel: ".cat-sub",
          parent: item.dataset.p };
  } else if (item && e.target.closest(".cat-hd")) {
    d = { kind: "parent", el: item, container: item.parentElement, sel: ".cat-item" };
  }
  if (!d) return;
  d.pid = e.pointerId;
  d.x0 = e.clientX; d.y0 = e.clientY;
  d.mouse = e.pointerType === "mouse";
  d.tmr = setTimeout(() => catDragArm(d), CAT_LONGPRESS);
  catDrag = d;
  window.addEventListener("pointermove", catDragMove, { passive: false });
  window.addEventListener("pointerup", catDragEnd);
  window.addEventListener("pointercancel", catDragCancel);
}

/* 长按够时长了：把这一项摘出来跟着手指走，原地留一块虚线占位 */
function catDragArm(d) {
  if (catDrag !== d) return;
  const r = d.el.getBoundingClientRect();
  d.active = true;
  d.el.classList.add("dragging");
  d.el.style.left = r.left + "px";
  d.el.style.top = r.top + "px";
  d.el.style.width = r.width + "px";
  d.ph = document.createElement("div");
  d.ph.className = d.kind === "parent" ? "cat-ph" : "cat-ph-sub";
  d.ph.style.height = r.height + "px";
  if (d.kind === "sub") d.ph.style.width = r.width + "px";
  d.el.after(d.ph);
  document.addEventListener("touchmove", catDragTouch, { passive: false });
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
}

function catDragMove(e) {
  const d = catDrag;
  if (!d || e.pointerId !== d.pid) return;
  if (!d.active) {
    const moved = Math.hypot(e.clientX - d.x0, e.clientY - d.y0);
    if (moved <= CAT_SLOP) return;
    // 手指：一动就是滚页面，撤掉。鼠标：没有滚动这回事，拖起来就进拖动（不必干等 320ms）
    if (!d.mouse) return catDragCancel();
    clearTimeout(d.tmr);
    catDragArm(d);
  }
  e.preventDefault();
  d.el.style.transform = `translate(${e.clientX - d.x0}px, ${e.clientY - d.y0}px)`;
  catDragHover(e);
  // 拖到屏幕上下边缘自动滚：长列表不用先松手、滚一屏、再按住
  const EDGE = 70;
  if (e.clientY < EDGE) window.scrollBy(0, -12);
  else if (e.clientY > window.innerHeight - EDGE) window.scrollBy(0, 12);
}

function catDragHover(e) {
  const d = catDrag;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const over = hit && hit.closest(d.sel);
  if (!over || over === d.el || over === d.ph) return;
  if (over.parentElement !== d.ph.parentElement) return;
  const r = over.getBoundingClientRect();
  let after;
  if (d.kind === "parent") after = e.clientY > r.top + r.height / 2;
  else if (e.clientY > r.bottom) after = true;
  else if (e.clientY < r.top) after = false;
  else after = e.clientX > r.left + r.width / 2;
  const ref = after ? over.nextElementSibling : over;
  if (ref === d.ph) return;
  over.parentElement.insertBefore(d.ph, ref);
}

function catDragEnd() {
  const d = catDrag;
  if (!d) return;
  clearTimeout(d.tmr);
  if (!d.active) return catDragCleanup();
  const selfKey = d.kind === "parent" ? d.el.dataset.p : d.el.dataset.subedit;
  const order = [];
  for (const el of d.container.children) {
    if (el === d.el) continue;
    if (el === d.ph) { order.push(selfKey); continue; }
    if (!el.matches(d.sel)) continue;
    const k = d.kind === "parent" ? el.dataset.p : el.dataset.subedit;
    if (k != null) order.push(k);        // 改名输入框（.cat-sub.edit）没有键，跳过
  }
  catDragCleanup();
  if (d.kind === "parent") catApplyParentOrder(order);
  else catApplySubOrder(d.parent, order);
  catRender();                           // 顺序变了整块重画，展开状态沿用 catOpen
}

function catDragCancel() {
  const d = catDrag;
  if (!d) return;
  catDragCleanup();
  // 拖动中被系统打断（来电、手势返回）：把固定定位撤掉就行，DOM 顺序本来就没动过
  if (d.active) catRender();
}

function catDragCleanup() {
  const d = catDrag;
  catDrag = null;
  if (!d) return;
  clearTimeout(d.tmr);
  window.removeEventListener("pointermove", catDragMove);
  window.removeEventListener("pointerup", catDragEnd);
  window.removeEventListener("pointercancel", catDragCancel);
  document.removeEventListener("touchmove", catDragTouch);
  if (d.ph && d.ph.parentElement) d.ph.remove();
  if (d.el) {
    d.el.classList.remove("dragging");
    ["left", "top", "width", "transform"].forEach(k => d.el.style.removeProperty(k));
  }
  if (d.active) catClickBlock = Date.now();
}

/* 数据落地：只换键序，节点对象原样搬过去（色位、子类都不动） */
function catApplyParentOrder(order) {
  const tree = catEdit[catTab], next = {};
  for (const k of order) if (tree[k]) next[k] = tree[k];
  for (const k of Object.keys(tree)) if (!(k in next)) next[k] = tree[k];   // 兜底：没进 DOM 的别丢
  if (Object.keys(next).join("\u0001") !== Object.keys(tree).join("\u0001")) catEdit[catTab] = next;
}

function catApplySubOrder(parent, order) {
  const node = catEdit[catTab] && catEdit[catTab][parent];
  if (!node) return;
  const cur = node.subs.slice();
  const next = order.filter(s => cur.includes(s));
  for (const s of cur) if (!next.includes(s)) next.push(s);
  node.subs = next;
}

function catBind() {
  const box = $("#cat-editor");
  if (!box) return;

  box.onclick = e => {
    // 刚拖完松手的那一下 click 不算「点了一下」：否则会顺手展开/收起，甚至进改名
    if (Date.now() - catClickBlock < 400) return;
    const el = e.target.closest("[data-ctab],[data-open],[data-sw],[data-subedit],[data-delp]");
    if (!el) return;
    const d = el.dataset;

    if (d.ctab) {                     // 换方向：收起展开项，免得展开状态串到另一棵树
      catTab = d.ctab; catOpen = ""; catArm = ""; catSubEdit = ""; catNameErr = "";
      return catRender();
    }
    if (d.open != null) {             // 展开 / 收起
      catOpen = catOpen === d.open ? "" : d.open;
      catArm = ""; catSubEdit = ""; catNameErr = "";
      return catRender();
    }
    if (d.sw != null) {               // 换色位：再点同一个是取消
      const node = catEdit[catTab][catOpen];
      node.color_slot = node.color_slot === +d.sw ? null : +d.sw;
      return catRender();
    }
    if (d.subedit != null) {          // 点子类 → 就地变成输入框
      catSubEdit = catOpen + "\u0001" + d.subedit;
      return catRender("#cat-sub-in");
    }
    if (d.delp != null) {             // 两下才真删：第一下只是把后果说清楚
      if (catArm !== d.delp) { catArm = d.delp; return catRender(); }
      if (Object.keys(catEdit[catTab]).length <= 1) return toast("每个方向至少要留一个大类");
      delete catEdit[catTab][d.delp];
      catOpen = ""; catArm = "";
      toast("已删除，保存前点「放弃」可撤回");
      return catRender();
    }
  };

  /* 子类的 × 必须抢在 blur 之前处理：输入框一失焦就会走 onchange 把这一小段 DOM 换掉，
     等 click 落到时按钮已经不是原来那个元素了，第一下必空。pointerdown + 阻止默认，
     焦点不动、change 不触发，删除才由我们来。 */
  box.onpointerdown = e => {
    const x = e.target.closest("[data-subdel]");
    if (!x) return catDragStart(e);     // 长按拖动排序的起点（按下只是计时，动起来就撤）
    e.preventDefault();
    const subs = catEdit[catTab][catOpen].subs;
    if (subs.length <= 1) return toast("每个大类至少要留一个子类");
    const name = catSubEdit.split("\u0001").slice(1).join("\u0001");
    catEdit[catTab][catOpen].subs = subs.filter(v => v !== name);
    catSubEdit = "";
    catRender("#cat-sub-new");
  };

  box.onchange = e => {
    const t = e.target;
    if (t.dataset.pname) return catCommitName(t);
    if (t.dataset.subin !== undefined) return catCommitSub(t);
  };

  box.onkeydown = e => {
    const t = e.target;
    if (e.key === "Escape") { catSubEdit = ""; catNameErr = ""; return catRender(); }
    if (e.key !== "Enter") return;
    if (t.id === "cat-newp") {
      e.preventDefault();
      const name = (t.value || "").trim().slice(0, 12);
      if (!name) return;
      if (catEdit[catTab][name]) return toast("这个大类已存在");
      catEdit[catTab][name] = { color_slot: null, subs: ["其他"] };
      catOpen = name; catArm = "";
      t.value = "";
      return catRender("#cat-sub-new");     // 新增完直接能加子类
    }
    if (t.id === "cat-sub-new") {
      e.preventDefault();
      const name = (t.value || "").trim().slice(0, 12);
      if (!name) return;
      const subs = catEdit[catTab][catOpen].subs;
      if (subs.includes(name)) return toast("这个子类已经有了");
      subs.push(name);
      t.value = "";
      return catRender("#cat-sub-new");     // 连着加不用再点一次（以前每次都失焦）
    }
    if (t.dataset.subin !== undefined || t.dataset.pname) {
      e.preventDefault();
      t.blur();                             // 走 onchange 那条路，避免两套提交逻辑
    }
  };
}

function catUndo() {
  catEdit = cloneTree(catBase);
  catOpen = ""; catArm = ""; catSubEdit = ""; catNameErr = "";
  catRender();
}

/* 保存按钮原来是一下把整棵树覆盖上去：这次改动会不会连带改写历史账单、
   有没有分类被删掉，用户按下去之前完全看不见。R3 就是这么把 3 笔账的分类
   悄悄改到了别的类目下。现在的顺序是：预览（只读）→ 有历史的删不掉 → 会改写先问 → 再落库。 */
function catItemLabel(x) {
  return x.type === "sub" ? `${x.parent} / ${x.from}` : x.from;
}
function catBlockedText(plan) {
  const all = plan.blocked || [];
  const shown = all.slice(0, 3).map(b => `「${catItemLabel(b)}」${b.affected} 笔`);
  let body = shown.join("、");
  if (all.length > shown.length) body += ` 等 ${all.length} 个分类`;
  return "这些分类下还有历史账单，不能直接删：" + body +
    "\n\n想换名字请改名（子类保持一致就能认出来）；想合并，先把这些账改到目标分类。";
}
function catConfirmText(plan) {
  const hits = (plan.renames || []).filter(r => r.affected > 0);
  const shown = hits.slice(0, 3).map(r => `· ${catItemLabel(r)} → ${r.to}（${r.affected} 笔）`);
  if (hits.length > shown.length) shown.push(`· 等 ${hits.length - shown.length} 处改名`);
  return `这次保存会改写 ${plan.affected_total} 笔历史账单的分类：\n\n${shown.join("\n")}` +
    "\n\n只换分类名，金额和日期都不动。继续？";
}

async function catSave() {
  if (!catEdit) return;
  try {
    // 第一道门：只读预览，一个字都不写。失败也不会留下半截状态。
    const pv = (await api("/categories/config",
      { method: "POST", body: { config: catEdit, preview: true } })).preview || {};
    if ((pv.blocked || []).length) return void alert(catBlockedText(pv));
    let dirty = (pv.affected_total || 0) > 0;
    if (dirty && !confirm(catConfirmText(pv))) return;   // 用户改主意，账一笔没动

    // 第二道门：落库。服务端会按当时的库重算计划，所以上面那份 preview 只用来问，
    // 不能当提交依据。两步之间若有人也改了分类，服务端可能把「要确认」丢回来——
    // 就地补确认再提交一次，最多两圈。
    let r;
    for (let i = 0; i < 2; i++) {
      try {
        r = await api("/categories/config",
          { method: "POST", body: dirty ? { config: catEdit, confirm: true } : { config: catEdit } });
        break;
      } catch (e) {
        if (e.code === "category_has_history" && e.preview) return void alert(catBlockedText(e.preview));
        if (e.code === "need_confirm" && e.preview && !dirty) {
          if (!confirm(catConfirmText(e.preview))) return;
          dirty = true;
          continue;
        }
        throw e;
      }
    }
    if (!r) return;
    toast(r.renamed_tx ? `已保存，连带更新 ${r.renamed_tx} 笔历史账单` : "已保存");
    state.meta = await api("/meta");          // 让全页立即用上新的树和配色
    catEdit = null; catBase = null;
    renderMe();
  } catch (e) { toast(e.message); }
}

/* ---------------- 设置 ---------------- */
const kTok = n => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0));
async function renderMe() {
  const me = state.me;
  let settings = null, logs = null, catCfg = null, catLogs = null;
  if (me.is_admin) {
    try { settings = await api("/settings"); } catch (e) {}
    try { logs = await api("/ai/logs?limit=20"); } catch (e) {}
    try { const cc = await api("/categories/config"); catCfg = cc.config; catUsage = cc.usage || {}; } catch (e) {}
    try { catLogs = (await api("/categories/logs")).items; } catch (e) {}
  }

  $("#view").innerHTML = `
    <div class="card">
      <h3>当前账号</h3>
      <div class="spread"><span>${me.display_name}</span><span class="hint">${me.username}</span></div>
    </div>

    <div class="card">
      <h3>修改密码</h3>
      <div class="field"><label>原密码</label><input type="password" id="p-old" autocomplete="current-password"></div>
      <div class="field"><label>新密码（至少 8 位）</label><input type="password" id="p-new" autocomplete="new-password"></div>
      <button class="btn" id="p-save">保存</button>
    </div>

    ${me.is_admin ? `
    <div class="card">
      <h3>分类管理</h3>
      <div class="hint" style="margin-bottom:12px">
        <b>长按大类或子类可以拖动排序</b>，这里的顺序就是记账页选择器、筛选胶囊的先后；拖完点底部「保存」才生效。<br>
        改名会连带更新历史账单和统计，保存前会先告诉你影响几笔、要你确认；<br>
        删除只对没用过的分类有效——下面还有账单的分类删不掉，只能改名或先把账改走。<br>
        每个方向至少留 1 个大类，每个大类至少留 1 个子类；新名字不能和历史账单里的旧名字相同。
      </div>
      <div id="cat-editor">${catEditorHtml(catCfg, catUsage)}</div>
    </div>

    <div class="card">
      <h3>AI 记账</h3>
      <div class="hint" style="margin-bottom:10px">
        当前：${settings && settings.ai_enabled ? "已配置" : "未配置"}${settings && settings.ai_key_masked ? "（" + settings.ai_key_masked + "）" : ""}
      </div>
      <div class="field"><label>智谱 API Key</label><input id="ai-key" placeholder="留空则不修改"></div>
      <div class="field"><label>模型</label><input id="ai-model" value="${esc(settings ? settings.ai_model : "")}" placeholder="glm-5.3-flash"></div>
      <button class="btn" id="ai-save">保存</button>
      <div class="hint" style="margin-top:10px">
        glm-5.3-flash 是原生多模态：写一句话和拍张小票走同一个模型，不需要另配视觉模型。<br>
        文字和识图都带 reasoning_effort=low：文字约 1～2 秒，识图约 4～5 秒。<br>
        识图曾经不压推理（怕读错金额），实测证伪——不压 12 秒、金额也没更准，只有分类更细一点。
      </div>
    </div>

    <div class="card">
      <h3>AI 调用日志</h3>
      ${logs && logs.week.count ? `
        <div class="spread">
          <span class="hint">近 7 天 ${logs.week.count} 次 · 成功 ${logs.week.ok}${logs.week.count > logs.week.ok ? " · 失败 " + (logs.week.count - logs.week.ok) : ""}</span>
          <span class="hint mono">${kTok(logs.week.prompt_tokens)} 入 / ${kTok(logs.week.completion_tokens)} 出</span>
        </div>
        <div class="hint" style="margin-bottom:8px">平均 ${(logs.week.avg_ms / 1000).toFixed(1)} 秒</div>
      ` : `<div class="hint" style="margin-bottom:8px">还没有调用记录，去「记一笔」试一句</div>`}
      ${logs && logs.items.length ? logs.items.map(r => `
        <div class="log-row">
          <span class="log-tag ${r.status === "ok" ? "" : "bad"}">${r.kind === "image" ? "图" : "文"}</span>
          <span class="log-main">${esc(r.input_brief || "（无文字）")}${r.status === "ok" ? "" : " · " + esc(r.error)}</span>
          <span class="log-meta">${r.ts.slice(5, 16).replace("T", " ")}<br>${(r.latency_ms / 1000).toFixed(1)}s</span>
        </div>`).join("") : ""}
      <div class="hint" style="margin-top:10px">
        只留 90 天，输入存前 120 字摘要（备注里有医院、人名，不整段留）。换模型或调 prompt 时拿它复盘。
      </div>
    </div>

    <div class="card">
      <h3>分类修改日志</h3>
      ${catLogs && catLogs.length ? catLogs.map(r => `
        <div class="log-row">
          <span class="log-tag ${r.action === "rename" ? "bad" : ""}">${
            {add: "增", del: "删", rename: "改", color: "色", update: "存"}[r.action] || "记"}</span>
          <span class="log-main">${esc(r.detail || r.cat_parent || "")}${
            r.affected > 0 ? ` · 连带 ${r.affected} 笔` : ""}${r.user_name ? ` · ${esc(r.user_name)}` : ""}</span>
          <span class="log-meta">${r.ts.slice(5, 16).replace("T", " ")}</span>
        </div>`).join("") : `<div class="hint" style="margin-bottom:8px">还没有修改记录</div>`}
      <div class="hint" style="margin-top:10px">保留最近 200 条。改名连带更新的账单笔数列在每条后面。</div>
    </div>

    <div class="card">
      <h3>添加账号</h3>
      <div class="field"><label>用户名（小写字母/数字/下划线）</label><input id="u-name" autocapitalize="none"></div>
      <div class="field"><label>显示名</label><input id="u-display" placeholder="如：张三"></div>
      <div class="field"><label>初始密码（至少 8 位）</label><input id="u-pwd" type="password"></div>
      <button class="btn" id="u-save">创建</button>
    </div>` : ""}

    <button class="btn ghost" id="logout">退出登录</button>
    <div style="height:10px"></div>
    <div class="hint" style="text-align:center;padding:8px 0 20px">数据存在自己服务器上 · 每日自动备份</div>`;

  $("#p-save").onclick = async () => {
    try {
      await api("/password", { method: "POST", body: { old: $("#p-old").value, new: $("#p-new").value } });
      toast("密码已修改，请重新登录"); setTimeout(() => location.reload(), 1200);
    } catch (e) { toast(e.message); }
  };
  $("#logout").onclick = doLogout;
  if (me.is_admin) {
    catBind();            // 列表的展开 / 改名 / 配色 / 增删都走这一套委托
    catSyncBar();         // 浮条上的「保存 / 放弃」由它挂，草稿为空时浮条不出现
    $("#ai-save").onclick = async () => {
      try {
        await api("/settings", { method: "POST", body: { ai_api_key: $("#ai-key").value, ai_model: $("#ai-model").value } });
        toast("已保存"); renderMe();
      } catch (e) { toast(e.message); }
    };
    $("#u-save").onclick = async () => {
      try {
        await api("/users", { method: "POST", body: {
          username: $("#u-name").value, display_name: $("#u-display").value, password: $("#u-pwd").value } });
        toast("账号已创建"); renderMe();
      } catch (e) { toast(e.message); }
    };
  }
}

boot();
</script>
<script>
/* ---------------- 下拉刷新 ----------------
   只在页面顶部（scrollY<=0）向下拖时才接管，其它情况一律放行给原生滚动。
   刷新 = 重新拉 /meta 再 render()，和「设置里保存分类」后的做法一致。 */
(function(){
  var box = document.createElement('div');
  box.id = 'ptr';
  box.innerHTML = '<span class="ptr-i"></span><span class="ptr-t">下拉刷新</span>';
  document.body.appendChild(box);
  var txt = box.querySelector('.ptr-t');
  var THRESH = 64, MAX = 108;
  var startY = 0, pulling = false, dist = 0, busy = false;

  function paint(d, animate){
    box.style.transition = animate ? 'transform .28s var(--ease),opacity .2s var(--ease)' : 'none';
    box.style.transform = 'translateY(' + d + 'px)';
    box.style.opacity = d > 6 ? String(Math.min(1, d / 36)) : '0';
  }
  function say(mode){
    box.classList.toggle('armed', mode === 'armed');
    box.classList.toggle('busy', mode === 'busy');
    txt.textContent = mode === 'busy' ? '刷新中' : (mode === 'armed' ? '松手刷新' : '下拉刷新');
  }
  function cancel(){ pulling = false; dist = 0; say(''); paint(0, true); }

  function run(){
    busy = true; say('busy'); paint(THRESH, true);
    Promise.resolve()
      .then(function(){ return api('/meta'); })
      .then(function(m){
        state.meta = m;
        render();
        return new Promise(function(r){ setTimeout(r, 340); });
      })
      .then(function(){ toast('已刷新'); })
      .catch(function(e){ toast((e && e.message) || '刷新失败'); })
      .then(function(){ busy = false; say(''); paint(0, true); });
  }

  function move(y){
    var dy = y - startY;
    if (dy <= 0 || window.scrollY > 0) { if (dist) cancel(); return; }
    dist = Math.min(MAX, dy * 0.5);
    say(dist >= THRESH ? 'armed' : '');
    paint(dist, false);
  }
  function end(){
    if (!pulling) return;
    pulling = false;
    if (dist >= THRESH) run(); else cancel();
  }

  window.addEventListener('touchstart', function(e){
    if (busy || window.scrollY > 0 || e.touches.length !== 1) return;
    startY = e.touches[0].clientY; pulling = true; dist = 0;
  }, { passive: true });

  window.addEventListener('touchmove', function(e){
    if (!pulling || busy) return;
    var y = e.touches[0].clientY;
    if (y - startY > 0 && window.scrollY <= 0) {
      if (e.cancelable) e.preventDefault();
      move(y);
    } else {
      pulling = false; if (dist) cancel();
    }
  }, { passive: false });

  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', function(){ if (pulling) cancel(); }, { passive: true });

  /* 桌面用鼠标拖也能触发，方便排查；不抢按钮和输入框 */
  var mouse = false;
  window.addEventListener('mousedown', function(e){
    if (busy || window.scrollY > 0 || e.button !== 0) return;
    if (e.target.closest('button,a,input,textarea,select,label,svg')) return;
    mouse = true; pulling = true; startY = e.clientY; dist = 0;
  });
  window.addEventListener('mousemove', function(e){
    if (!mouse || !pulling) return;
    if (e.clientY - startY > 0) { if (e.cancelable) e.preventDefault(); move(e.clientY); }
    else { pulling = false; if (dist) cancel(); }
  });
  window.addEventListener('mouseup', function(){ if (mouse) { mouse = false; end(); } });

  /* tab 切换时才播入场动画：盯住标题文字变化，保存后重渲染不闪 */
  var title = document.getElementById('page-title');
  if (title && window.MutationObserver){
    var last = title.textContent, timer = null;
    new MutationObserver(function(){
      var cur = title.textContent;
      if (cur === last) return;
      last = cur;
      var v = document.getElementById('view');
      if (!v) return;
      v.classList.remove('enter');
      void v.offsetWidth;
      v.classList.add('enter');
      clearTimeout(timer);
      timer = setTimeout(function(){ v.classList.remove('enter'); }, 600);
    }).observe(title, { childList: true, characterData: true, subtree: true });
  }
})();
</script>
</body>
