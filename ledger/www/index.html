    f.category = b.dataset.c; renderAdd();
  });
  $("#view").querySelectorAll("[data-owner]").forEach(b => b.onclick = () => {
    f.owner_id = +b.dataset.owner; renderAdd();
  });
  // 标记卡只在支出方向下渲染，收入/退款时这些节点不存在，必须判空
  const tg = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  tg("#tg-shared", () => { f.shared = !f.shared; renderAdd(); });
  tg("#tg-pending", () => { f.reimb_pending = !f.reimb_pending; renderAdd(); });
  tg("#tg-voucher", () => { f.pending_use = !f.pending_use; renderAdd(); });
  tg("#tg-travel", () => { f.travel = !f.travel; renderAdd(); });
  $("#tx-date").onchange = e => { state.dateText = e.target.value; };
  $("#note").oninput = e => {
    state.noteText = e.target.value;
    // 备注参与「备注关键词」匹配，改了也要重算
    if (f.direction === "refund") scheduleTargets();
  };
  $("#save").onclick = saveTx;
  const aiBtn = $("#ai-btn");
  if (aiBtn) aiBtn.onclick = aiParse;
  const aiInput = $("#ai-input");
  if (aiInput) {
    aiInput.oninput = () => { state.aiText = aiInput.value; };
    aiInput.onkeydown = e => { if (e.key === "Enter") aiParse(); };
  }
  const aiPic = $("#ai-pic"), aiFile = $("#ai-file");
  if (aiPic && aiFile) aiPic.onclick = () => aiFile.click();
  if (aiFile) aiFile.onchange = async () => {
    const file = aiFile.files && aiFile.files[0];
    aiFile.value = "";                 // 清空后才允许重复选同一张
    if (!file) return;
    try {
      state.aiImage = await shrinkImage(file);
      state.aiHint = "";
      renderAdd();                     // 缩略图要立刻出现，别等识别完
      aiParse();                       // 选完图直接识别，手机上少点一次
    } catch (e) { toast(e.message); }
  };
  const aiClear = $("#ai-clear");
  if (aiClear) aiClear.onclick = () => { state.aiImage = ""; state.aiHint = ""; renderAdd(); };
  const more = $("#tgt-more");
  if (more) more.onclick = () => {
    const box = $("#tgt-search");
    box.hidden = !box.hidden;
    more.textContent = box.hidden ? "找不到？搜更早的账单" : "收起搜索";
    if (!box.hidden) $("#tgt-q").focus();
  };
  const q = $("#tgt-q");
  if (q) {
    q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(searchTargets, 320); };
    q.onkeydown = e => { if (e.key === "Enter") { clearTimeout(searchTimer); searchTargets(); } };
  }
  if (f.direction === "refund") loadTargets();
}

/* ---- 退款冲抵候选 ----
   服务端按「同额 > 备注关键词 > 金额接近」排序，这里只负责预选、展示和交互。
   state.target：null = 还没决定（会自动选最强候选）；"none" = 用户手点的不冲抵。 */
let targetTimer = null, searchTimer = null, targetSeq = 0, searchSeq = 0;
function scheduleTargets() {
  clearTimeout(targetTimer);
  targetTimer = setTimeout(loadTargets, 320);
}
/* 金额 / 归属人 / 备注任一变化都算「换了一笔」，旧的冲抵选择必须作废 */
function targetSig() {
  const amt = ($("#amount") || {}).value || "";
  const note = ($("#note") || {}).value || "";
  return `${amt}|${state.form.owner_id || ""}|${note}`;
}
const MATCH_TAG = {
  same: ["同额", "same"],
  kw: ["备注对得上", "kw"],
  near: ["", "near"],
};

/* 报销候选的默认勾选规则：**只有到账金额能覆盖全部候选时才自动全选**。

   早先是「拿到候选就无条件全选」，于是还没填金额（0.00）时两笔待报销就已经是
   「已选」，而底部提示写着「先填到账金额，再勾选要冲抵的支出」——界面和行为互相
   打脸，用户会以为系统擅自匹配了支出。金额没填就无从判断这笔到账要冲抵什么，
   这时一律先不选。

   用户自己点过候选（reimbTouched）之后，这套规则永久退出，不再覆盖他的选择。 */
function autoSelectReimb() {
  if (state.reimbTouched) return;
  const items = state.targetItems || [];
  const cents = parseAmount(($("#amount") || {}).value) || 0;
  const total = items.reduce((a, t) => a + t.remain_cents, 0);
  state.reimbSel = (cents > 0 && total > 0 && total <= cents)
    ? items.map(t => t.id) : [];
}

/* 报销候选：多选。一次到账往往摊到好几笔支出上，单选根本表达不了。
   能全额覆盖时默认全选（多数时候就是「这几笔一起报」），看着合计取消不该报的，
   比一笔一笔点快；覆盖不了就得自己挑，系统不替你决定报哪几笔。
   不预选单笔：退款点错一笔最多错几十块，报销点错一笔是整笔账错。 */
function renderReimbTargets(items) {
  const box = $("#targets");
  if (!box) return;
  if (!items.length) {
    box.innerHTML = `<span class="hint">没有标记「待报销」的支出。报销只认这个标记——<br>到明细里给要报的那几笔打开「待报销」，再回来就能看到。</span>`;
    return;
  }
  box.innerHTML = items.map(t => {
    const on = state.reimbSel.includes(t.id);
    const sub = [t.category, t.note].filter(Boolean).join(" · ");
    return `<button class="chip tgt ${on ? "on" : ""}" data-rt="${t.id}">
        <span class="tgt-main"><b>${t.tx_date.slice(5)}</b> ${esc(sub || "—")}</span>
        <span class="tgt-side"><i class="tgt-tag ${on ? "kw" : "near"}">${on ? "已选" : "选它"}</i><b class="tgt-amt">剩 ${money(t.remain_cents)}</b></span>
      </button>`;
  }).join("");
  box.querySelectorAll("[data-rt]").forEach(b => b.onclick = () => {
    const id = +b.dataset.rt;
    const i = state.reimbSel.indexOf(id);
    if (i >= 0) state.reimbSel.splice(i, 1); else state.reimbSel.push(id);
    state.reimbTouched = true;      // 用户自己动过，之后不再自动全选
    renderReimbTargets(items);
    autoFillSubsidy();              // 差补 = 到账 − 已选合计，勾选一变就重算
    updateSubsidyHint();
    updateTargetHint(items);
  });
}

function renderTargets(items) {
  const box = $("#targets");
  if (!box) return;
  state.targetItems = items;      // 合计/校验都要用，存一份
  if (state.offsetKind === "reimb") return renderReimbTargets(items);
  const picked = state.target;
  const list = items.slice();
  // 从搜索里挑的候选不在 30 天列表里，钉在最前面显示，否则看不到自己选了谁
  if (state.pinned && !list.some(i => i.id === state.pinned.id)) list.unshift(state.pinned);
  box.innerHTML = list.map(t => {
    const [tagText, tagKind] = MATCH_TAG[t.match] || ["", "near"];
    const tag = tagKind === "near"
      ? (t.diff_cents > 0 ? `差 ${money(t.diff_cents)}` : "")
      : tagText;
    const sub = [t.category, t.note].filter(Boolean).join(" · ");
    return `<button class="chip tgt ${String(picked) === String(t.id) ? "on" : ""}" data-t="${t.id}">
        <span class="tgt-main"><b>${t.tx_date.slice(5)}</b> ${esc(sub || "—")}</span>
        <span class="tgt-side">${tag ? `<i class="tgt-tag ${tagKind}">${tag}</i>` : ""}<b class="tgt-amt">剩 ${money(t.remain_cents)}</b></span>
      </button>`;
  }).join("")
    + `<button class="chip tgt ${picked === "none" ? "on" : ""}" data-t="none">
        <span class="tgt-main">不冲抵</span>
        <span class="tgt-side"><i class="tgt-tag near">只减净支出</i></span>
      </button>`;
  box.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    state.target = b.dataset.t === "none" ? "none" : +b.dataset.t;
    if (b.dataset.t !== "none") {
      const hit = list.find(i => String(i.id) === b.dataset.t);
      if (hit && !items.some(i => i.id === hit.id)) state.pinned = hit;
    } else {
      state.pinned = null;
    }
    renderTargets(items);
    updateTargetHint(items);
  });
}

function updateTargetHint(items) {
  const hint = $("#target-hint");
  if (!hint) return;
  // 报销候选按「归属」过滤后为空时，服务端会放宽到全部人；这里说清楚，别让人以为串账了
  const relaxed = state.targetsRelaxed ? "该归属人名下没有可报的支出，已放宽到全部人。" : "";
  if (state.offsetKind === "reimb") return updateReimbHint(items, relaxed);
  const picked = state.target;
  if (!items.length && !state.pinned) {
    hint.textContent = "近 30 天没有金额对得上的支出，这笔会记成无主退款；更早的账单可以搜。";
    return;
  }
  if (picked === "none" || picked === null || picked === undefined) {
    hint.textContent = relaxed + "不冲抵：只减少当月净支出，不影响分类占比。";
    return;
  }
  const it = items.find(i => String(i.id) === String(picked)) || state.pinned;
  if (!it) {
    hint.textContent = relaxed + "选中后统计里会自动抵扣这笔支出。";
  } else if (it.match === "same") {
    hint.textContent = relaxed + `已关联 ${it.tx_date} 那笔，金额相同。不对点其他候选。`;
  } else if (it.match === "kw") {
    hint.textContent = relaxed + `已关联 ${it.tx_date} 那笔，备注对得上（原单 ${money(it.remain_cents)}）。不对点其他候选。`;
  } else {
    hint.textContent = relaxed + `已关联 ${it.tx_date} 那笔，比你填的多 ${money(it.diff_cents)}。不对点其他候选。`;
  }
}

/* 报销模式的合计提示：已选 / 可冲抵 / 差额。
   「可冲抵」= 到账金额 − 差补——差补那部分要记收入，不能拿来抵支出。 */
function updateReimbHint(items, relaxed) {
  const hint = $("#target-hint");
  if (!hint) return;
  const total = parseAmount(($("#amount") || {}).value) || 0;
  const subsidy = parseAmount(($("#subsidy") || {}).value) || 0;
  const can = Math.max(0, total - subsidy);
  const sel = (state.targetItems || items || []).filter(t => state.reimbSel.includes(t.id));
  const sum = sel.reduce((a, t) => a + t.remain_cents, 0);
  if (!total) {
    // 金额没填时不能只说「先填金额」——用户可能已经手动勾了几笔，得告诉他现在勾了啥
    hint.innerHTML = sel.length
      ? `已勾 <b>${sel.length}</b> 笔（合计 ${money(sum)}），还没填到账金额——填上才知道够不够。`
      : "先填到账金额。下面是标了「待报销」的支出，金额够覆盖时才会自动勾上。";
    return;
  }
  if (sum > can) {
    hint.innerHTML = `已选 <b>${money(sum)}</b>，比可冲抵的 ${money(can)} 多 <b>${money(sum - can)}</b>`
      + "——取消两笔，或者把差补调小。";
    return;
  }
  if (sum === can) {
    hint.textContent = (subsidy ? `已选 ${money(sum)} 正好抵完，另记差补 ${money(subsidy)} 进收入。`
                               : `已选 ${money(sum)}，正好抵完。`) + " " + relaxed;
    return;
  }
  hint.innerHTML = `已选 <b>${money(sum)}</b> / 可冲抵 ${money(can)}，还差 <b>${money(can - sum)}</b> 没认领`
    + `——这部分会记成无主冲抵${subsidy ? "" : "；如果到账里有差补，填到上面那一栏"}。 ` + relaxed;
}

/* 差补的自动值 = 到账金额 − 已选支出合计。
   算不出来（没填到账 / 一笔没选 / 已选就超过到账）一律 0——这时不填，差额落成无主冲抵。 */
function autoSubsidyCents() {
  const total = parseAmount(($("#amount") || {}).value) || 0;
  const sel = (state.targetItems || []).filter(t => state.reimbSel.includes(t.id));
  const sum = sel.reduce((a, t) => a + t.remain_cents, 0);
  if (!total || !sum || sum >= total) return 0;
  return total - sum;
}

/* 把自动值写进差补框（同时记进 state，整页重渲染不会丢）。
   用户手动改过这一栏（state.subsidyManual）就不再覆盖——他知道自己出差几天。 */
function autoFillSubsidy() {
  const subIn = $("#subsidy");
  if (!subIn || state.subsidyManual) return;
  const auto = autoSubsidyCents();
  const text = auto ? (auto / 100).toFixed(2) : "";
  state.subsidyText = text;
  if (subIn.value !== text) subIn.value = text;
  refreshSubsidyCat();
}

/* 差补子类胶囊只在真填了金额时才露出来 */
function refreshSubsidyCat() {
  const cats = $("#subsidy-cats"), sub = $("#subsidy");
  if (cats) cats.style.display = parseAmount(sub && sub.value) ? "flex" : "none";
}

/* 差补提示：说清这个数怎么来的、会去哪；不校验天数（系统不知道你出差几天） */
function updateSubsidyHint() {
  const el = $("#subsidy-hint");
  if (!el) return;
  const total = parseAmount(($("#amount") || {}).value) || 0;
  const subsidy = parseAmount(($("#subsidy") || {}).value) || 0;
  const auto = autoSubsidyCents();
  if (total && subsidy >= total) {
    el.textContent = "差补不能等于或超过到账金额——那就不是报销了，直接记一笔收入更清楚。";
    return;
  }
  if (!subsidy) {
    el.innerHTML = "差补是公司按天包干给的钱（你没垫过），记在「收入 · 补贴」；不填就是全额报销。"
      + (auto ? ` 按已选合计应是 <b>${money(auto)}</b>，<button class="linkbtn" id="subsidy-auto">填上</button>` : "");
    return;
  }
  el.innerHTML = `差补 <b>${money(subsidy)}</b> 记进「收入 · 补贴」，剩下的 <b>${money(Math.max(0, total - subsidy))}</b> 用来冲抵支出。`
    + (state.subsidyManual
      ? (auto && auto !== subsidy ? ` 按已选合计应是 <b>${money(auto)}</b>，<button class="linkbtn" id="subsidy-auto">改回自动</button>` : "")
      : " 已按「到账 − 已选」自动算出，改这一栏就按你填的算。");
}

async function loadTargets() {
  const box = $("#targets");
  if (!box || state.form.direction !== "refund") return;
  const isReimb = state.offsetKind === "reimb";
  const cents = parseAmount(($("#amount") || {}).value) || 0;
  const sig = targetSig();
  if (sig !== state.targetSig) {          // 换了金额/人/备注 → 重新自动匹配
    state.targetSig = sig;
    if (!isReimb) {                       // 报销选的是哪几笔支出，与金额无关，不清空
      state.target = null;
      state.pinned = null;
    }
  }
  if (!cents && !isReimb) {
    renderTargets([]);
    const hint = $("#target-hint");
    if (hint) hint.textContent = "填上金额后自动匹配可冲抵的支出。";
    return;
  }
  const seq = ++targetSeq;
  box.innerHTML = `<span class="hint">匹配中…</span>`;
  try {
    const note = ($("#note") || {}).value || "";
    const r = await api(`/refund-targets?amount_cents=${cents}`
      + `&owner=${state.form.owner_id || ""}&note=${encodeURIComponent(note)}`
      + (state.offsetKind === "reimb" ? "&kind=reimb" : ""));
    if (seq !== targetSeq) return;        // 慢响应回来晚了，直接丢弃，别覆盖新结果
    const items = r.items || [];
    state.targetsRelaxed = !!r.relaxed;
    state.targetItems = items;            // 差补要按这批候选算，先落地
    if (isReimb) {
      if (state.reimbTouched) {
        const valid = new Set(items.map(i => i.id));
        state.reimbSel = state.reimbSel.filter(id => valid.has(id));
      } else {
        // 没动过：按「到账能否覆盖全部候选」决定要不要默认全选，覆盖不了就先不选
        autoSelectReimb();
      }
    } else if (state.target === null || state.target === undefined) {
      state.target = r.auto || "none";    // 预选最强候选；并列时服务端给 null → 落回不冲抵
    } else if (state.target !== "none"
      && !items.some(i => i.id === state.target)
      && !(state.pinned && state.pinned.id === state.target)) {
      state.target = r.auto || "none";
      state.pinned = null;
    }
    renderTargets(items);
    autoFillSubsidy();                    // 默认全选后立刻把差额填进差补
    updateSubsidyHint();
    updateTargetHint(items);
    renderSearch();
  } catch (e) {
    if (seq !== targetSeq) return;
    box.innerHTML = `<span class="hint">${e.message}</span>`;
  }
}

/* ---- 搜更早的账单（不限窗口，兜住 30 天外的原单）---- */
let searchItems = [];
function renderSearch() {
  const box = $("#tgt-results");
  if (!box) return;
  const q = (($("#tgt-q") || {}).value || "").trim();
  if (!q) { box.innerHTML = ""; return; }
  const cents = parseAmount(($("#amount") || {}).value) || 0;
  if (!searchItems.length) {
    box.innerHTML = `<span class="hint">没搜到还有可退余额的支出。</span>`;
    return;
  }
  box.innerHTML = searchItems.map(t => {
    const bad = cents && t.remain_cents < cents;
    const on = String(state.target) === String(t.id) ? "on" : "";
    const sub = [t.tx_date, t.category, t.note, t.owner_name].filter(Boolean).join(" · ");
    return `<button class="chip tgt ${on}" data-s="${t.id}" ${bad ? "data-bad=1" : ""}>
        <span class="tgt-main">${esc(sub)}</span>
        <span class="tgt-side">${bad
          ? `<i class="tgt-tag bad">退不了</i>`
          : `<i class="tgt-tag kw">选它</i>`}<b class="tgt-amt">剩 ${money(t.remain_cents)}</b></span>
      </button>`;
  }).join("");
  box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    if (b.dataset.bad) return toast("这笔剩的比退款金额还少");
    const hit = searchItems.find(i => String(i.id) === b.dataset.s);
    if (!hit) return;
    state.target = hit.id;
    state.pinned = hit;
    loadTargets();
  });
}

async function searchTargets() {
  const box = $("#tgt-results");
  if (!box || state.form.direction !== "refund") return;
  const q = (($("#tgt-q") || {}).value || "").trim();
  if (!q) { searchItems = []; box.innerHTML = ""; return; }
  const seq = ++searchSeq;
  box.innerHTML = `<span class="hint">搜索中…</span>`;
  try {
    // 纯数字当金额搜（±20%），其余当关键词（备注/分类）
    const num = /^\d+(\.\d{1,2})?$/.test(q) ? Math.round(parseFloat(q) * 100) : null;
    const url = num !== null
      ? `/tx?direction=expense&min_cents=${Math.round(num * 0.8)}&max_cents=${Math.round(num * 1.2)}`
      : `/tx?direction=expense&q=${encodeURIComponent(q)}`;
    const r = await api(url);
    if (seq !== searchSeq) return;
    searchItems = (r.items || [])
      .filter(t => t.remain_cents > 0 && t.direction === "expense")
      .slice(0, 12);
    renderSearch();
  } catch (e) {
    if (seq !== searchSeq) return;
    box.innerHTML = `<span class="hint">${e.message}</span>`;
  }
}

/* 图片在浏览器里先压：长边 1600 / JPEG 0.82。
   不压的话手机原图 base64 后好几 MB，既撞 Caddy 的 8MB，也白烧 token
   （模型按像素折算 token，1600 长边大约 1000~1600 token，够看清小票了）。 */
function shrinkImage(file, maxSide = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || "")) return reject(new Error("请选择图片文件"));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("这张图读不出来")); };
    img.src = url;
  });
}

async function aiParse() {
  const input = $("#ai-input");
  const text = ((input && input.value) || state.aiText || "").trim();
  const image = state.aiImage || "";
  if (!text && !image) return toast("写一句话，或者拍张小票");
  const btn = $("#ai-btn");
  if (btn) { btn.disabled = true; btn.textContent = image ? "识图中" : "识别中"; }
  try {
    const r = await api("/ai/parse", { method: "POST", body: { text, image } });
    const d = r.draft;
    state.form.direction = d.direction;
    state.form.cat_parent = d.cat_parent;
    state.form.category = d.category;
    state.form.shared = d.shared;
    state.form.reimb_pending = !!d.reimb_pending;
    state.form.pending_use = !!d.pending_use;
    state.form.travel = !!d.travel;
    state.target = null;
    state.amountText = (d.amount_cents / 100).toFixed(2);
    state.dateText = d.tx_date;
    // 备注只认模型给的：以前是 `d.note || text`，模型没写备注就把整句原话塞进来，
    // 于是「晚上吃饭160」的备注变成了「晚上吃饭160」——金额日期全都在别的字段里，纯冗余。
    state.noteText = d.note || "";
    state.aiText = text;
    state.aiHint = d.ocr_hint || "";     // 识图时展示「读到了什么」，方便核对
    renderAdd();
    // 「已报销」不能由表单决定（只认到账记录），但也不能默默丢掉——
    // 用户看到「识别为…」却不知道自己那句「已经报销了」被忽略了，会以为已经记上了
    const ignored = d.reimbursed
      ? "；「已报销」没填——它只能由一笔到账记录决定，记完这笔再去明细点「到账」" : "";
    toast(`识别为：${d.cat_parent} · ${d.category} ${money(d.amount_cents)}${ignored}`);
  } catch (e) { toast(e.message); }
  finally {
    // 成功时 renderAdd 已经换掉了按钮，这里改的是旧节点，无害
    if (btn) { btn.disabled = false; btn.textContent = "识别"; }
  }
}

async function saveTx() {
  // 防重第一道：请求在途时，后面的点击和回车直接吞掉。
  // 移动端双击、金额框 Enter 与按钮同时触发，都会走到这里。
  if (state.saving) return;
  const raw = ($("#amount").value || "").trim();
  // 空值 / 全是 0 和「格式不对」要分开提示，否则用户不知道是被哪条挡住的
  if (!raw || !/[1-9]/.test(raw)) return toast("请输入金额");
  const cents = parseAmount(raw);
  if (cents === null) return toast("单笔金额不能超过 100 万元");
  // 日期清空后不能静默兜底成「今天」：那等于替用户记到了错误的日子上
  const dateText = ($("#tx-date").value || "").trim();
  if (!dateText) return toast("选个日期");
  const f = state.form;
  const isReimb = f.direction === "refund" && state.offsetKind === "reimb";

  // 报销：一次到账摊多笔支出，其中可能有一部分是差补（公司白给的，记收入不冲抵）
  let links = [];
  let subsidy = 0;
  if (isReimb) {
    subsidy = parseAmount((($("#subsidy") || {}).value || "").trim()) || 0;
    if (subsidy >= cents) return toast("差补不能等于或超过到账金额——那就不是报销了");
    const items = state.targetItems || [];
    links = items.filter(t => state.reimbSel.includes(t.id))
                 .map(t => ({ parent_id: t.id, amount_cents: t.remain_cents }));
    const sum = links.reduce((a, x) => a + x.amount_cents, 0);
    if (sum + subsidy > cents) {
      return toast(`已选 ${money(sum)} + 差补 ${money(subsidy)} 超过到账 ${money(cents)}`);
    }
  }
  const linked = !isReimb && f.direction === "refund" && state.target && state.target !== "none";

  // 回执卡要说清「记的是什么」，所以趁表单还没清空先把这几项拍下来
  const snap = {
    tx_date: dateText,
    owner: ((ownerList().find(u => u.id === f.owner_id)) || {}).display_name || "",
    note: ($("#note").value || "").trim(),
    marks: [],
  };
  if (f.direction === "expense") {
    if (f.shared) snap.marks.push("共同支出");
    if (f.reimb_pending) snap.marks.push("待报销");
    if (f.pending_use) snap.marks.push("待用券");
    if (f.travel) snap.marks.push("旅行");
  }

  const payload = {
    tx_date: snap.tx_date,
    direction: f.direction, cat_parent: f.cat_parent, category: f.category,
    amount_cents: cents, shared: f.shared,
    reimb_pending: f.reimb_pending, pending_use: f.pending_use, travel: f.travel,
    parent_id: linked ? state.target : null,
    // 报销的分配走 links（多笔），差补单独一条 income 由服务端生成
    links: links,
    subsidy_cents: subsidy,
    subsidy_category: state.subsidyCat || "",
    owner_id: f.owner_id, note: snap.note,
    // 「退款/报销」是同一个方向，靠这个字段区分这条冲的是退货还是回款
    offset_kind: f.direction === "refund" ? (state.offsetKind || "refund") : "refund",
    // 幂等键：同一次提交发了两遍（双击、断网重发）也只落一条账
    client_token: state.formToken,
  };

  // 防重第二道：按钮进「保存中」并锁死，直到这次请求有确定结果
  state.saving = true;
  startBlocker();
  const btn = $("#save");
  if (btn) { btn.disabled = true; btn.textContent = "保存中…"; }
  try {
    // 断网/切网时结果未知，用同一个 token 自动重发一次：第一次若已落库，
    // 这次会被服务端当重复拦下，回执照样显示「账上只有一笔」——用户拿到的是确定答案。
    let r = null, lastErr = null;
    for (let attempt = 0; attempt < 2 && !r; attempt++) {
      try { r = await api("/tx", { method: "POST", body: payload }); }
      catch (e) {
        lastErr = e;
        if (!e.network) break;                      // 业务校验失败，重发没有意义
        if (attempt === 0) await new Promise(res => setTimeout(res, 700));
      }
    }
    if (!r) {
      stopBlocker();
      toast(lastErr && lastErr.network
        ? "网络中断，这笔可能已经记上——没记上再点一次也不会重复"
        : ((lastErr && lastErr.message) || "请求失败"));
      return;
    }

    // 这笔已经落库，换新键。不换的话下一笔会被服务端当成重复直接丢掉。
    state.formToken = newToken();

    const saved = {
      id: r.id, income_id: r.income_id || null, duplicate: !!r.duplicate,
      amount_cents: cents, direction: f.direction,
      kind: f.direction === "refund" ? (isReimb ? "reimb" : "refund") : "",
      cat_parent: isReimb ? "" : f.cat_parent,
      category: isReimb ? "" : f.category,
      tx_date: snap.tx_date, owner: snap.owner, note: snap.note, marks: snap.marks,
      link_count: links.length, subsidy: subsidy, cleared: !!r.cleared, linked: !!linked,
    };

    state.amountText = ""; state.noteText = ""; state.dateText = today();
    state.form.shared = false; state.form.reimb_pending = false; state.form.pending_use = false;
    state.form.travel = false;
    // 拍的小票和识别提示一起清掉：这一笔已经落库，图留着只会让下一笔误用
    state.aiText = ""; state.aiImage = ""; state.aiHint = "";
    state.target = null; state.pinned = null; state.targetSig = "";
    state.reimbSel = []; state.reimbTouched = false;
    state.subsidyText = ""; state.subsidyCat = ""; state.subsidyManual = false;
    // 这里不聚焦金额框：下一个动作由抽屉里的选择决定，别替用户决定要不要弹键盘
    renderAdd();
    // 先撤遮罩再推抽屉。反过来的话两层会叠着闪一下，像出了什么岔子
    stopBlocker();
    openReceipt(saved);
  } finally {
    state.saving = false;
    stopBlocker();
    const b = $("#save");
    if (b) { b.disabled = false; b.textContent = "记这笔"; }
  }
}

/* ---------------- 提交：在途遮罩 + 结果抽屉 ---------------- */
/* 遮罩是给「慢」用的，不是给「防重」用的——防重靠 state.saving 和 client_token 唯一索引，
   那两条已经挡住了双击。这里只负责一件事：让用户知道「在忙」，并且别在忙的时候乱点。
   350ms 内回来的请求不该看到遮罩，否则只是闪一下，比不闪更让人不安。 */
const BL_DELAY = 350, BL_SLOW = 2500, BL_ESCAPE = 6000;
let blT1 = 0, blT2 = 0, blT3 = 0;

function startBlocker() {
  stopBlocker();
  blT1 = setTimeout(() => {
    const b = $("#blocker"), t = $("#bl-text"), c = $("#bl-cancel");
    if (!b) return;
    if (t) t.textContent = "正在记…";
    if (c) c.hidden = true;
    b.classList.add("on");
    blT2 = setTimeout(() => { if (t) t.textContent = "网络有点慢，还在等…"; },
      BL_SLOW - BL_DELAY);
    // 拖到 6 秒基本只剩「连上了但不回数据」这一种情况，放人走总比锁死强
    blT3 = setTimeout(() => { if (c) c.hidden = false; }, BL_ESCAPE - BL_DELAY);
  }, BL_DELAY);
}

function stopBlocker() {
  clearTimeout(blT1); clearTimeout(blT2); clearTimeout(blT3);
  const b = $("#blocker");
  if (b) b.classList.remove("on");
}

/* 6 秒后点「先看看明细」：只解锁界面，请求本身不中断。
   真落库了，回执照样会弹出来——用户要的是答案，不是被锁着等答案。 */
function releaseBlocker() {
  stopBlocker();
  const t = $("#bl-text");
  if (t) t.textContent = "正在记…";
}

/* 结果抽屉。为什么是抽屉而不是页顶卡片：卡片在文档流里，可见性取决于提交那一刻
   手指停在哪（「记这笔」在最末尾，卡片插在最前面，等于看不见）。
   模态与环境无关，滚到哪儿都躲不掉，而且逼用户做一个决定——这本身就是确认。 */
function openReceipt(s) {
  state.lastSaved = s;
  const r = $("#rsp"), m = $("#rsp-mask");
  if (!r || !m) return;

  const sign = s.direction === "income" ? "+" : s.direction === "refund" ? "↩" : "−";
  const color = s.direction === "income" ? "var(--income)"
    : s.direction === "refund" ? "var(--refund)" : "var(--expense)";
  const title = s.duplicate ? "已记上，账上只有一笔"
    : s.direction === "expense" ? "已记上这笔支出"
    : s.direction === "income" ? "已记上这笔收入"
    : s.kind === "reimb" ? "已记下这笔报销到账" : "已记下这笔退款";
  const dirLabel = s.direction === "expense" ? "支出"
    : s.direction === "income" ? "收入"
    : (s.kind === "reimb" ? "报销到账" : "退款");

  const bits = [];
  if (s.cat_parent) bits.push(s.cat_parent + " / " + s.category);
  bits.push(s.tx_date);
  if (s.owner) bits.push(s.owner);

  const tags = [];
  if (s.kind === "reimb") tags.push(s.link_count ? "冲抵 " + s.link_count + " 笔" : "没有冲抵原单");
  if (s.subsidy) tags.push("差补 " + money(s.subsidy));
  if (s.linked) tags.push(s.cleared ? "原单标记已清除" : "已冲抵原单");
  (s.marks || []).forEach(x => tags.push(x));

  r.innerHTML =
    '<div class="rsp-hd">' +
      '<span class="rsp-ic">✓</span>' +
      '<span class="rsp-title">' + title + '</span>' +
      '<button class="rsp-x" id="rsp-x" aria-label="关闭">×</button>' +
    '</div>' +
    '<div class="rsp-amt" style="color:' + color + '">' + sign + money(s.amount_cents) + '</div>' +
    '<div class="rsp-meta">' + esc(dirLabel) + " · " + bits.map(esc).join(" · ") + '</div>' +
    (s.note ? '<div class="rsp-note">' + esc(s.note) + '</div>' : "") +
    (tags.length ? '<div class="rsp-tags">' + tags.map(x =>
      '<span class="rsp-tag">' + esc(x) + '</span>').join("") + '</div>' : "") +
    '<div class="rsp-act">' +
      // 重复提交被拦下时不给撤销：那一条是之前就存在的，撤它容易误伤
      (s.duplicate ? "" : '<button class="rsp-undo" id="rsp-undo">记错了</button>') +
      '<button class="rsp-more" id="rsp-more">再记一笔</button>' +
      '<button class="rsp-ok" id="rsp-ok">记完了</button>' +
    '</div>';

  $("#rsp-x").onclick = closeReceipt;
  $("#rsp-ok").onclick = receiptDone;
  $("#rsp-more").onclick = receiptContinue;
  const u = $("#rsp-undo");
  if (u) u.onclick = receiptUndo;

  m.classList.add("on");
  // 下一帧再加 on，否则 display 从 none 变 block 和 transform 落在同一帧，过渡会被跳过
  requestAnimationFrame(() => r.classList.add("on"));
}

function closeReceipt() {
  const r = $("#rsp"), m = $("#rsp-mask");
  if (!r || !m) return;
  r.classList.remove("on");
  m.classList.remove("on");
  // 等滑出动画走完再清内容，否则面板空着往下滑
  setTimeout(() => { if (!r.classList.contains("on")) r.innerHTML = ""; }, 240);
}

/* 记完了：回到页面顶部。表单已在提交成功时清空，那里就是「新的一笔」的起点 */
function receiptDone() {
  closeReceipt();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* 再记一笔：分类、归属、日期都留着，下一笔真正要填的只有金额，直接送过去 */
function receiptContinue() {
  closeReceipt();
  const a = $("#amount");
  if (!a) return;
  a.scrollIntoView({ block: "center" });
  a.focus();
}

async function receiptUndo() {
  const s = state.lastSaved;
  if (!s) return;
  const btn = $("#rsp-undo");
  if (btn) { btn.disabled = true; btn.textContent = "撤销中…"; }
  try {
    await api("/tx/" + s.id, { method: "DELETE" });
    // 报销到账会附带一条差补收入，撤销要一起撤，否则统计里留一笔孤零零的补贴
    if (s.income_id) await api("/tx/" + s.income_id, { method: "DELETE" }).catch(() => {});
    closeReceipt();
    // 表单刚被清空过，把金额和备注放回去：撤销的下一步九成是改一改重记。
    // 只回填这两项，分类/归属/日期本来就没动，不动它们就不会把用户后来的选择改掉。
    state.amountText = (s.amount_cents / 100).toFixed(2);
    state.noteText = s.note || "";
    // 只在记账页重画：抽屉虽然切页就会关，但这里不跟着判断的话，
    // 万一将来有别处调用，renderAdd 会把当前页整个盖掉
    if (state.tab === "add") {
      renderAdd();
      const a = $("#amount");
      if (a) { a.scrollIntoView({ block: "center" }); a.focus(); }
    }
    toast("已撤销，金额和备注放回表单了");
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "记错了"; }
    toast(e.message);
  }
}

/* ---------------- 明细 ---------------- */
const DIR_LABEL = { expense: "支出", income: "收入", refund: "退款 / 报销" };
const MARK_LABEL = { shared: "共同支出", pending: "待报销", reimb: "已报销", voucher: "待用券", travel: "旅行", refunded: "有退款" };
/* 标记胶囊按这个顺序摆；键名必须与 server.py 的 MARK_SQL 一一对应 */
const MARK_KEYS = ["shared", "voucher", "pending", "reimb", "travel", "refunded"];

/* mark / exclude 都是逗号分隔的标记键：mark 里的是「只要」（之间为「或」），
   exclude 里的是「不要」（之间也是「或」，整体取反）。
   反选就是同一个胶囊点第二下——不为排除单独摆一排，7 枚胶囊变 13 枚反而更难找。 */
function markList(v) { return (v || "").split(",").filter(Boolean); }
function markLabels(v, sep) { return markList(v).map(k => MARK_LABEL[k] || k).join(sep); }

/* ---- 日期快捷区间：值就是一对 [start, end]，点胶囊时现算 ----
   「近 N 月」＝**含本月在内的 N 个自然月**（起点是 N-1 个月前的 1 号）。
   以前写 monthsAgo(12)，从 11 月往前推 12 个月落在去年 11-01，实际覆盖 13 个月，
   标签说 12 却给了 13——月份边界必须和标签字面一致，否则用户没法用它对账。 */
const DATE_PRESETS = [
  ["30d", "近30天", () => [daysAgo(29), today()]],
  ["3m", "近3月", () => [monthsAgo(2), today()]],
  ["12m", "近12月", () => [monthsAgo(11), today()]],
  ["year", "今年", () => [new Date().getFullYear() + "-01-01", today()]],
];

/* 从 start/end 反推该高亮哪枚胶囊（字符串反推不出「自定义」，所以兜底 custom） */
function guessDateMode(f) {
  if (f.scope === "all") return "all";
  if (f.scope !== "range") return "month";
  for (const [k, , calc] of DATE_PRESETS) {
    const [s, e] = calc();
    if (s === f.start && e === f.end) return k;
  }
  return "custom";
}

/* 区间文案。两个用途、两套规则，别再合回一个：
   - 条件行要能核对：一律写完整日期，**跨年两端都带年份**。
   - 顶部胶囊要省地方：命中某个预设就直接说预设名（「近12月」），
     用户刚点的就是这个词，一眼能确认「我选的是这个」。
   以前两处都用 slice(5) 砍掉年份：近 12 个月显示成「11-01 ~ 11-03」，
   和「本月 1–3 号」长得一模一样，被当成筛选没生效（2026-11-03 用户反馈）。 */
function filterRangeText() {
  const f = state.filter;
  if (f.scope !== "range" || (!f.start && !f.end)) return "";
  if (!f.start || !f.end) return `${f.start || "最早"} ~ ${f.end || "今天"}`;
  // 同一年只写月日就够分辨；跨年必须带年，否则就是上面那个坑
  return f.start.slice(0, 4) === f.end.slice(0, 4)
    ? `${f.start.slice(5)} ~ ${f.end.slice(5)}`
    : `${f.start} ~ ${f.end}`;
}

/* 当前区间命中的预设名（「近12月」这种）；自定义返回空串 */
function rangePresetName() {
  const k = guessDateMode(state.filter);
  const p = DATE_PRESETS.find(x => x[0] === k);
  return p ? p[1] : "";
}

/* 顶部胶囊的文字：命中预设就用预设名，否则用区间 */
function rangeChipText() {
  const full = filterRangeText();
  if (!full) return "";
  const preset = rangePresetName();
  if (preset) return preset;
  // 自定义且跨年：不能只写月日（「11-01 ~ 11-03」那口坑），
  // 但四位年份的完整区间在 390px 上会被省略号吃掉结尾，改用两位年份换长度
  const f = state.filter;
  if (f.start && f.end && f.start.slice(0, 4) !== f.end.slice(0, 4))
    return `${f.start.slice(2)} ~ ${f.end.slice(2)}`;
  return full;
}

/* 结果列表上方那行「共找到 N 笔，条件：…」，把生效条件串成人话 */
function conditionText() {
  const f = state.filter, bits = [];
  const range = filterRangeText();
  // 命中预设时把预设名也写上：条件行是唯一能逐字核对「选了多久」的地方
  const preset = rangePresetName();
  if (range) bits.push("日期 " + (preset ? `${preset} · ${range}` : range));
  else if (f.scope === "all") bits.push("日期 不限");
  if (f.cat_parent) bits.push(f.cat_parent);
  if (f.direction) bits.push(DIR_LABEL[f.direction] || f.direction);
  if (f.mark) bits.push(markLabels(f.mark, " 或 "));
  if (markList(f.exclude).length) bits.push("排除 " + markLabels(f.exclude, "、"));
  if (f.owner) {
    const u = ownerList().find(x => String(x.id) === String(f.owner));
    if (u) bits.push(u.display_name);
  }
  if (f.q.trim()) bits.push("关键词「" + f.q.trim() + "」");
  if (f.min || f.max) bits.push(`金额 ${f.min || 0}–${f.max || "∞"} 元`);
  return bits.join(" · ");
}

/* 关键词拆词：空格分隔、多个词 AND，与服务端 split() 保持同一套规则 */
function activeWords() {
  const q = state.filter.q.trim();
  return q ? q.split(/\s+/).filter(Boolean) : [];
}

/* 纯数字词 → 分值，用于「金额整串高亮」；与服务端 word_to_cents 同一套规则 */
function wordToCentsJS(w) {
  const m = /^(\d{1,9})(?:\.(\d{1,2}))?$/.exec(w || "");
  if (!m) return null;
  return parseInt(m[1], 10) * 100 + parseInt((m[2] || "").padEnd(2, "0"), 10) || null;
}

/* 关键词高亮：先转义再插 <mark>，顺序绝不能反（反了就是把用户输入当 HTML 执行） */
function hl(text, words) {
  const safe = esc(text);
  if (!safe || !words || !words.length) return safe;
  const alts = words.slice()
    .sort((a, b) => b.length - a.length)     // 长词优先，「三亚湾」不会被「三亚」先吃掉
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .filter(Boolean);
  if (!alts.length) return safe;
  return safe.replace(new RegExp("(" + alts.join("|") + ")", "gi"), "<mark>$1</mark>");
}

function allParents() {  const out = [];
  Object.values(state.meta.categories).forEach(tree =>
    Object.keys(tree).forEach(p => { if (!out.includes(p)) out.push(p); }));
  return out;
}
/* 明细排序：键名与服务端 TX_ORDERS 白名单一一对应，多传的键会被忽略 */
const SORTS = [
  ["date_desc", "日期 新→旧"],
  ["date_asc", "日期 旧→新"],
  ["amount_desc", "净额 高→低"],
  ["amount_asc", "净额 低→高"],
];
const SORT_SHORT = { date_asc: "日期↑", amount_desc: "净额↓", amount_asc: "净额↑" };

function filterCount() {
  const f = state.filter;
  return ["direction", "mark", "exclude", "owner", "cat_parent"].filter(k => f[k]).length
    + (f.q.trim() ? 1 : 0) + ((f.min || f.max) ? 1 : 0)
    + (f.scope === "range" ? 1 : 0);
}
function filterQuery() {
  const f = state.filter, p = new URLSearchParams();
  // 时间维度只能有一个来源：区间 > 月份 > 不限
  if (f.scope === "range") {
    if (f.start) p.set("start", f.start);
    if (f.end) p.set("end", f.end);
  } else if (f.scope === "month" && state.month) {
    p.set("month", state.month);   // month 为空就是全部月份（统计页跨月指标跳进来时会这样）
  }
  if (f.direction) p.set("direction", f.direction);
  if (f.mark) p.set("mark", f.mark);
  if (f.exclude) p.set("exclude", f.exclude);
  if (f.owner) p.set("owner", f.owner);
  if (f.cat_parent) p.set("cat_parent", f.cat_parent);
  if (f.q.trim()) p.set("q", f.q.trim());
  // 金额区间同样走严格解析：以前「12abc」会被当成 12 去筛
  const mn = parseAmount(f.min), mx = parseAmount(f.max);
  if (mn) p.set("min_cents", mn);
  if (mx) p.set("max_cents", mx);
  if (state.sort !== "date_desc") p.set("sort", state.sort);
  return p.toString();
}

async function renderList() {
  // 时间维度只能有一个入口：设了日期区间就把月份框让出来，
  // 否则「顶部写着 10 月、列表却是跨年结果」会让人完全分不清在看什么
  const range = filterRangeText();
  const chipText = rangeChipText();
  // 月份为空（跨月累计跳进来）时也不摆空月份框——原生控件会显示成「----年-月」，像坏了
  $("#view").innerHTML = `
    <div class="month-pick">
      ${range
        ? `<button class="btn small ghost month-all" id="range-chip" title="${esc(range)}（点一下清掉日期区间）"><span class="rc-t">${esc(chipText)}</span><span class="rc-x">✕</span></button>`
        : state.month
          ? `<input type="month" id="month" value="${esc(state.month)}">`
          : `<button class="btn small ghost month-all" id="month-all">全部月份 · 按月查看</button>`}
      <button class="btn small ghost" id="filter-btn">筛选</button>
      <button class="btn small ghost" id="sort-btn">排序</button>
      <button class="btn small ghost" id="export-btn" title="按当前筛选导出为 CSV，Excel 可直接打开">导出</button>
    </div>
    <div id="filter-bar"></div>
    <div id="loan-bar"></div>
    <div id="list-sum"></div>
    <div id="list-body"><div class="empty">加载中…</div></div>`;
  const mi = $("#month");
  if (mi) mi.onchange = e => { state.month = e.target.value; loadList(); };
  const ma = $("#month-all");
  if (ma) ma.onclick = () => { state.month = nowMonth(); renderList(); };
  const rc = $("#range-chip");
  if (rc) rc.onclick = () => {
    state.filter = { ...state.filter, scope: "month", start: "", end: "" };
    renderList();
  };
  $("#filter-btn").onclick = () => openFilter();
  $("#sort-btn").onclick = () => openSort();
  // 导出走和列表同一个 filterQuery()：用户在页面上看到什么，文件里就是什么。
  // 用 location.href 而不是 fetch——要让浏览器按附件下载（服务端给了 Content-Disposition），
  // fetch 拿到的是字符串，还得在内存里再拼一次 Blob，多此一举。
  $("#export-btn").onclick = () => { location.href = "/api/export.csv?" + filterQuery(); };
  renderFilterBar();
  renderSortBtn();
  loadLoans();
  loadList();
}

/* ---------------- 借款台账 ----------------
   独立于流水，不进任何统计，只是「别忘了谁还欠我钱」。
   入口放在明细页顶部：翻明细就会看见，不占底栏。 */
let loansCache = [], loansOpen = false;
async function loadLoans() {
  const box = $("#loan-bar");
  if (!box) return;
  try {
    const r = await api("/loans");
    loansCache = r.items || [];
    const s = r.summary || { out_open: 0, in_open: 0, open_count: 0 };
    const bits = [];
    if (s.out_open) bits.push(`借出 ${money(s.out_open)}`);
    if (s.in_open) bits.push(`借入 ${money(s.in_open)}`);
    const hasOpen = s.open_count > 0;
    box.innerHTML = `
      <button class="loan-bar ${hasOpen ? "" : "empty"}" id="loan-toggle">
        <span class="lb-left">
          <span class="lb-title">借款${hasOpen ? "" : "台账"}</span>
          <span class="lb-sub">${hasOpen ? bits.join(" · ") + " 未结" : "暂无未结清"}</span>
        </span>
        <span class="lb-right">${hasOpen ? s.open_count + " 笔 " : ""}${loansOpen ? "收起" : "展开"}</span>
      </button>
      <div class="loan-panel" id="loan-panel" ${loansOpen ? "" : "hidden"}></div>`;
    $("#loan-toggle").onclick = () => {
      loansOpen = !loansOpen;
      const p = $("#loan-panel");
      if (p) p.hidden = !loansOpen;
      const right = $("#loan-toggle .lb-right");
      if (right) right.textContent = (hasOpen ? s.open_count + " 笔 " : "") + (loansOpen ? "收起" : "展开");
      if (loansOpen) renderLoans();
    };
    renderLoans();
  } catch (e) {
    box.innerHTML = `<div class="hint">${e.message}</div>`;
  }
}

function renderLoans() {
  const panel = $("#loan-panel");
  if (!panel) return;
  const list = loansCache;
  panel.innerHTML = (list.length ? list.map(l => {
    const dir = l.direction === "out" ? "借出" : "借入";
    const settled = l.settled;
    return `<div class="loan-row ${settled ? "settled" : ""}">
        <span class="l-main">
          <span class="l-t">${esc(l.counterparty)} · ${dir}${settled ? " · 已结清" : ""}</span>
          <span class="l-s">${l.loan_date.slice(5)}${l.note ? " · " + esc(l.note) : ""}</span>
        </span>
        <span class="l-right">
          <span class="l-amt">${money(l.remain_cents)}</span>
          <button class="loan-act" data-loan="${l.id}">${settled ? "查看" : "记还款"}</button>
        </span>
      </div>`;
  }).join("") : `<div class="hint">还没有借款记录。</div>`)
    + `<div style="margin-top:10px"><button class="btn small ghost" id="loan-add">＋ 记一笔借款</button></div>`;
  panel.querySelectorAll("[data-loan]").forEach(b => b.onclick = () => {
    openLoanSheet(loansCache.find(l => String(l.id) === b.dataset.loan));
  });
  const add = $("#loan-add");
  if (add) add.onclick = () => openLoanSheet(null);
}

function openLoanSheet(loan) {
  const l = loan || { direction: "out", counterparty: "", amount_cents: 0,
    repaid_cents: 0, loan_date: today(), note: "", owner_id: state.me.id };
  const users = ownerList();
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  $("#sheet").innerHTML = `
    <h3>${loan ? "借款详情" : "记一笔借款"}</h3>
    <div class="hint" style="margin-bottom:14px">借款不计入收支统计，只用来提醒别忘。</div>
    <div class="f-group">
      <div class="f-label">方向</div>
      <div class="chips" id="l-dir">
        <button class="chip ${l.direction === "out" ? "on" : ""}" data-d="out">借出（别人欠我）</button>
        <button class="chip ${l.direction === "in" ? "on" : ""}" data-d="in">借入（我欠别人）</button>
      </div>
    </div>
    <div class="f-group"><div class="f-label">对方</div>
      <input id="l-who" maxlength="20" placeholder="如 朋友" value="${esc(l.counterparty)}"></div>
    <div class="f-group"><div class="f-label">金额（元）</div>
      <input id="l-amt" inputmode="decimal" placeholder="0.00" value="${esc(l.amount_cents ? (l.amount_cents / 100).toFixed(2) : "")}"></div>
    ${loan ? `<div class="f-group"><div class="f-label">已还（元）</div>
      <input id="l-repaid" inputmode="decimal" value="${esc((l.repaid_cents / 100).toFixed(2))}">
      <button class="btn ghost small" id="l-settle" style="margin-top:8px">全部还清了</button></div>` : ""}
    <div class="f-group"><div class="f-label">日期</div>
      <input type="date" id="l-date" value="${esc(l.loan_date)}"></div>
    <div class="f-group"><div class="f-label">谁借的</div>
      <div class="chips" id="l-owner">
        ${users.map(u => `<button class="chip pchip ${u.id === l.owner_id ? "on" : ""}" data-o="${u.id}" style="${chipVars(ownerColor(u.id))}">${esc(u.display_name)}</button>`).join("")}
      </div></div>
    <div class="f-group"><div class="f-label">备注</div>
      <input id="l-note" maxlength="100" placeholder="可选" value="${esc(l.note)}"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn ghost" id="l-cancel">取消</button>
      <button class="btn" id="l-save">保存</button>
    </div>
    ${loan ? `<div style="height:10px"></div><button class="btn danger" id="l-del">删除这笔借款</button>` : ""}`;

  let direction = l.direction, ownerId = l.owner_id;
  $("#l-dir").querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    direction = b.dataset.d;
    $("#l-dir").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
  $("#l-owner").querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    ownerId = +b.dataset.o;
    $("#l-owner").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
  bindAmountInput($("#l-amt"));
  bindAmountInput($("#l-repaid"));
  const settle = $("#l-settle");
  if (settle) settle.onclick = () => { $("#l-repaid").value = $("#l-amt").value || "0"; };
  $("#l-cancel").onclick = closeSheet;
  $("#l-save").onclick = () => withBusy($("#l-save"), async () => {
    const cents = parseAmount($("#l-amt").value);
    if (!cents) return toast("请输入借款金额");
    if (!$("#l-who").value.trim()) return toast("请填对方");
    const body = {
      direction, counterparty: $("#l-who").value.trim(), amount_cents: cents,
      loan_date: $("#l-date").value || today(), note: $("#l-note").value,
      owner_id: ownerId,
    };
    if (loan) body.repaid_cents = parseAmount($("#l-repaid").value) || 0;
    try {
      await api(loan ? `/loans/${loan.id}` : "/loans",
        { method: loan ? "PATCH" : "POST", body });
      closeSheet(); toast(loan ? "已保存" : "已记下"); loadLoans();
    } catch (e) { toast(e.message); }
  });
  const del = $("#l-del");
  if (del) del.onclick = async () => {
    if (!confirm("删除这笔借款？")) return;
    try { await api(`/loans/${loan.id}`, { method: "DELETE" }); closeSheet(); toast("已删除"); loadLoans(); }
    catch (e) { toast(e.message); }
  };
}

function renderFilterBar() {
  const f = state.filter, parts = [];
  if (f.direction) parts.push(["direction", DIR_LABEL[f.direction] || f.direction]);
  if (f.mark) parts.push(["mark", markLabels(f.mark, " 或 ")]);
  if (markList(f.exclude).length) parts.push(["exclude", "排除 " + markLabels(f.exclude, "、")]);
  if (f.owner) {
    const u = ownerList().find(x => String(x.id) === String(f.owner));
    parts.push(["owner", "归属：" + (u ? u.display_name : f.owner)]);
  }
  if (f.cat_parent) parts.push(["cat_parent", f.cat_parent]);
  if (f.q.trim()) parts.push(["q", "关键词：" + f.q.trim()]);
  if (f.min || f.max) parts.push(["amount", `金额 ${f.min || 0}–${f.max || "∞"} 元`]);

  const n = filterCount();
  const btn = $("#filter-btn");
  if (btn) btn.textContent = n ? `筛选 · ${n}` : "筛选";

  const bar = $("#filter-bar");
  if (!bar) return;
  if (!parts.length) { bar.innerHTML = ""; return; }
  bar.innerHTML = `<div class="chips" style="margin-bottom:12px">
      ${parts.map(([k, label]) => `<button class="chip ${k === "exclude" ? "ex" : "on"}" data-clear="${esc(k)}">${esc(label)} ✕</button>`).join("")}
      <button class="chip" data-clear="all">清除全部</button>
    </div>`;
  bar.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
    const k = b.dataset.clear;
    if (k === "all") {
      // 与筛选面板里的「重置」一致：条件、时间、排序全回默认
      state.filter = { ...EMPTY_FILTER };
      state.sort = "date_desc";
      if (!state.month) state.month = nowMonth();
      renderList();      // 顶部区间胶囊要换回月份框
      return;
    }
    if (k === "amount") { state.filter.min = ""; state.filter.max = ""; }
    else state.filter[k] = "";
    renderFilterBar(); loadList();
  });
}

/* 排序按钮只在偏离默认时显示当前顺序；文案必须短——
   写成「排序 · 金额↓」会把月份框挤扁，甚至撑出屏幕 */
function renderSortBtn() {
  const btn = $("#sort-btn");
  if (!btn) return;
  btn.textContent = state.sort === "date_desc" ? "排序" : SORT_SHORT[state.sort];
}

function openSort() {
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  $("#sheet").innerHTML = `
    <h3>排序</h3>
    <div class="f-group">
      <div class="f-label">明细按什么排</div>
      <div class="chips">
        ${SORTS.map(([v, n]) => `<button class="chip ${state.sort === v ? "on" : ""}" data-s="${v}">${n}</button>`).join("")}
      </div>
    </div>
    <div class="hint">排序和筛选同时生效：先按筛选条件挑出记录，再按这里排。
      「净额」就是每行的大数字——支出已扣掉分给它的冲抵，退款和收入按负值参与排序
      （所以在「低→高」里排最前面）。选「日期」时仍按天分组；按净额排会打散分组，每条自己带日期。</div>
    <div class="row" style="margin-top:18px">
      <button class="btn ghost" id="s-reset">恢复默认</button>
      <button class="btn" id="s-close">完成</button>
    </div>`;
  // 点一下立刻生效、面板不关：方便来回切着看哪个顺序更好用
  $("#sheet").querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    state.sort = b.dataset.s;
    $("#sheet").querySelectorAll("[data-s]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    renderSortBtn();
    loadList();
  });
  $("#s-reset").onclick = () => {
    state.sort = "date_desc";
    $("#sheet").querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x.dataset.s === "date_desc"));
    renderSortBtn();
    loadList();
  };
  $("#s-close").onclick = closeSheet;
}

const EMPTY_FILTER = { direction: "", mark: "", exclude: "", owner: "", cat_parent: "", q: "", min: "", max: "",
  scope: "month", start: "", end: "" };

function openFilter(draft) {
  const f = { ...(draft || state.filter) };
  const users = ownerList();

  const group = (label, key, opts) => `
    <div class="f-group">
      <div class="f-label">${label}</div>
      <div class="chips">
        ${opts.map(([v, n]) => `<button class="chip ${f[key] === v ? "on" : ""}" data-f="${esc(key)}" data-v="${esc(v)}">${esc(n)}</button>`).join("")}
      </div>
    </div>`;

  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  const dmode0 = guessDateMode(f);
  $("#sheet").innerHTML = `
    <h3>筛选</h3>
    <div class="f-group">
      <div class="f-label">关键词</div>
      <input id="f-q" placeholder="金额 / 备注 / 归属，空格分隔多个词"
             value="${esc(f.q || "")}">
      <div class="hint" style="margin-top:6px">搜「三亚 机票」＝两个词都要命中；输入数字会同时按<b>原额和净额</b>找。</div>
    </div>
    <div class="f-group">
      <div class="f-label">日期区间</div>
      <div class="chips" id="f-date">
        <button class="chip ${dmode0 === "month" ? "on" : ""}" data-dm="month">跟随月份</button>
        ${DATE_PRESETS.map(([k, n]) => `<button class="chip ${dmode0 === k ? "on" : ""}" data-dm="${k}">${n}</button>`).join("")}
        <button class="chip ${dmode0 === "all" ? "on" : ""}" data-dm="all">全部</button>
        <button class="chip ${dmode0 === "custom" ? "on" : ""}" data-dm="custom">自定义</button>
      </div>
      <div class="row" id="f-dates" style="margin-top:9px" ${dmode0 === "custom" ? "" : "hidden"}>
        <input type="date" id="f-start" value="${esc(f.start || "")}">
        <span class="hint">—</span>
        <input type="date" id="f-end" value="${esc(f.end || "")}">
      </div>
    </div>
    ${group("方向", "direction", [["", "全部"], ["expense", "支出"], ["income", "收入"], ["refund", "退款 / 报销"]])}
    <div class="f-group">
      <div class="f-label">标记</div>
      <div class="chips" id="f-marks">
        <button class="chip" data-mk="">全部</button>
        ${MARK_KEYS.map(k => `<button class="chip" data-mk="${k}">${MARK_LABEL[k]}</button>`).join("")}
      </div>
      <div class="hint" style="margin-top:6px">
        点一下＝只看这种，再点一下＝<b style="color:var(--danger)">排除</b>这种，第三下取消。
        勾多种是「任一命中」；排除可以和「只要」同时用。
      </div>
    </div>
    <div class="f-group">
      <div class="f-label">归属</div>
      <div class="chips">
        <button class="chip ${f.owner === "" ? "on" : ""}" data-f="owner" data-v="">全部</button>
        ${users.map(u => { const col = ownerColor(u.id); return `<button class="chip pchip ${String(f.owner) === String(u.id) ? "on" : ""}" data-f="owner" data-v="${esc(u.id)}" style="${chipVars(col)}">${esc(u.display_name)}</button>`; }).join("")}
      </div>
    </div>
    <div class="f-group">
      <div class="f-label">大类</div>
      <div class="chips">
        <button class="chip ${f.cat_parent === "" ? "on" : ""}" data-f="cat_parent" data-v="">全部</button>
        ${allParents().map(p => `<button class="chip cchip ${f.cat_parent === p ? "on" : ""}" data-f="cat_parent" data-v="${esc(p)}" style="${chipVars(catColorAny(p))}">${esc(p)}</button>`).join("")}
      </div>
    </div>
    <div class="f-group">
      <div class="f-label">金额区间（原额，元）</div>
      <div class="row">
        <input id="f-min" inputmode="decimal" placeholder="最小" value="${esc(f.min || "")}">
        <span class="hint">—</span>
        <input id="f-max" inputmode="decimal" placeholder="最大" value="${esc(f.max || "")}">
      </div>
      <div class="hint" style="margin-top:6px">按<b>账单原本的金额</b>筛，不按冲抵后的净额——
      想找「那笔花了 1000 多的」时，你记的是付款额。</div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn ghost" id="f-reset">重置</button>
      <button class="btn" id="f-apply">查看结果</button>
    </div>
    <div style="height:8px"></div>
    <button class="btn ghost" id="f-close">关闭</button>`;

  // 点选只改草稿，不影响列表
  $("#sheet").querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    f[b.dataset.f] = b.dataset.v;
    b.parentElement.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });

  /* ---- 标记胶囊：三态切换（要 → 不要 → 取消）。
     一次点击会牵动三枚胶囊（点「已报销」可能同时把它从 mark 里挪到 exclude），
     所以整组重画，不做局部 classList 翻转。 ---- */
  const paintMarks = () => {
    const on = markList(f.mark), ex = markList(f.exclude);
    $("#f-marks").querySelectorAll("[data-mk]").forEach(b => {
      const k = b.dataset.mk;
      b.classList.toggle("on", !!k && on.includes(k));
      b.classList.toggle("ex", !!k && ex.includes(k));
      if (!k) b.classList.toggle("on", !on.length && !ex.length);
    });
  };
  $("#f-marks").querySelectorAll("[data-mk]").forEach(b => b.onclick = () => {
    const k = b.dataset.mk;
    if (!k) { f.mark = ""; f.exclude = ""; }
    else {
      const on = markList(f.mark), ex = markList(f.exclude);
      // 先都摘掉，再按「原来是什么状态」落到下一个状态——顺序不能反，
      // 否则「已勾 → 排除」会被自己刚加的那条挡住
      f.mark = on.filter(x => x !== k).join(",");
      f.exclude = ex.filter(x => x !== k).join(",");
      if (!on.includes(k) && !ex.includes(k)) f.mark += (f.mark ? "," : "") + k;
      else if (on.includes(k)) f.exclude += (f.exclude ? "," : "") + k;
    }
    paintMarks();
  });
  paintMarks();
  // 金额区间也是金额输入框，同样只收数字和小数点
  bindAmountInput($("#f-min"));
  bindAmountInput($("#f-max"));

  /* ---- 日期区间：常用范围点胶囊，自定义才展开两个日期框 ---- */
  let dmode = dmode0;
  const setMode = mode => {
    dmode = mode;
    if (mode === "month") { f.scope = "month"; f.start = ""; f.end = ""; }
    else if (mode === "all") { f.scope = "all"; f.start = ""; f.end = ""; }
    else if (mode === "custom") {
      f.scope = "range";
      if ($("#f-start")) $("#f-start").value = f.start || "";
      if ($("#f-end")) $("#f-end").value = f.end || "";
    } else {
      const p = DATE_PRESETS.find(x => x[0] === mode);
      if (!p) return;
      const [s, e] = p[2]();
      f.scope = "range"; f.start = s; f.end = e;
    }
    $("#f-date").querySelectorAll("[data-dm]").forEach(x =>
      x.classList.toggle("on", x.dataset.dm === dmode));
    const box = $("#f-dates");
    if (box) box.hidden = dmode !== "custom";
  };
  $("#f-date").querySelectorAll("[data-dm]").forEach(b => b.onclick = () => setMode(b.dataset.dm));
  const dStart = $("#f-start"), dEnd = $("#f-end");
  if (dStart) dStart.onchange = () => { f.start = dStart.value; f.scope = "range"; };
  if (dEnd) dEnd.onchange = () => { f.end = dEnd.value; f.scope = "range"; };

  /* 一输入关键词就把范围放到近 12 个月（仅限「跟随月份」时），省得每次手动点。
     用户自己选过区间就不动——不能把他设好的范围冲掉。胶囊会同步高亮，看得见。 */
  const qEl = $("#f-q");
  qEl.addEventListener("input", () => {
    if (qEl.value.trim() && dmode === "month") setMode("12m");
  });

  $("#f-reset").onclick = () => {
    state.sort = "date_desc";          // 重置连排序一起回默认
    renderSortBtn();
    openFilter(EMPTY_FILTER);
  };
  $("#f-apply").onclick = () => {
    f.q = qEl.value;
    f.min = $("#f-min").value.trim();
    f.max = $("#f-max").value.trim();
    if (f.scope === "range") {
      if (dmode === "custom") {
        f.start = dStart ? dStart.value : "";
        f.end = dEnd ? dEnd.value : "";
      }
      if (f.start && f.end && f.start > f.end) [f.start, f.end] = [f.end, f.start];  // 起止填反自动纠正
      if (!f.start && !f.end) f.scope = "all";      // 自定义但两端都空 = 不限时间
    }
    state.filter = { ...f };
    closeSheet();
    renderList();      // 顶部月份框 / 区间胶囊要跟着换，不能只刷列表
  };
  $("#f-close").onclick = closeSheet;
}

/* 标题 = 「一级 / 二级」的分类路径。一级浅灰小字、二级加粗，只让二级重，整屏才不会一坨加黑。
   一级自己就是兜底大类（其他支出 / 其他收入）且二级也叫「其他」时，只写一级——
   「其他支出」比「其他支出 / 其他」有信息量，也还能分清是钱进来还是出去。
   报销冲抵行的分类是从原单继承的（支出树），照原样写会让人以为今天花了这笔钱，固定写「报销到账」。 */
function txTitleHTML(t, w) {
  if (t.direction === "refund" && t.offset_kind === "reimb") {
    return `<i>退款 / </i><b>${hl("报销到账", w)}</b>`;
  }
  const parent = t.cat_parent || "", leaf = t.category || "";
  if (!parent || parent === leaf) return `<b>${hl(parent || leaf, w)}</b>`;
  if (leaf === "其他" && parent.startsWith("其他")) return `<b>${hl(parent, w)}</b>`;
  return `<i>${hl(parent, w)} / </i><b>${hl(leaf, w)}</b>`;
}

/* 单条记录：按天分组和排序平铺两种视图共用。
   withDate 为真时第二行带上日期——平铺时没有日期分组头，日期得自己带。
   showOwner 为假时（整页只有一个人的账）金额下面不重复写归属人，省一列。
   大数字是**净额**（原额 − 已退 − 已报），原额退成下面的小字；口径与统计页、
   金额排序、导出 CSV 的「净额」列同一套，改一处就得四处一起改（见 docs §2.2）。 */
function txRowHTML(t, withDate, showOwner) {
  const refunded = t.refunded_cents || 0;
  const reimb = t.reimb_cents || 0;
  const offset = refunded + reimb;
  /* 大数字是**净额**：支出扣掉分给它的冲抵；退款/收入没有冲抵，净额就是它自己的金额。
     与统计页、金额排序、导出 CSV 的「净额(元)」是同一个数——四处口径必须一起改。 */
  const net = t.direction === "expense"
    ? (t.remain_cents == null ? Math.max(0, t.amount_cents - offset) : t.remain_cents)
    : t.amount_cents;
  const full = t.direction === "expense" && offset > 0 && net === 0;
  const remain = net;                    // 「退」按钮：还能退多少
  const badges = [
    t.pending_use ? '<span class="badge voucher">待用券</span>' : '',
    t.travel ? '<span class="badge travel">旅行</span>' : '',
    t.shared ? '<span class="badge shared">共同</span>' : '',
    t.reimb_pending ? '<span class="badge pending">待报销</span>' : '',
    // 报销金额必须带出来：只写「已报销」的话，大数字和原额差多少、为什么差，全看不出来
    t.reimbursed ? `<span class="badge reimb">${reimb > 0 ? "已报 " + money(reimb) : "已报销"}</span>` : '',
    refunded > 0 ? `<span class="badge refunded">${refunded >= t.amount_cents ? "已退" : "退 " + money(refunded)}</span>` : '',
  ].join("");
  const head = withDate ? t.tx_date.slice(5) + " · " : "";
  const w = activeWords();
  /* 第二行只放备注；退款/报销行放「冲抵 哪天 哪一类」，原单分类写成完整路径才看得懂冲的是哪笔。
     没有备注也没有徽标就整行不输出，高度靠 .body 的 min-height 撑齐，行不会一高一矮。 */
  let sub;
  if (t.direction === "refund") {
    const kind = t.offset_kind === "reimb" ? "报销冲抵 " : "冲抵 ";
    let link;
    if (!t.parent_id) link = t.offset_kind === "reimb" ? "无主报销" : "无主退款";
    // 摊在多笔上时只点名主原单会误导——标题那一格分类取的也只是「分配额最大的那笔」，
    // 所以副标题直接说笔数，具体是哪几笔点进去看
    else if ((t.link_count || 0) > 1) link = kind + t.link_count + " 笔支出";
    else link = kind
      + hl((t.parent_date || "").slice(5), w) + " "
      + hl([t.parent_cat_parent, t.parent_category].filter(Boolean).join(" / "), w);
    sub = [link, t.note ? hl(t.note, w) : ""].filter(Boolean).join(" · ");
  } else {
    sub = t.note ? hl(t.note, w) : "";
  }
  /* 金额高亮只在「整串相等」时点亮，搜 25 不该把 ¥125.00 里的 25 也点亮。
     净额和原额任一命中都算——屏幕上出现过哪个数字，就得能搜到哪个。 */
  const shown = money(net).slice(1);
  const hitAmt = w.some(x => {
    const c = wordToCentsJS(x);
    return c && (c === net || c === t.amount_cents);
  });
  const amtHTML = hitAmt ? `<mark>${shown}</mark>` : shown;
  const acts = [];
  if (t.pending_use) acts.push(`<button class="quick" data-voucher="${t.id}">处理</button>`);
  else if (t.direction === "expense" && remain > 0) acts.push(`<button class="quick muted" data-refund="${t.id}">退</button>`);
  if (t.reimb_pending) acts.push(`<button class="quick" data-done="${t.id}">到账</button>`);
  const dirCls = t.direction === "income" ? "dir-income"
    : t.direction === "refund" ? "dir-refund" : "dir-expense";
  const amtColor = full ? "var(--faint)"          // 全额冲抵完，0 不该再抢眼
    : t.direction === "income" ? "var(--income)"
    : t.direction === "refund" ? "var(--refund)" : "var(--expense)";
  // 净额是 0 就不写负号：−0.00 看着像算错了，可全额冲抵本身是个正常状态
  const sign = t.direction === "income" ? "+"
    : t.direction === "refund" ? "↩"
    : (net === 0 ? "" : "−");
  return `
      <div class="tx ${dirCls}" data-id="${t.id}">
        <div class="body">
          <div class="t1">${txTitleHTML(t, w)}</div>
          ${(head || badges || sub) ? `<div class="t2">${head ? `<span class="date">${head}</span>` : ""}${badges}${sub ? `<span class="txt">${sub}</span>` : ""}</div>` : ""}
        </div>
        ${acts.join("")}
        <div class="amt-col">
          <div class="amt" style="color:${amtColor}">${sign}${amtHTML}</div>
          ${offset > 0 ? `<div class="amt-sub">原 ${money(t.amount_cents)}</div>` : ""}
          ${showOwner ? `<div class="own">${hl(t.owner_name || "", w)}</div>` : ""}
        </div>
      </div>`;
}

async function loadList() {
  try {
    const r = await api("/tx?" + filterQuery());
    const box = $("#list-body");
    const s = r.summary || { count: 0, expense: 0, income: 0, refund: 0 };
    const cond = conditionText();
    $("#list-sum").innerHTML = s.count ? `
      <div class="sum-line">
        <span>${cond ? "共找到 " : ""}${s.count} 笔</span>
        ${(s.refund || s.reimb)
          ? `<i class="net" title="支出扣掉冲抵后的真金白银；与统计页的「支出」同一个口径">净流出 ${money(s.expense - s.refund - s.reimb)}</i>
             <i>原额支出 ${money(s.expense)}</i>`
          : `<i>支出 ${money(s.expense)}</i>`}
        ${s.income ? `<i>收入 ${money(s.income)}</i>` : ""}
        ${s.refund ? `<i>退款 ${money(s.refund)}</i>` : ""}
        ${s.reimb ? `<i>报销 ${money(s.reimb)}</i>` : ""}
      </div>${cond ? `<div class="cond-line">条件：${esc(cond)}</div>` : ""}
      ${(s.refund || s.reimb) ? `<div class="cond-line">
        净流出 = 原额支出 − 退款 − 报销，<b>按记录日期归月</b>；统计页按原支出月归月，所以跨月冲抵时两页每月会差一笔（不是算错）。
        每行的大数字已是冲抵后的净额，退款/报销另占一行——<b>别把两行相加</b>，钱已经从前面的原单里扣过了。
      </div>` : ""}` : "";
    if (!r.items.length) {
      box.innerHTML = `<div class="empty">${filterCount() ? "没有符合条件的记录"
        : (state.month ? "这个月还没有记录" : "还没有记录")}</div>`;
      return;
    }
    // 整页只有一个人的账（多半是按归属筛过）就不重复写归属人，金额下面省一行
    const showOwner = new Set(r.items.map(t => t.owner_id)).size > 1;
    if (state.sort.startsWith("date")) {
      const groups = {};
      r.items.forEach(t => (groups[t.tx_date] = groups[t.tx_date] || []).push(t));
      // 组的先后也跟着排序走：日期正序时最早的一天在最上面
      const days = Object.keys(groups).sort();
      if (state.sort === "date_desc") days.reverse();
      box.innerHTML = days.map(day => {
        const items = groups[day];
        const exp = items.filter(t => t.direction === "expense").reduce((s, t) => s + t.amount_cents, 0);
        // 小计也走净额，否则一天里「行加起来」和「头上的数」对不上
        const netExp = items.filter(t => t.direction === "expense")
          .reduce((s, t) => s + (t.remain_cents == null ? t.amount_cents : t.remain_cents), 0);
        const label = netExp === exp ? "支出 " : "净支出 ";
        return `<div class="day">
          <div class="day-hd"><span>${day.slice(5)} · ${"日一二三四五六"[new Date(day).getDay()]}</span>
            <span>${netExp ? label + money(netExp) : ""}</span></div>
          ${items.map(t => txRowHTML(t, false, showOwner)).join("")}
        </div>`;
      }).join("");
    } else {
      // 金额排序与日期无关，按天分组会把顺序打断，这里平铺并让每条自带日期
      box.innerHTML = r.items.map(t => txRowHTML(t, true, showOwner)).join("");
    }
    box.querySelectorAll(".tx").forEach(el => el.onclick = () => openEdit(+el.dataset.id, r.items));
    box.querySelectorAll("[data-voucher]").forEach(btn => btn.onclick = e => {
      e.stopPropagation();
      openVoucher(r.items.find(x => x.id === +btn.dataset.voucher));
    });
    box.querySelectorAll("[data-refund]").forEach(btn => btn.onclick = e => {
      e.stopPropagation();
      openRefund(r.items.find(x => x.id === +btn.dataset.refund));
    });
    // 待报销一键到账：生成一条报销冲抵记录（不是改标记——钱真回来了，账面得跟着动）。
    // 默认按剩余可冲抵全额；公司只报一部分时去编辑那条冲抵记录改金额。
    box.querySelectorAll("[data-done]").forEach(btn => {
      // 幂等键按「这个按钮」生成：连点、断网重发都复用它，只落一条；
      // 列表刷新后按钮重画，token 自然换新，下次到账是另一件事
      btn.dataset.token = newToken();
      btn.onclick = async e => {
        e.stopPropagation();
        btn.disabled = true; btn.textContent = "…";
        try {
          const r = await api(`/tx/${btn.dataset.done}/reimburse`, {
            method: "POST", body: { client_token: btn.dataset.token } });
          toast(r.duplicate ? "这笔刚才已经到账过了，没有重复记"
                            : `已报销 ${money(r.amount_cents)}，支出同步冲减`);
          loadList();
        } catch (err) {
          btn.disabled = false; btn.textContent = "到账";
          toast(err.network ? "网络中断，这笔可能已经到账——先刷新看一眼再决定" : err.message);
        }
      };
    });
    // summary.count 是 COUNT(*)，不受 LIMIT 影响：两者不等说明结果被截断了。
    // 静默截断最坑——用户会以为「确实只有这些」，所以要明说。
    if (s.count > r.items.length) {
      box.insertAdjacentHTML("beforeend",
        `<div class="hint" style="text-align:center;padding:14px 8px 4px">
          只显示最近 ${r.items.length} 条（共 ${s.count} 笔）—— 缩小日期范围或再加个关键词
        </div>`);
    }
  } catch (e) { $("#list-body").innerHTML = `<div class="empty">${e.message}</div>`; }
}

/* 编辑时的归属候选：真人在册 + 这条记录原本的归属（防止老数据归属人不在列表里） */
function editOwners(t) {
  const list = ownerList().slice();
  if (t && !list.some(u => u.id === t.owner_id)) {
    list.push({ id: t.owner_id, display_name: t.owner_name || "原记录归属" });
  }
  return list;
}

function openEdit(id, items) {
  const t = items.find(x => x.id === id);
  if (!t) return;
  const tree = state.meta.categories[t.direction] || {};
  // 冲抵记录（挂了原单的退款 / 报销到账）的方向、大类、子类都由原单决定：
  // 服务端 PATCH 会无条件覆盖这三个字段，前端给了下拉也是白改。所以这里整段只读。
  // 以前把继承来的分类塞进下拉、还能选中，改完保存「已保存」但没变化——2026-10-29 反馈的坑。
  const linked = t.direction === "refund" && ((t.link_count || 0) > 0 || !!t.parent_id);
  // 摊在多笔支出上的冲抵：金额一改就把各笔的钱冲散，只能去「冲抵分配」里逐笔调。
  // 服务端也是这么拒的（PATCH 返回「请到冲抵分配里改金额」），所以这里不给输入框。
  const multi = (t.link_count || 0) > 1;
  const parents = Object.keys(tree);
  if (t.cat_parent && !parents.includes(t.cat_parent)) parents.unshift(t.cat_parent);
  const subs = (tree[t.cat_parent] || []).slice();
  if (t.category && !subs.includes(t.category)) subs.unshift(t.category);
  const refunded = t.refunded_cents || 0;
  // 有「报销到账」记录时，已报销开关锁死：状态由那条记录决定，只能删记录来撤回。
  // 否则会演变成「标记改成未报销、冲抵记录还挂着」——两边各说各的。
  const reimbLocked = t.direction === "expense" && (t.reimb_cents || 0) > 0;
  // 说明块里要点名是哪一天到账的，比「有一条记录」清楚得多（老数据可能没有日期，那就省略）
  const reimbWhen = t.reimb_date ? "已于 " + t.reimb_date.slice(5) + " " : "";
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  $("#sheet").innerHTML = `
    <h3>编辑记录</h3>
    <div class="field"><label>金额</label>
      ${multi
        ? `<div class="ro"><span>${money(t.amount_cents)}</span><span class="ro-tag">分摊 ${t.link_count} 笔，去「冲抵分配」调</span></div>`
        : `<input id="e-amount" inputmode="decimal" value="${esc((t.amount_cents / 100).toFixed(2))}">`}</div>
    <div class="field"><label>方向</label>
      ${linked
        ? `<div class="ro"><span>退款 / 报销</span><span class="ro-tag">${t.offset_kind === "reimb" ? "报销到账" : "退货退款"}</span></div>`
        : `<select id="e-dir">${[["expense","支出"],["income","收入"],["refund","退款 / 报销"]]
            .map(([k,n])=>`<option value="${esc(k)}" ${t.direction===k?"selected":""}>${esc(n)}</option>`).join("")}</select>`}</div>
    ${linked ? `
    <div class="field"><label>大类 / 子类</label>
      <div class="ro"><span>${esc(t.cat_parent)} · <b>${esc(t.category)}</b></span><span class="ro-tag">跟随原消费</span></div></div>
    <div class="hint" style="margin:-4px 0 12px">
      ${multi
        ? `这笔分摊在 ${t.link_count} 笔支出上：标题里的分类取<b>分配金额最大的那一笔</b>
           （现在是 ${esc(t.cat_parent)} · ${esc(t.category)}），统计时按各笔自己的分类分别抵扣。
           要换主原单，改分配金额就行。`
        : `这笔挂在原消费上，分类跟着它走，统计时按原消费的类目抵扣。`}
      要改分类，${t.parent_id ? '去<a class="linkbtn" id="e-go-parent">原单</a>里改' : "先解除冲抵"}。
    </div>` : `
    <div class="field"><label>大类</label>
      <select id="e-parent">${parents.map(p=>`<option ${t.cat_parent===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
    <div class="field"><label>子类</label>
      <select id="e-cat">${subs.map(s=>`<option ${t.category===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`}
    <div class="field"><label>日期</label><input type="date" id="e-date" value="${esc(t.tx_date)}"></div>
    <div class="field"><label>归属</label>
      ${t.parent_id
        ? `<div class="ro"><span>${esc(t.owner_name || "")}</span><span class="ro-tag">跟随原账单</span></div>
           <div class="hint" style="margin:6px 0 0">冲抵记录的归属跟着原账单走——否则明细按一个人显示、统计按另一个人抵扣。要改归属，去原账单里改。</div>`
        : `<select id="e-owner">${editOwners(t).map(u=>`<option value="${esc(u.id)}" ${t.owner_id===u.id?"selected":""}>${esc(u.display_name)}</option>`).join("")}</select>`}</div>
    <div class="field"><label>备注</label><input id="e-note" maxlength="100" value="${esc(t.note || "")}"></div>
    ${reimbLocked ? `
      <div class="lock-note">
        <b>报销状态已锁定</b>
        本笔的报销${reimbWhen}到账 ${money(t.reimb_cents)}，报销状态以该记录为准，不能在此修改。
        如需变更，请先删除明细中的「报销到账」记录；删除后本笔恢复为「待报销」。
      </div>` : ""}
    <div class="toggles grid4" style="margin:14px 0">
      <button class="tg ${t.shared?"on":""}" id="e-shared"><span class="dot"></span><span>共同支出</span></button>
      ${t.direction === "expense" ? `<button class="tg ${t.pending_use?"on":""}" id="e-voucher"><span class="dot"></span><span>待用券</span></button>` : ""}
      ${t.direction === "expense" ? `<button class="tg ${t.travel?"on":""}" id="e-travel"><span class="dot"></span><span>旅行</span></button>` : ""}
      ${t.direction === "expense" ? `
        <button class="tg ${t.reimb_pending?"on":""}" id="e-pending" ${reimbLocked?"disabled":""}><span class="dot"></span><span>待报销</span></button>
        ${reimbLocked ? `<button class="tg on" disabled><span class="dot"></span><span>已报销（有到账记录）</span></button>` : ""}` : ""}
    </div>
    ${t.direction === "refund" ? `
      <div class="refund-src">
        <div class="rs-t">${(t.link_count || 0) > 1
          ? (t.offset_kind === "reimb" ? "报销冲抵 " : "冲抵 ") + t.link_count + " 笔支出"
          : (t.parent_id
             ? (t.offset_kind === "reimb" ? "报销冲抵 " : "冲抵 ") + t.parent_date + " " + t.parent_cat_parent + " · " + t.parent_category + " " + money(t.parent_amount)
             : (t.offset_kind === "reimb" ? "无主报销（没有关联支出）" : "无主退款（没有关联支出）"))}</div>
        <div class="rs-s">${(t.link_count || 0) > 1
          ? "统计里按各笔原消费的分类分别抵扣"
          : (t.parent_id ? "统计里会抵扣这笔原消费" : "只减少当月净支出，不影响分类占比")}</div>
      </div>
      <button class="btn ghost small" id="e-links">冲抵分配${(t.link_count || 0) ? " · " + t.link_count + " 笔" : ""}</button>
      <div style="height:10px"></div>
      ${t.parent_id ? '<button class="btn ghost small" id="e-unlink">解除冲抵</button><div style="height:10px"></div>' : ""}
    ` : ""}
    ${t.direction === "expense" && (refunded > 0 || (t.reimb_cents || 0) > 0) ? `
      <div class="card" style="margin:12px 0">
        <h3>冲抵记录${refunded > 0 ? " · 已退 " + money(refunded) : ""}${(t.reimb_cents || 0) > 0 ? " · 已报 " + money(t.reimb_cents) : ""}</h3>
        <div id="e-refund-list"><div class="hint">加载中…</div></div>
      </div>` : ""}
    <button class="btn" id="e-save">保存</button>
    <div style="height:8px"></div>
    <button class="btn danger" id="e-del">删除这条</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="e-cancel">取消</button>`;

  const epSel = $("#e-parent");
  if (epSel) epSel.onchange = e => {
    const p = e.target.value;
    const list = tree[p];
    if (!list) return;              // 从原单继承来的分类，没有可选子类
    $("#e-cat").innerHTML = list.map(s => `<option>${s}</option>`).join("");
  };
  // 冲抵记录改分类 = 改原单分类，这里直接把原单编辑页拉出来，省得自己去找那一天
  const goParent = $("#e-go-parent");
  if (goParent) goParent.onclick = async () => {
    try {
      const r = await api(`/tx?month=${(t.parent_date || t.tx_date).slice(0, 7)}`);
      const it = (r.items || []).find(x => x.id === t.parent_id);
      if (!it) return toast("原单不在这个月的列表里");
      openEdit(it.id, r.items);
    } catch (e) { toast(e.message); }
  };
  $("#e-shared").onclick = e => e.currentTarget.classList.toggle("on");
  const ev = $("#e-voucher");
  if (ev) ev.onclick = e => e.currentTarget.classList.toggle("on");
  const et = $("#e-travel");
  if (et) et.onclick = e => e.currentTarget.classList.toggle("on");
  const ep = $("#e-pending");
  const er = $("#e-reimb");
  // 有报销到账记录时两个开关都是死的：状态由那条记录决定，改标记只会让两边打架。
  // disabled 属性对 <button> 本身就能挡住 click，这里再判一次是防手滑点穿。
  if (ep && !ep.disabled) ep.onclick = e => {
    const on = e.currentTarget.classList.toggle("on");
    if (on && er) er.classList.remove("on");
  };
  if (er && !er.disabled) er.onclick = e => {
    const on = e.currentTarget.classList.toggle("on");
    if (on && ep) ep.classList.remove("on");
  };
  const unlink = $("#e-unlink");
  if (unlink) unlink.onclick = async () => {
    if (!confirm("解除冲抵？这笔退款会变成无主退款。")) return;
    try {
      await api(`/tx/${t.id}`, { method: "PATCH", body: { parent_id: null } });
      closeSheet(); toast("已解除冲抵"); loadList();
    } catch (e) { toast(e.message); }
  };
  const linksBtn = $("#e-links");
  if (linksBtn) linksBtn.onclick = () => openLinks(t);
  if (t.direction === "expense" && (refunded > 0 || (t.reimb_cents || 0) > 0)) {
    api(`/refunds?parent=${t.id}`).then(r => {
      const box = $("#e-refund-list");
      if (!box) return;
      box.innerHTML = r.items.length ? r.items.map(x => `
        <div class="refund-line">
          <span>${esc(x.tx_date)} · ${x.offset_kind === "reimb" ? "报销" : "退货"} · ${esc(x.owner_name)}</span>
          <span class="mono">↩ ${money(x.amount_cents)}</span>
          <button class="a-del" data-del-offset="${x.id}">删除</button>
        </div>`).join("") : '<div class="hint">没有明细</div>';
      // 删掉一条冲抵 = 撤回那次退款/到账：原单的已退金额和报销状态都会跟着重算
      box.querySelectorAll("[data-del-offset]").forEach(b => b.onclick = async () => {
        if (!confirm("删除这条冲抵记录？原单的已退 / 已报销状态会跟着回退，"
                     + "而且会改动这笔消费所在月份的净支出。")) return;
        try {
          await api(`/tx/${b.dataset.delOffset}`, { method: "DELETE" });
          closeSheet(); toast("已删除，状态已回退"); loadList();
        } catch (e) { toast(e.message); }
      });
    }).catch(() => {});
  }
  if ($("#e-amount")) bindAmountInput($("#e-amount"));
  $("#e-cancel").onclick = closeSheet;
  $("#e-save").onclick = () => withBusy($("#e-save"), async () => {
    // 冲抵记录的方向 / 分类不随请求发：服务端本来就按原单覆盖，
    // 发了只会让人以为前端在生效（实际被丢掉）。多笔分摊时金额也不发。
    // 后端 B-02 会拒空日期，前端先拦：省一次网络往返，也让提示落在这个弹层上
    const dateVal = ($("#e-date").value || "").trim();
    if (!dateVal) return toast("选个日期");
    const body = {
      tx_date: dateVal,
      shared: $("#e-shared").classList.contains("on"),
      pending_use: $("#e-voucher") ? $("#e-voucher").classList.contains("on") : false,
      travel: $("#e-travel") ? $("#e-travel").classList.contains("on") : false,
      reimb_pending: $("#e-pending") ? $("#e-pending").classList.contains("on") : false,
      // 「已报销」不发：它只由到账记录决定。以前这个开关可以手点，点完标记说已报、
      // 净支出一分没减，月底对账才发现对不上（R14）。服务端也不再接受手填。
      note: $("#e-note").value,
    };
    // 冲抵记录的归属由原单决定（服务端也无条件覆盖），不发这个字段，别让人以为发了就生效
    if (!t.parent_id) body.owner_id = +$("#e-owner").value;
    if (!multi) {
      const amtCents = parseAmount($("#e-amount").value);
      if (!amtCents) return toast("金额只能填数字，最多两位小数");
      body.amount_cents = amtCents;
    }
    if (!linked) {
      body.direction = $("#e-dir").value;
      body.cat_parent = $("#e-parent").value;
      body.category = $("#e-cat").value;
    }
    try {
      await api(`/tx/${t.id}`, { method: "PATCH", body });
      closeSheet(); toast("已保存"); loadList();
    } catch (e) { toast(e.message); }
  });
  $("#e-del").onclick = async () => {
    const warn = refunded > 0 ? `\n注意：这笔下面有 ${money(refunded)} 退款，删除后会变成无主退款。` : "";
    if (!confirm("确定删除这条记录？" + warn)) return;
    try { await api(`/tx/${t.id}`, { method: "DELETE" }); closeSheet(); toast("已删除"); loadList(); }
    catch (e) { toast(e.message); }
  };
}

/* ---- 冲抵分配：一条到账 / 退款摊在多笔支出上 ----
   公司一次打回 900，对应的可能是 700+200 两张单。顺序接口由后端保证金额守恒，
   这里只负责把改动攒在 state.alloc 里，点保存才整体提交（一次请求，不留中间态）。 */
async function openLinks(t) {
  let d;
  try { d = await api(`/tx/${t.id}/links`); } catch (e) { return toast(e.message); }
  state.allocOffset = t.id;
  state.allocTotal = d.offset.amount_cents;
  state.alloc = (d.items || []).map(x => ({
    parent_id: x.parent_id, amount_cents: x.alloc_cents,
    tx_date: x.tx_date, cat_parent: x.cat_parent, category: x.category,
    note: x.note, parent_cents: x.parent_cents, max_cents: x.max_cents,
  }));
  renderLinks();
}

function closeLinks() {
  $("#mask2").classList.remove("on");
  $("#sheet2").classList.remove("on");
  state.alloc = []; state.allocOffset = null;
}

const allocUsed = () => state.alloc.reduce((s, x) => s + x.amount_cents, 0);

function renderLinks() {
  const used = allocUsed();
  const left = state.allocTotal - used;
  $("#mask2").classList.add("on");
  $("#sheet2").classList.add("on");
  $("#sheet2").innerHTML = `
    <h3>冲抵分配</h3>
    <div class="alloc-sum">
      <span>本笔 <b>${money(state.allocTotal)}</b></span>
      <span>已分配 <b>${money(used)}</b></span>
      <span>未分配 <b class="${left < 0 ? "over" : ""}">${money(left)}</b></span>
    </div>
    <div class="hint" style="margin-bottom:12px">未分配的部分按「无主」算在到账当月，不影响任何分类。</div>
    ${state.alloc.length ? state.alloc.map((x, i) => `
      <div class="alloc">
        <div class="a-top">
          <span class="a-cat">${x.tx_date.slice(5)} ${x.cat_parent} · ${x.category}</span>
          <span class="hint">原额 ${money(x.parent_cents)}</span>
        </div>
        ${x.note ? `<div class="a-note">${esc(x.note)}</div>` : ""}
        <div class="a-in">
          <span class="hint">本次</span>
          <input inputmode="decimal" data-alloc-in="${esc(i)}" value="${esc((x.amount_cents / 100).toFixed(2))}">
          <button class="a-del" data-alloc-del="${i}">删除</button>
        </div>
        <div class="hint" style="margin-top:6px">这笔最多还能冲抵 ${money(x.max_cents)}</div>
      </div>`).join("")
      : '<div class="hint" style="margin-bottom:12px">还没有分配，这笔到账会按「无主」算在当月。</div>'}
    <button class="btn ghost small" id="alloc-add">+ 添加一笔支出</button>
    <div id="alloc-picker" hidden style="margin-top:10px"></div>
    <div style="height:14px"></div>
    <button class="btn" id="alloc-save">保存分配</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="alloc-close">返回</button>`;

  $("#sheet2").querySelectorAll("[data-alloc-in]").forEach(inp => {
    inp.onchange = () => {
      const v = parseAmount(inp.value);
      if (!v) { toast("金额只能填数字，最多两位小数"); return renderLinks(); }
      state.alloc[+inp.dataset.allocIn].amount_cents = v;
      renderLinks();
    };
  });
  $("#sheet2").querySelectorAll("[data-alloc-del]").forEach(b => {
    b.onclick = () => { state.alloc.splice(+b.dataset.allocDel, 1); renderLinks(); };
  });
  $("#alloc-close").onclick = closeLinks;
  $("#mask2").onclick = closeLinks;
  $("#alloc-add").onclick = async () => {
    const picker = $("#alloc-picker");
    picker.hidden = false;
    picker.innerHTML = '<div class="hint">查找中…</div>';
    const rest = Math.max(0, state.allocTotal - allocUsed());
    try {
      // 不带 kind：这里要的是「任何还有余额的支出」，不是「还没报过的支出」——
      // 已经部分报销的单后面还得继续报，不能从候选里消失
      const r = await api(`/refund-targets?amount_cents=${rest}`);
      const taken = new Set(state.alloc.map(x => x.parent_id));
      const items = (r.items || []).filter(x => !taken.has(x.id));
      picker.innerHTML = items.length
        ? `<div class="chips">${items.map(x => `<button class="chip" data-pick="${x.id}">${x.tx_date.slice(5)} ${x.category} ${money(x.remain_cents)}</button>`).join("")}</div>`
        : '<div class="hint">近 30 天没有还能冲抵的支出。</div>';
      picker.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
        const it = items.find(x => String(x.id) === b.dataset.pick);
        if (!it) return;
        const left = Math.max(0, state.allocTotal - allocUsed());
        state.alloc.push({
          parent_id: it.id,
          // 优先用未分配余额；已经分满了就先按这笔的剩余额度放着，让人自己往下压
          amount_cents: left > 0 ? Math.min(left, it.remain_cents) : it.remain_cents,
          tx_date: it.tx_date, cat_parent: it.cat_parent, category: it.category,
          note: it.note, parent_cents: it.amount_cents, max_cents: it.remain_cents,
        });
        renderLinks();
      });
    } catch (e) {
      picker.innerHTML = `<div class="hint">${esc(e.message)}</div>`;
    }
  };
  $("#alloc-save").onclick = () => withBusy($("#alloc-save"), async () => {
    if (!state.alloc.length && !confirm("不给这笔到账分配支出？它会按「无主」算在当月。")) return;
    try {
      await api(`/tx/${state.allocOffset}/links`, {
        method: "POST",
        body: { items: state.alloc.map(x => ({ parent_id: x.parent_id, amount_cents: x.amount_cents })) },
      });
      closeLinks(); closeSheet(); toast("分配已保存"); loadList();
    } catch (e) { toast(e.message); }
  });
}

/* ---- 从某笔支出发起退款 ---- */
function openRefund(t) {
  if (!t) return;
  const refunded = t.refunded_cents || 0;
  const remain = t.remain_cents == null ? Math.max(0, t.amount_cents - refunded) : t.remain_cents;
  if (remain <= 0) return toast("这笔已经全部退完了");
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
  $("#sheet").innerHTML = `
    <h3>记一笔退款</h3>
    <div class="refund-src">
      <div class="rs-t">冲抵：${esc(t.tx_date)} ${esc(t.cat_parent)} · ${esc(t.category)}</div>
      <div class="rs-s">原金额 ${money(t.amount_cents)}${refunded ? " · 已退 " + money(refunded) : ""} · 还能退 ${money(remain)}</div>
    </div>
    <div class="field"><label>退款金额</label><input id="r-amount" inputmode="decimal" value="${esc((remain / 100).toFixed(2))}"></div>
    <div class="field"><label>到账日期</label><input type="date" id="r-date" value="${esc(today())}"></div>
    <div class="field"><label>备注</label><input id="r-note" placeholder="可选，如「退一件」"></div>
    <button class="btn" id="r-save">确认退款</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="r-cancel">取消</button>`;
  bindAmountInput($("#r-amount"));
  $("#r-cancel").onclick = closeSheet;
  $("#r-save").onclick = () => withBusy($("#r-save"), async () => {
    const cents = parseAmount($("#r-amount").value);
    if (!cents) return toast("请输入退款金额");
    if (cents > remain) return toast(`最多还能退 ${money(remain)}`);
    try {
      const r = await api("/tx", { method: "POST", body: {
        tx_date: $("#r-date").value || today(), direction: "refund", parent_id: t.id,
        amount_cents: cents, owner_id: t.owner_id, note: $("#r-note").value || "",
      }});
      closeSheet(); loadList();
      toast(r.cleared ? "已全部退完，原单标记已清除" : "已记退款并冲抵");
    } catch (e) { toast(e.message); }
  });
}
